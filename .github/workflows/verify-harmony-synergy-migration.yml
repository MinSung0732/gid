name: Verify Harmony canonical synergy migration

on:
  push:
    branches:
      - dev5/synergy-canonical-migration

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:harmony
      - run: npm run test:harmony
      - run: npm run check
      - run: npm test
      - run: git diff --check HEAD^ HEAD
