name: harmony-phase2-overlay-edit

on:
  push:
    branches:
      - refactor/harmony-main-phase2-overlay

permissions:
  contents: write

jobs:
  apply-bounded-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: refactor/harmony-main-phase2-overlay
          fetch-depth: 0
      - name: Verify expected main source
        run: test "$(git hash-object games/harmony/main.js)" = "761f80ce1044c55fcd00e0bf8da930fa02116021"
      - name: Apply exact overlay extraction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("games/harmony/main.js")
          text = path.read_text(encoding="utf-8")
          anchor_import = '''import {
            getPlayerHealthAnchor,
            getPlayerImpactPoint,
          } from "./player-vfx-anchor.js";
          '''
          overlay_import = '''import {
            placeBattleOverlay,
            showBattleShieldOverlay,
            syncBattleStateFrame,
          } from "./battle-overlay.js";
          '''
          if text.count(anchor_import) != 1:
              raise SystemExit("expected player VFX anchor import exactly once")
          if './battle-overlay.js' in text:
              raise SystemExit("battle overlay import already present")
          text = text.replace(anchor_import, anchor_import + overlay_import, 1)

          start = text.index("function placeBattleOverlay(")
          end = text.index("function showPlayerDamage(", start)
          block = text[start:end]
          for name in (
              "function placeBattleOverlay(",
              "function syncBattleStateFrame(",
              "function showBattleShieldOverlay(",
          ):
              if block.count(name) != 1:
                  raise SystemExit(f"expected {name} exactly once in extraction block")
          text = text[:start] + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify syntax and patch shape
        run: |
          node --check games/harmony/main.js
          node --check games/harmony/battle-overlay.js
          node --check scripts/test-harmony-battle-overlay.mjs
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "games/harmony/main.js "
      - name: Remove task-owned edit workflow
        run: rm .github/workflows/harmony-phase2-overlay-edit.yml
      - name: Commit bounded extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/harmony/main.js .github/workflows/harmony-phase2-overlay-edit.yml
          git commit -m "refactor(harmony): route battle overlays through module"
          git push origin HEAD:refactor/harmony-main-phase2-overlay
