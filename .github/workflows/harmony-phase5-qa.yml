          git status --short

      - name: Syntax check final HEAD
        run: npm run check:harmony

      - name: Harmony test suite final HEAD
        run: npm run test:harmony

      - name: Verify final HEAD diff whitespace
        run: git diff --check HEAD^ HEAD

      - name: Push final Step 5 HEAD
        run: git push origin HEAD:main
