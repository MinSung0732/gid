name: mission-export-harmony-step4-bfa57998

on:
  push:
    branches:
      - refactor/harmony-main-phase2-attack-vfx

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact develop source
        uses: actions/checkout@v4
        with:
          ref: 6c5e57325304e7d5eb790cf823c3c3611f4dda60
          fetch-depth: 0
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "6c5e57325304e7d5eb790cf823c3c3611f4dda60"
      - name: Build exact source bundle
        run: |
          git bundle create harmony-step4-source.bundle HEAD
          sha256sum harmony-step4-source.bundle > harmony-step4-source.sha256
          printf '%s\n' 'repository=MinSung0732/gid' 'source_sha=6c5e57325304e7d5eb790cf823c3c3611f4dda60' > harmony-step4-source.provenance
      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: harmony-step4-source-bfa57998
          path: |
            harmony-step4-source.bundle
            harmony-step4-source.sha256
            harmony-step4-source.provenance
          retention-days: 1
