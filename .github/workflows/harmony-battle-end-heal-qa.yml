name: Harmony battleEndHeal temporary QA

on:
  push:
    branches:
      - fix/harmony-feedback-flush-vfx

jobs:
  battle-end-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Verify diff whitespace
        run: git diff --check HEAD~1 HEAD
      - name: Check Harmony syntax
        run: npm run check:harmony
      - name: Run Harmony regression suite
        run: npm run test:harmony
      - name: Start Harmony server
        run: |
          node scripts/serve.cjs > /tmp/harmony-server.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:5173/games/harmony/qa-battle-end-heal.html >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/harmony-server.log
          exit 1
      - name: Chromium battleEndHeal probe
        env:
          QA_EXPECT_FIXED: "1"
        run: python scripts/qa-harmony-battle-end-heal.py
