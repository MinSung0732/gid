name: mission-publish-harmony-phase3-reward-8f9f1206

on:
  push:
    branches:
      - refactor/harmony-main-phase3-reward-ui

permissions:
  contents: write

jobs:
  publish-exact-result:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify task-owned source state
        shell: bash
        run: |
          set -euo pipefail
          base=78c7abc6d88b714c34169722eaa65d97abc74ad1
          test "$(git merge-base HEAD "$base")" = "$base"
          changed="$(git diff --name-only "$base" HEAD)"
          test "$changed" = ".github/workflows/mission-publish-harmony-phase3-reward-8f9f1206.yml"
      - name: Reproduce verified sandbox result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          main_path = root / 'games/harmony/main.js'
          s = main_path.read_text()
          needle = 'import { createCodexUi } from "./codex-ui.js";\n'
          if needle not in s:
              raise SystemExit('codex import anchor missing')
          s = s.replace(needle, needle + 'import { createRewardUi } from "./reward-ui.js";\n', 1)
          start = s.index('function rewardSourceLabel(source) {')
          end = s.index('function content() {', start)
          removed = s[start:end]
          for name in ['rewardSourceLabel', 'rewardOptionMarkup', 'rewardRoom']:
              if f'function {name}(' not in removed:
                  raise SystemExit(f'missing reward function {name}')
          wiring = '''const { rewardRoom } = createRewardUi({
            getRun: () => run,
            currentRewardOffer: E.currentRewardOffer,
            power: E.power,
            cardHtml,
            itemHtml,
            formatNumber: number,
          });
          '''
          s = s[:start] + wiring + s[end:]
          main_path.write_text(s)

          reward_module = '''import { CARDS, ITEMS } from "./data.js?v=20260913-1";

          export function createRewardUi({
            getRun,
            currentRewardOffer,
            power,
            cardHtml,
            itemHtml,
            formatNumber,
          }) {
            const number = formatNumber;

            function rewardSourceLabel(source) {
              return {
                combat: "전투 보상",
                gather: "채집 보상",
                golden: "황금 보물",
                elite: "엘리트 보상",
                boss: "보스 보상",
                signatureBoss: "Signature 보상",
                treasureEvent: "이벤트 보상",
                curseEvent: "계약 보상",
              }[source] || "보상";
            }

            function rewardOptionMarkup(option) {
              if (option.type === "card" && CARDS[option.id])
                return `<article class="reward-offer-option reward-offer-card">${cardHtml({ id: option.id, level: 0 }, null, {
                  action: "reward-claim",
                  card: option.id,
                  optionId: option.optionId,
                  className: "reward-select-card",
                  ariaLabel: `${CARDS[option.id].name} 카드 획득`,
                })}<button data-action="reward-claim" data-option="${option.optionId}" data-card="${option.id}">이 카드 획득</button></article>`;
              if (option.type === "item" && ITEMS[option.id])
                return `<article class="reward-offer-option reward-item reward-tier-${ITEMS[option.id].tier}">${itemHtml(option.id)}<button data-action="reward-claim" data-option="${option.optionId}">보상 획득</button></article>`;
              if (option.type === "gold")
                return `<article class="reward-offer-option reward-gold-option"><span aria-hidden="true">●</span><strong>${number(option.amount || 0)}G</strong><small>대체 보상</small><button data-action="reward-claim" data-option="${option.optionId}">골드 획득</button></article>`;
              return "";
            }

            function rewardRoom() {
              const run = getRun(),
                reward = run?.reward,
                offer = run ? currentRewardOffer(run) : null;
              if (!reward || !offer)
                return `<section class="room"><p class="eyebrow">DISCOVERY</p><h1>보상 정리 중</h1><p>완료된 보상을 정리하고 다음 방으로 이동합니다.</p></section>`;
              const options = (offer.options || []).filter((option) => !option.claimed),
                battleCardProgress = reward.metadata?.battleCardReward,
                totalGroups = battleCardProgress?.totalGroups || reward.groups?.length || 1,
                currentGroup = battleCardProgress
                  ? Math.min(
                      totalGroups,
                      Math.max(
                        1,
                        Number(offer.metadata?.groupIndex) || Number(battleCardProgress.generatedGroups) || 1,
                      ),
                    )
                  : Math.min(totalGroups, (reward.activeGroupIndex || 0) + 1),
                canPickMore = offer.remainingPicks > 0,
                eventText = reward.metadata?.eventText,
                groupProgress = totalGroups > 1 ? `<small class="reward-group-progress">보상 그룹 ${currentGroup} / ${totalGroups}</small>` : "",
                remaining = canPickMore
                  ? `<p class="reward-pick-copy">후보 ${options.length}개 · 최대 <b>${offer.remainingPicks}개</b> 더 획득할 수 있습니다. 원하는 만큼만 받고 나머지는 포기할 수 있습니다.</p>`
                  : "",
                goldCopy = reward.gold > 0
                  ? `<p class="reward-base-gold">기본 골드 보상 <b>${number(reward.gold)}G</b>${!reward.goldIncludesBonus && power(run, "goldBonus") ? ` · 보너스 +${power(run, "goldBonus")}G` : ""}</p>`
                  : "";
              return `<section class="room reward-room"><p class="eyebrow">${rewardSourceLabel(offer.source).toUpperCase()}</p>${groupProgress}<h1>${eventText ? "결과를 확인하세요" : "원하는 보상을 선택하세요"}</h1>${eventText ? `<p class="reward-event-copy">${eventText}</p>` : ""}${goldCopy}${remaining}<div class="choices reward-offer-options${offer.rewardPool === "active" ? " card-reward-choices" : ""}">${options.map(rewardOptionMarkup).join("") || '<p class="hint">획득 가능한 후보가 없습니다.</p>'}</div>${offer.allowSkip ? `<button class="primary reward-skip-button" data-action="reward-skip">${offer.claimedOptionIds?.length ? "남은 보상 포기하고 진행 →" : "받지 않고 진행 →"}</button>` : ""}</section>`;
            }

            return { rewardRoom };
          }
          '''
          (root / 'games/harmony/reward-ui.js').write_text(reward_module)

          test_source = '''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import { CARDS, ITEMS } from "../games/harmony/data.js?v=20260913-1";
          import { createRewardUi } from "../games/harmony/reward-ui.js";

          const main = await readFile(new URL("../games/harmony/main.js", import.meta.url), "utf8");
          const rewardSource = await readFile(new URL("../games/harmony/reward-ui.js", import.meta.url), "utf8");

          assert.match(main, /from "\\.\\/reward-ui\\.js"/, "main should consume the reward UI module");
          assert.match(
            main,
            /createRewardUi\\(\\{[\\s\\S]*?getRun:[\\s\\S]*?currentRewardOffer:\\s*E\\.currentRewardOffer[\\s\\S]*?power:\\s*E\\.power[\\s\\S]*?cardHtml[\\s\\S]*?itemHtml[\\s\\S]*?formatNumber:\\s*number[\\s\\S]*?\\}\\)/s,
            "main should inject existing reward state/render helpers",
          );
          for (const name of ["rewardSourceLabel", "rewardOptionMarkup", "rewardRoom"]) {
            assert.doesNotMatch(main, new RegExp(`function ${name}\\\\(`), `${name} implementation should live outside main.js`);
            assert.match(rewardSource, new RegExp(`function ${name}\\\\(`), `${name} should remain implemented by reward-ui.js`);
          }
          assert.match(main, /case "reward":\\s*return rewardRoom\\(\\);/s, "reward phase should keep using the extracted renderer");

          const cardId = Object.keys(CARDS).find((id) => id !== "impurity");
          const itemId = Object.keys(ITEMS)[0];
          let run = null;
          const offer = {
            source: "combat",
            rewardPool: "active",
            remainingPicks: 2,
            allowSkip: true,
            claimedOptionIds: ["claimed"],
            metadata: { groupIndex: 2 },
            options: [
              { optionId: "card-1", type: "card", id: cardId },
              { optionId: "item-1", type: "item", id: itemId },
              { optionId: "gold-1", type: "gold", amount: 17 },
              { optionId: "claimed", type: "gold", amount: 99, claimed: true },
            ],
          };
          const { rewardRoom } = createRewardUi({
            getRun: () => run,
            currentRewardOffer: () => offer,
            power: (_run, id) => id === "goldBonus" ? 3 : 0,
            cardHtml: (card, _index, interaction) => `CARD:${card.id}:${interaction.optionId}`,
            itemHtml: (id) => `ITEM:${id}`,
            formatNumber: (value) => String(value),
          });

          assert.match(rewardRoom(), /보상 정리 중/, "missing reward state should keep the transition placeholder");
          run = {
            reward: {
              gold: 13,
              goldIncludesBonus: false,
              activeGroupIndex: 0,
              groups: [{}, {}],
              metadata: { battleCardReward: { totalGroups: 3, generatedGroups: 2 } },
            },
          };
          const html = rewardRoom();
          assert.match(html, /전투 보상/i);
          assert.match(html, /보상 그룹 2 \\/ 3/);
          assert.match(html, /기본 골드 보상 <b>13G<\\/b> · 보너스 \\+3G/);
          assert.match(html, new RegExp(`CARD:${cardId}:card-1`));
          assert.match(html, new RegExp(`ITEM:${itemId}`));
          assert.match(html, /<strong>17G<\\/strong>/);
          assert.doesNotMatch(html, /99G/, "claimed options should remain hidden");
          assert.match(html, /card-reward-choices/);
          assert.match(html, /남은 보상 포기하고 진행/);
          assert.match(html, /최대 <b>2개<\\/b>/);

          console.log("PASS Harmony reward UI is modular without changing reward option, progress, gold, or skip contracts.");
          '''
          (root / 'scripts/test-harmony-reward-ui.mjs').write_text(test_source)

          package_path = root / 'package.json'
          data = json.loads(package_path.read_text())
          check = data['scripts']['check:harmony']
          check = check.replace(
              'node --check games/harmony/codex-ui.js',
              'node --check games/harmony/codex-ui.js && node --check games/harmony/reward-ui.js',
          )
          check = check.replace(
              'node --check scripts/test-harmony-codex-ui.mjs',
              'node --check scripts/test-harmony-codex-ui.mjs && node --check scripts/test-harmony-reward-ui.mjs',
          )
          data['scripts']['check:harmony'] = check
          tests = data['scripts']['test:harmony']
          tests = tests.replace(
              'node scripts/test-harmony-codex-ui.mjs',
              'node scripts/test-harmony-codex-ui.mjs && node scripts/test-harmony-reward-ui.mjs',
          )
          data['scripts']['test:harmony'] = tests
          package_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          rm .github/workflows/mission-publish-harmony-phase3-reward-8f9f1206.yml
          git add -A
          test "$(git write-tree)" = "8f9f1206947bbe4dddece0c28027e10b933d4460"
      - name: Verify Harmony and repository tests
        run: |
          npm run check:harmony
          npm run test:harmony
          npm test
      - name: Commit and publish exact tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "8f9f1206947bbe4dddece0c28027e10b933d4460"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(harmony): extract reward UI from main"
          git push origin HEAD:refactor/harmony-main-phase3-reward-ui
