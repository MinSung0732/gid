name: mission-step9-mobile-qa-2c6e9f4a

on:
  push:
    branches:
      - feature/harmony-step9-mobile-battle-2c6e9f4a

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frozen base and source scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base origin/main HEAD)" = "fc1162c2a73df1f342ceef9690a553b67d9d33d8"
          test "$(git rev-parse origin/main)" = "fc1162c2a73df1f342ceef9690a553b67d9d33d8"
          git diff --check -- games/harmony
          git diff --check origin/main...HEAD -- games/harmony
          changed="$(git diff --name-only origin/main...HEAD)"
          printf 'STEP9_CHANGED_FILES\n%s\n' "$changed"
          for file in $changed; do
            case "$file" in
              .github/workflows/mission-step9-mobile-qa-2c6e9f4a.yml|games/harmony/index.html|games/harmony/mobile-battle-ui.css|games/harmony/mobile-battle-ui.js|package.json|scripts/test-harmony-step9-mobile-ui.mjs|scripts/mission-step9-mobile-qa-2c6e9f4a.mjs|scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs) ;;
              *) echo "Unexpected Step 9 file: $file" >&2; exit 1 ;;
            esac
          done
      - name: Apply confirmed portrait hand clipping fix if needed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('games/harmony/mobile-battle-ui.css')
          text = path.read_text()
          old = 'grid-template-rows: 24px minmax(150px, 1fr) auto 30px minmax(188px, 214px) 44px;'
          new = 'grid-template-rows: 24px minmax(150px, 1fr) auto 30px 224px 44px;'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('portrait hand grid row not found')
          PY
          if ! git diff --quiet -- games/harmony/mobile-battle-ui.css; then
            git config user.name "MinSung_Jo"
            git config user.email "152842047+MinSung0732@users.noreply.github.com"
            git add games/harmony/mobile-battle-ui.css
            git commit -m "fix(harmony): prevent portrait hand vertical clipping"
            git push origin HEAD:feature/harmony-step9-mobile-battle-2c6e9f4a
          fi
      - name: Apply confirmed mobile status tap isolation if needed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('games/harmony/mobile-battle-ui.js')
          text = path.read_text()
          marker = '''if (baseFrame) {\n  window.HarmonyPcFrame = Object.freeze({'''
          helper = '''function toggleMobileStatusDetail(term) {\n  document.querySelectorAll("[data-term].tip-open").forEach((item) => {\n    if (item !== term) {\n      item.classList.remove("tip-open");\n      item.setAttribute("aria-expanded", "false");\n    }\n  });\n  const opened = term.classList.toggle("tip-open");\n  term.setAttribute("aria-expanded", String(opened));\n}\n\ndocument.addEventListener(\n  "click",\n  (event) => {\n    if (!isMobileBattle()) return;\n    const status = event.target.closest(".enemy .status-chip[data-term]");\n    if (!status) return;\n    event.stopPropagation();\n    toggleMobileStatusDetail(status);\n  },\n  true,\n);\n\n'''
          if 'function toggleMobileStatusDetail(term)' not in text:
              if marker not in text:
                  raise SystemExit('mobile frame marker not found')
              path.write_text(text.replace(marker, helper + marker, 1))
          PY
          if ! git diff --quiet -- games/harmony/mobile-battle-ui.js; then
            git config user.name "MinSung_Jo"
            git config user.email "152842047+MinSung0732@users.noreply.github.com"
            git add games/harmony/mobile-battle-ui.js
            git commit -m "fix(harmony): isolate mobile status taps from enemy targeting"
            git push origin HEAD:feature/harmony-step9-mobile-battle-2c6e9f4a
          fi
      - name: Harmony static and regression suites
        run: |
          npm run check:harmony
          npm run test:harmony
      - name: Install Chromium acceptance runtime
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Add geometry diagnostics to temporary QA copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs')
          text = path.read_text()
          old = '    assert.ok(cardBox.y >= handBox.y - 1 && cardBox.bottom <= handBox.bottom + 1, `${mode.name}: card ${index + 1} vertically clipped`);'
          new = '''    if (!(cardBox.y >= handBox.y - 1 && cardBox.bottom <= handBox.bottom + 1)) console.log("STEP9_HAND_GEOMETRY", JSON.stringify({ mode: mode.name, fixture, handBox, cardIndex: index + 1, cardBox }));\n    assert.ok(cardBox.y >= handBox.y - 1 && cardBox.bottom <= handBox.bottom + 1, `${mode.name}: card ${index + 1} vertically clipped`);'''
          if old not in text:
              raise SystemExit('geometry assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Mobile and PC browser acceptance
        run: node scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs
      - name: Final source checks
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs
          git diff --check -- games/harmony
          npm run check:harmony
          npm run test:harmony
          test -z "$(git status --porcelain)"
          echo "STEP9_QA_WORKTREE_CLEAN=yes"
          echo "STEP9_QA_SHA=$(git rev-parse HEAD)"
