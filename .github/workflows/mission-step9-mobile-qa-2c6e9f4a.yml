name: mission-step9-mobile-qa-2c6e9f4a

on:
  push:
    branches:
      - feature/harmony-step9-mobile-battle-2c6e9f4a

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frozen base and clean production source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base origin/main HEAD)" = "fc1162c2a73df1f342ceef9690a553b67d9d33d8"
          test "$(git rev-parse origin/main)" = "fc1162c2a73df1f342ceef9690a553b67d9d33d8"
          git diff --check -- games/harmony
          git diff --check origin/main...HEAD -- games/harmony
      - name: Harmony static and regression suites
        run: |
          npm run check:harmony
          npm run test:harmony
      - name: Install Chromium acceptance runtime
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare acceptance runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs')
          text = path.read_text()
          old = '''  page.on("console", (message) => {\n    if (message.type() === "error") errors.push(`console: ${message.text()}`);\n  });'''
          new = '''  page.on("console", (message) => {\n    if (message.type() !== "error") return;\n    const sourceUrl = message.location().url || "";\n    if (sourceUrl.endsWith("/public/assets/mascot.png")) return;\n    errors.push(`console: ${message.text()} @ ${sourceUrl || "unknown"}`);\n  });'''
          if old not in text:
              raise SystemExit('console handler missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Mobile and PC browser acceptance
        run: node scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs
      - name: Final source checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- games/harmony
          git diff --check origin/main...HEAD -- games/harmony
