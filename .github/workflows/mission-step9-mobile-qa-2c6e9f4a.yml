name: mission-step9-mobile-qa-2c6e9f4a

on:
  push:
    branches:
      - feature/harmony-step9-mobile-battle-2c6e9f4a

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frozen base and source scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base origin/main HEAD)" = "fc1162c2a73df1f342ceef9690a553b67d9d33d8"
          test "$(git rev-parse origin/main)" = "fc1162c2a73df1f342ceef9690a553b67d9d33d8"
          git diff --check -- games/harmony
          git diff --check origin/main...HEAD -- games/harmony
      - name: Harmony static and regression suites
        run: |
          npm run check:harmony
          npm run test:harmony
      - name: Install Chromium acceptance runtime
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Convert acceptance runner to non-mutating diagnostic collector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs')
          text = path.read_text()
          insert_at = 'async function testMobile(browser) {'
          helper = '''const diagnosticFailures = [];\nasync function diagnostic(label, action) {\n  try {\n    await action();\n    console.log(`DIAG PASS ${label}`);\n    return true;\n  } catch (error) {\n    const message = error?.stack || error?.message || String(error);\n    diagnosticFailures.push(`${label}: ${message}`);\n    console.log(`DIAG FAIL ${label} :: ${message.split("\\n")[0]}`);\n    return false;\n  }\n}\n\n'''
          if insert_at not in text:
              raise SystemExit('testMobile marker missing')
          text = text.replace(insert_at, helper + insert_at, 1)

          old_status = '    assert.ok(statusExpanded === "true" || await status.locator(".status-detail").count(), `${mode}: status detail works by tap/focus`);'
          new_status = '''    const statusDetail = await status.locator(".status-detail").count();\n    const statusMeta = await status.evaluate((node) => ({ outerHTML: node.outerHTML, matchesDataTerm: node.matches(".enemy .status-chip[data-term]"), className: node.className }));\n    console.log("STEP9_STATUS_DIAG", JSON.stringify({ mode, statusExpanded, statusDetail, statusMeta }));\n    if (!(statusExpanded === "true" || statusDetail)) diagnosticFailures.push(`${mode}: status detail works by tap/focus`);'''
          if old_status not in text:
              raise SystemExit('status assertion missing')
          text = text.replace(old_status, new_status, 1)

          for action, dialog, close in [
              ('deck', '#run-summary', '#run-summary-close'),
              ('log', '#battle-log', '#battle-log-close'),
              ('codex', '#tools', '#tools-close'),
              ('settings', '#settings', '#settings-close'),
          ]:
              old = f'  await openClose("{action}", "{dialog}", "{close}");'
              new = f'  await diagnostic(`${{mode}} overlay {action}`, () => openClose("{action}", "{dialog}", "{close}"));'
              if old not in text:
                  raise SystemExit(f'overlay call missing: {action}')
              text = text.replace(old, new, 1)

          text = text.replace('        await assertMobileLayout(page, mode, fixture);', '        await diagnostic(`${mode.name} enemy=${fixture.enemies} hand=${fixture.hand} layout`, () => assertMobileLayout(page, mode, fixture));', 1)
          text = text.replace('          await assertDrawerAndOverlays(page, mode.name);', '          await diagnostic(`${mode.name} drawer`, () => assertDrawerAndOverlays(page, mode.name));', 1)
          text = text.replace('          await assertTouchDetails(page, mode.name);', '          await diagnostic(`${mode.name} touch`, () => assertTouchDetails(page, mode.name));', 1)
          text = text.replace('          if (mode.name === "390x844") await assertOrientation(page);', '          if (mode.name === "390x844") await diagnostic("orientation 390x844 -> 844x390 -> 390x844", () => assertOrientation(page));', 1)
          text = text.replace('        if (fixture.interaction) await assertInteraction(page, mode.name, fixture.hand);', '        if (fixture.interaction) await diagnostic(`${mode.name} target+card+turn`, () => assertInteraction(page, mode.name, fixture.hand));', 1)
          text = text.replace('        assert.deepEqual(errors, [], `${mode.name}: browser errors\\n${errors.join("\\n")}`);', '        await diagnostic(`${mode.name} browser errors`, async () => assert.deepEqual(errors, [], `${mode.name}: browser errors\\n${errors.join("\\n")}`));', 1)

          old_pc = '    await testPc(browser);\n    console.log("PASS Project Harmony Step 9 Mobile Battle UX browser acceptance v2");'
          new_pc = '''    await diagnostic("PC 1440+1366 regression", () => testPc(browser));\n    console.log("STEP9_DIAGNOSTIC_FAILURE_COUNT", diagnosticFailures.length);\n    diagnosticFailures.forEach((failure) => console.log("STEP9_DIAGNOSTIC_FAILURE", failure));\n    console.log("COMPLETE Project Harmony Step 9 non-mutating browser diagnostics");'''
          if old_pc not in text:
              raise SystemExit('main PC block missing')
          text = text.replace(old_pc, new_pc, 1)

          marker = '  assert.ok((await box(page.locator(".enemy").first())).width >= 90, `${mode.name}: enemy target hit area`);'
          addition = '''  assert.ok((await box(page.locator(".enemy").first())).width >= 90, `${mode.name}: enemy target hit area`);\n  if (mode.name === "932x430") {\n    console.log("STEP9_932_GEOMETRY", JSON.stringify({\n      fixture,\n      viewport,\n      field: await box(page.locator(".enemies-field")),\n      enemies: await Promise.all(Array.from({ length: fixture.enemies }, (_, i) => box(page.locator(".enemies-field > .enemy").nth(i)))),\n      hand: await box(page.locator(".battle > .hand")),\n      firstCard: await box(page.locator(".battle > .hand > .card").first()),\n      cardCount: await page.locator(".battle > .hand > .card").count(),\n      desktopEnemyRails: await page.locator(".enemy-status-rail,.enemy-defense-rail").count(),\n      documentSize: await page.evaluate(() => ({ width: document.scrollingElement.scrollWidth, height: document.scrollingElement.scrollHeight, innerWidth, innerHeight })),\n    }));\n  }'''
          if marker not in text:
              raise SystemExit('932 insertion marker missing')
          text = text.replace(marker, addition, 1)
          path.write_text(text)
          PY
      - name: Full non-mutating mobile and PC diagnostics
        run: node scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs
      - name: Final source checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- games/harmony
          git diff --check origin/main...HEAD -- games/harmony
