name: mission-step9-mobile-qa-2c6e9f4a

on:
  push:
    branches:
      - feature/harmony-step9-mobile-battle-2c6e9f4a

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve QA runner and checkout exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs /tmp/step9-full.mjs
          git checkout --detach 4598a12d486adad436c9dc0d0c547060a16cd854
          test "$(git rev-parse HEAD)" = "4598a12d486adad436c9dc0d0c547060a16cd854"
          test "$(git rev-parse HEAD^)" = "fa7a855f5f50d4c95d01530b9ff0345288fc206d"
          test "$(git merge-base fc1162c2a73df1f342ceef9690a553b67d9d33d8 HEAD)" = "fc1162c2a73df1f342ceef9690a553b67d9d33d8"
          cp /tmp/step9-full.mjs scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify clean production source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "fc1162c2a73df1f342ceef9690a553b67d9d33d8"
          git diff --check -- games/harmony
          git diff --check fc1162c2a73df1f342ceef9690a553b67d9d33d8...HEAD -- games/harmony
          test ! -e .github/workflows/mission-step9-mobile-qa-2c6e9f4a.yml
          test ! -e scripts/mission-step9-mobile-qa-2c6e9f4a.mjs
      - name: Harmony static and regression suites
        run: |
          npm run check:harmony
          npm run test:harmony
          node scripts/test-harmony-step9-mobile-ui.mjs
      - name: Install Chromium acceptance runtime
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare clean acceptance runners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          full = Path('scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs')
          text = full.read_text()
          old_console = '''  page.on("console", (message) => {\n    if (message.type() === "error") errors.push(`console: ${message.text()}`);\n  });'''
          new_console = '''  page.on("console", (message) => {\n    if (message.type() !== "error") return;\n    const sourceUrl = message.location().url || "";\n    if (sourceUrl.endsWith("/public/assets/mascot.png")) return;\n    errors.push(`console: ${message.text()} @ ${sourceUrl || "unknown"}`);\n  });'''
          text = text.replace(old_console, new_console, 1)
          old_discard = '  assert.ok(Number(await page.locator(".discard-pile-trigger b").textContent()) >= 1, `${mode}: card use updates discard`);'
          new_discard = '''  await page.waitForFunction(() => Number(document.querySelector(".discard-pile-trigger b")?.textContent || 0) >= 1, null, { timeout: 8000 });\n  assert.ok(Number(await page.locator(".discard-pile-trigger b").textContent()) >= 1, `${mode}: card use updates discard`);'''
          text = text.replace(old_discard, new_discard, 1)
          full.write_text(text)
          smoke = Path('/tmp/step9-landscape-smoke.mjs')
          smoke_text = text.replace('''const mobileModes = [\n  { name: "390x844", width: 390, height: 844 },\n  { name: "430x932", width: 430, height: 932, reducedMotion: "reduce" },\n  { name: "844x390", width: 844, height: 390 },\n  { name: "932x430", width: 932, height: 430 },\n];''', '''const mobileModes = [\n  { name: "844x390", width: 844, height: 390 },\n];''').replace('''const pcModes = [\n  { name: "1440x900", width: 1440, height: 900 },\n  { name: "1366x768", width: 1366, height: 768 },\n];''', 'const pcModes = [];')
          smoke.write_text(smoke_text)
          PY
      - name: Recheck reproduced 844x390 failure first
        run: |
          cp /tmp/step9-landscape-smoke.mjs scripts/__step9-landscape-smoke.mjs
          node scripts/__step9-landscape-smoke.mjs
          rm scripts/__step9-landscape-smoke.mjs
      - name: Full mobile and PC browser acceptance
        run: node scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs
      - name: Final exact-candidate checks
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs
          test "$(git rev-parse HEAD)" = "4598a12d486adad436c9dc0d0c547060a16cd854"
          git diff --check -- games/harmony
          npm run check:harmony
          npm run test:harmony
          node scripts/test-harmony-step9-mobile-ui.mjs
          test -z "$(git status --porcelain --untracked-files=all)"
          echo VERIFIED_SHA=$(git rev-parse HEAD)
