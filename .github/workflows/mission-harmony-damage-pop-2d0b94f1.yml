name: mission-harmony-damage-pop-2d0b94f1

on:
  push:
    branches:
      - feat/harmony-defense-card-ux
    paths:
      - .github/workflows/mission-harmony-damage-pop-2d0b94f1.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="954c6f6d86801d1fc32968b7cc815a498099a683"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/mission-harmony-damage-pop-2d0b94f1.yml"

      - name: Restore readable damage popup motion
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          style_path = Path("games/harmony/styles.css")
          index_path = Path("games/harmony/index.html")
          styles = style_path.read_text(encoding="utf-8")
          html = index_path.read_text(encoding="utf-8")

          marker = "/* Reduced-motion combat feedback readability · 20260912 */"
          if marker in styles:
              raise SystemExit("damage popup reduced-motion marker already exists")

          styles += r'''

/* Reduced-motion combat feedback readability · 20260912 */
/* Keep hit counts readable even when the OS asks for reduced motion: small vertical drift, no shake/large travel. */
@media (prefers-reduced-motion: reduce) {
  .damage-pop {
    animation: damage-rise-reduced .72s ease-out forwards;
  }
  .damage-pop.damage-pop-strong {
    animation: damage-rise-strong-reduced .82s ease-out forwards;
  }
  .player-damage-pop {
    animation: player-damage-rise-reduced .72s ease-out forwards;
  }
}
@keyframes damage-rise-reduced {
  0% { opacity: 0; transform: translateY(5px) scale(.92); }
  20% { opacity: 1; transform: translateY(0) scale(1); }
  68% { opacity: 1; transform: translateY(-8px) scale(1); }
  100% { opacity: 0; transform: translateY(-18px) scale(1); }
}
@keyframes damage-rise-strong-reduced {
  0% { opacity: 0; transform: translateY(6px) scale(.9); }
  18% { opacity: 1; transform: translateY(0) scale(1.08); }
  65% { opacity: 1; transform: translateY(-10px) scale(1.04); }
  100% { opacity: 0; transform: translateY(-22px) scale(1.04); }
}
@keyframes player-damage-rise-reduced {
  0% { opacity: 0; transform: translateX(-50%) translateY(5px) rotate(-9deg); }
  20% { opacity: 1; transform: translateX(-50%) translateY(0) rotate(-9deg); }
  68% { opacity: 1; transform: translateX(-50%) translateY(-7px) rotate(-9deg); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-16px) rotate(-9deg); }
}
'''

          old = './styles.css?v=20260912-92'
          new = './styles.css?v=20260912-93'
          if html.count(old) != 1:
              raise SystemExit(f"styles cache version: expected one {old}, found {html.count(old)}")
          html = html.replace(old, new, 1)

          style_path.write_text(styles, encoding="utf-8")
          index_path.write_text(html, encoding="utf-8")

          assert marker in styles
          assert 'animation: damage-rise-reduced .72s ease-out forwards;' in styles
          assert 'animation: damage-rise-strong-reduced .82s ease-out forwards;' in styles
          assert './styles.css?v=20260912-93' in html
          PY

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm run check
          npm test

      - name: Publish clean task result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mission-harmony-damage-pop-2d0b94f1.yml
          git add games/harmony/styles.css games/harmony/index.html
          git diff --cached --check
          git commit -m "fix: restore Harmony damage popup motion"
          git push origin HEAD:feat/harmony-defense-card-ux
