name: Harmony PC Notice Reflow V2 Final QA
on:
  push:
    branches: [qa/harmony-pc-notice-reflow-v2-final]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0b6dda342e31195552b8ecef6bdca96fc22171e
          fetch-depth: 0
      - name: Verify exact candidate and scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c0b6dda342e31195552b8ecef6bdca96fc22171e"
          test "$(git diff --name-only 41a27ff39810ba259e5c930a3f15300b0117a1d7..HEAD)" = "games/harmony/pc-route-ui.css"
          git diff --check -- games/harmony
          grep -F 'html:not(.mobile-battle-active) body.harmony-stage-active main > #notice' games/harmony/pc-route-ui.css
          git status --porcelain | test ! -s /dev/stdin
      - name: Static and full Harmony regression
        run: |
          set -euo pipefail
          npm run check:harmony
          npm run test:harmony
          git status --porcelain | test ! -s /dev/stdin
      - name: Chromium final acceptance
        run: |
          set -euo pipefail
          rm -rf /tmp/harmony-base /tmp/pw qa-artifacts
          git worktree add /tmp/harmony-base 41a27ff39810ba259e5c930a3f15300b0117a1d7
          npm start >/tmp/harmony-candidate.log 2>&1 &
          python3 -m http.server 5174 --directory /tmp/harmony-base >/tmp/harmony-base.log 2>&1 &
          for port in 5173 5174; do
            for i in {1..30}; do
              if curl -fsS "http://127.0.0.1:${port}/games/harmony/" >/dev/null; then break; fi
              sleep 1
            done
          done
          mkdir -p /tmp/pw qa-artifacts/pc qa-artifacts/mobile
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const candidateUrl = 'http://127.0.0.1:5173/games/harmony/?local=1';
          const baselineUrl = 'http://127.0.0.1:5174/games/harmony/?local=1';
          const out = path.join(process.env.GITHUB_WORKSPACE, 'qa-artifacts');
          const failures = [];
          const report = { candidate: 'c0b6dda342e31195552b8ecef6bdca96fc22171e', base: '41a27ff39810ba259e5c930a3f15300b0117a1d7', pc: [], mobile: [], failures };
          const approx = (a, b, tolerance = 0.75) => Math.abs(a - b) <= tolerance;
          const fail = (scope, message) => failures.push(`${scope}: ${message}`);
          const rect = async (page, selector) => page.locator(selector).evaluate((el) => {
            const r = el.getBoundingClientRect();
            return { top: r.top, left: r.left, right: r.right, bottom: r.bottom, width: r.width, height: r.height };
          });
          const sameRect = (a, b) => Object.keys(a).every((key) => approx(a[key], b[key]));
          const geom = async (page) => ({
            hud: await rect(page, '.hud.run-hud-enhanced'),
            app: await rect(page, '#app'),
            battle: await rect(page, '.battle'),
            arena: await rect(page, '.battle-arena'),
            enemies: await rect(page, '.enemies-field'),
            hand: await rect(page, '.hand'),
            footer: await rect(page, '.turn-bar'),
            endTurn: await rect(page, '.turn-bar [data-action="end"]'),
          });
          const diffGeom = (a, b) => Object.fromEntries(Object.keys(a).flatMap((key) => sameRect(a[key], b[key]) ? [] : [[key, { before: a[key], after: b[key] }]]));

          async function enterBattle(browser, url, width, height, reducedMotion = 'no-preference') {
            const page = await browser.newPage({ viewport: { width, height }, reducedMotion });
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            page.on('console', (message) => { if (message.type() === 'error') errors.push(message.text()); });
            await page.goto(url, { waitUntil: 'domcontentloaded' });
            await page.locator('[data-action="test-new"]').waitFor({ state: 'visible' });
            await page.locator('[data-action="test-new"]').click();
            await page.locator('#starting-deck-builder[open]').waitFor({ state: 'visible' });
            await page.locator('#builder-preset').click();
            await page.locator('#builder-start:not([disabled])').click();
            await page.locator('#app [data-action="enter"]').waitFor({ state: 'visible' });
            await page.locator('#app [data-action="enter"]').click();
            await page.locator('.battle').waitFor({ state: 'visible' });
            await page.locator('.hand > .card[data-action="play"]').first().waitFor({ state: 'visible' });
            await page.waitForTimeout(900);
            return { page, errors };
          }

          async function triggerActualNotice(page, text) {
            await page.locator('#notice').evaluate((el) => { el.textContent = ''; });
            const card = page.locator('.hand > .card[data-action="play"]').first();
            await card.evaluate((el, noticeText) => {
              el.setAttribute('aria-disabled', 'true');
              let reason = el.querySelector('.card-unavailable-reason');
              if (!reason) {
                reason = document.createElement('span');
                reason.className = 'card-unavailable-reason';
                reason.setAttribute('role', 'tooltip');
                el.append(reason);
              }
              reason.textContent = noticeText;
              el.click();
            }, text);
            await page.waitForFunction((expected) => document.querySelector('#notice')?.textContent?.trim() === expected, text, { timeout: 5000 });
          }

          async function noticeStyle(page) {
            return page.locator('#notice').evaluate((el) => {
              const s = getComputedStyle(el);
              return {
                position: s.position,
                top: s.top,
                left: s.left,
                width: s.width,
                maxWidth: s.maxWidth,
                margin: s.margin,
                padding: s.padding,
                pointerEvents: s.pointerEvents,
                transform: s.transform,
                display: s.display,
              };
            });
          }

          async function verifyPcNotice(page, scope, label, text) {
            await page.locator('#notice').evaluate((el) => { el.textContent = ''; });
            await page.waitForTimeout(40);
            const before = await geom(page);
            await triggerActualNotice(page, text);
            const during = await geom(page);
            const duringDiff = diffGeom(before, during);
            if (Object.keys(duringDiff).length) fail(`${scope}/${label}`, `rect moved during ${JSON.stringify(duringDiff)}`);
            const style = await noticeStyle(page);
            if (style.position !== 'absolute') fail(`${scope}/${label}`, `notice position=${style.position}`);
            if (style.pointerEvents !== 'none') fail(`${scope}/${label}`, `notice pointerEvents=${style.pointerEvents}`);
            await page.locator('#notice').evaluate((el) => { el.textContent = ''; });
            await page.waitForTimeout(40);
            const after = await geom(page);
            const afterDiff = diffGeom(before, after);
            if (Object.keys(afterDiff).length) fail(`${scope}/${label}`, `rect moved after ${JSON.stringify(afterDiff)}`);
            return { label, before, during, after, duringDiff, afterDiff, style };
          }

          async function probeShake(page, scope) {
            const probe = await page.evaluate(async () => {
              const battle = document.querySelector('.battle');
              const field = document.querySelector('.enemies-field');
              if (!battle || !field) return { missing: true };
              battle.classList.remove('strong-contact-shake');
              void battle.offsetWidth;
              battle.classList.add('strong-contact-shake');
              await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
              const battleAnimations = battle.getAnimations({ subtree: false }).map((a) => a.animationName).filter(Boolean);
              const fieldAnimations = field.getAnimations({ subtree: false }).map((a) => a.animationName).filter(Boolean);
              const battleTransform = getComputedStyle(battle).transform;
              const fieldTransform = getComputedStyle(field).transform;
              battle.classList.remove('strong-contact-shake');
              return { battleAnimations, fieldAnimations, battleTransform, fieldTransform };
            });
            if (probe.missing) fail(scope, 'shake probe elements missing');
            const battleShake = probe.battleAnimations?.includes('strong-contact-screen-shake');
            const fieldShake = probe.fieldAnimations?.includes('strong-contact-screen-shake');
            if (battleShake && !fieldShake) fail(scope, `screen shake is on .battle instead of .enemies-field: ${JSON.stringify(probe)}`);
            return probe;
          }

          const browser = await chromium.launch({ headless: true });
          const noticeCases = [
            ['ap-shortage', 'AP가 부족합니다.'],
            ['invalid-card', '현재 사용할 수 없는 카드입니다.'],
            ['target-required', '대상을 선택하세요.'],
            ['other-combat', '전투 조건을 만족하지 못했습니다.'],
          ];

          for (const [width, height] of [[1440, 900], [1366, 768]]) {
            const scope = `${width}x${height}`;
            const { page, errors } = await enterBattle(browser, candidateUrl, width, height);
            const mode = await page.evaluate(() => ({ desktop: document.body.classList.contains('harmony-stage-active'), mobile: document.documentElement.classList.contains('mobile-battle-active') }));
            if (!mode.desktop || mode.mobile) fail(scope, `wrong battle mode ${JSON.stringify(mode)}`);
            const cases = [];
            for (const [label, text] of noticeCases) cases.push(await verifyPcNotice(page, scope, label, text));
            const shake = await probeShake(page, scope);
            if (errors.length) fail(scope, errors.join(' | '));
            await page.screenshot({ path: path.join(out, 'pc', `${scope}.png`), fullPage: true });
            report.pc.push({ scope, mode, cases, shake });
            await page.close();

            const reduced = await enterBattle(browser, candidateUrl, width, height, 'reduce');
            const reducedResult = await verifyPcNotice(reduced.page, `${scope}/reduced`, 'ap-shortage', 'AP가 부족합니다.');
            const reducedShake = await probeShake(reduced.page, `${scope}/reduced`);
            if (reduced.errors.length) fail(`${scope}/reduced`, reduced.errors.join(' | '));
            report.pc.push({ scope: `${scope}/reduced`, case: reducedResult, shake: reducedShake });
            await reduced.page.close();
          }

          const stableStyle = async (page, selector) => page.locator(selector).evaluate((el) => {
            const s = getComputedStyle(el);
            return { position: s.position, display: s.display, overflowX: s.overflowX, overflowY: s.overflowY, gridTemplateRows: s.gridTemplateRows, gridTemplateColumns: s.gridTemplateColumns, padding: s.padding, margin: s.margin };
          });

          for (const [width, height] of [[390, 844], [430, 932], [844, 390], [932, 430]]) {
            const scope = `mobile-${width}x${height}`;
            const base = await enterBattle(browser, baselineUrl, width, height);
            const cand = await enterBattle(browser, candidateUrl, width, height);
            const baseMode = await base.page.evaluate(() => ({ mobile: document.documentElement.classList.contains('mobile-battle-active'), desktop: document.body.classList.contains('harmony-stage-active') }));
            const candMode = await cand.page.evaluate(() => ({ mobile: document.documentElement.classList.contains('mobile-battle-active'), desktop: document.body.classList.contains('harmony-stage-active') }));
            if (!baseMode.mobile || baseMode.desktop) fail(`${scope}/base`, `wrong mobile mode ${JSON.stringify(baseMode)}`);
            if (!candMode.mobile || candMode.desktop) fail(`${scope}/candidate`, `wrong mobile mode ${JSON.stringify(candMode)}`);
            await triggerActualNotice(base.page, 'AP가 부족합니다.');
            await triggerActualNotice(cand.page, 'AP가 부족합니다.');
            const baseNotice = await noticeStyle(base.page);
            const candNotice = await noticeStyle(cand.page);
            if (JSON.stringify(baseNotice) !== JSON.stringify(candNotice)) fail(scope, `notice style changed ${JSON.stringify({ baseNotice, candNotice })}`);
            const selectors = ['#app', '.battle', '.battle-arena', '.enemies-field', '.hand', '.turn-bar'];
            const styles = {};
            for (const selector of selectors) {
              const baseStyle = await stableStyle(base.page, selector);
              const candStyle = await stableStyle(cand.page, selector);
              styles[selector] = { baseStyle, candStyle };
              if (JSON.stringify(baseStyle) !== JSON.stringify(candStyle)) fail(scope, `${selector} computed layout style changed`);
            }
            if (base.errors.length) fail(`${scope}/base`, base.errors.join(' | '));
            if (cand.errors.length) fail(`${scope}/candidate`, cand.errors.join(' | '));
            await cand.page.screenshot({ path: path.join(out, 'mobile', `${width}x${height}.png`), fullPage: true });
            report.mobile.push({ scope, baseMode, candMode, baseNotice, candNotice, styles });
            await base.page.close();
            await cand.page.close();
          }

          report.pass = failures.length === 0;
          fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(report, null, 2));
          console.log('QA_SUMMARY', JSON.stringify({ pass: report.pass, pc: report.pc.map((x) => x.scope), mobile: report.mobile.map((x) => x.scope), failures }, null, 2));
          await browser.close();
          if (failures.length) process.exitCode = 1;
          EOF
          node qa.mjs
      - name: Clean candidate working tree
        if: success()
        run: |
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmony-pc-notice-reflow-v2-final
          path: qa-artifacts/
          if-no-files-found: warn
