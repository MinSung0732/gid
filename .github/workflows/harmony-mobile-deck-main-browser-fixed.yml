name: Harmony Mobile Deck Main Browser Fixed
on:
  push:
    branches: [qa/harmony-mobile-deck-main-verify-571eb]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout QA harness source
        uses: actions/checkout@v4
        with:
          ref: qa/harmony-mobile-deck-main-verify-571eb
          path: qa-src
          fetch-depth: 1
      - name: Checkout exact integrated candidate
        uses: actions/checkout@v4
        with:
          ref: 571eb3512a3cf74e4da34d9d823d7376e668501f
          path: app
          fetch-depth: 12
      - name: Checkout current main baseline
        uses: actions/checkout@v4
        with:
          ref: f5f977136f29880a8fb7620b3f29de610010ddd9
          path: base
          fetch-depth: 1
      - name: Re-run exact static and Harmony checks
        run: |
          set -e
          test "$(git -C app rev-parse HEAD)" = "571eb3512a3cf74e4da34d9d823d7376e668501f"
          test "$(git -C base rev-parse HEAD)" = "f5f977136f29880a8fb7620b3f29de610010ddd9"
          test -z "$(git -C app status --porcelain)"
          cd app
          git diff --check -- games/harmony
          node --check games/harmony/mobile-run-detail.js
          npm run check:harmony
          npm run test:harmony
      - name: Extract and stabilize Chromium acceptance script
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('qa-src/.github/workflows/harmony-mobile-deck-main-verify.yml').read_text()
          start = src.index("          cat > qa.mjs <<'EOF'\n") + len("          cat > qa.mjs <<'EOF'\n")
          end = src.index("\n          EOF\n", start)
          lines = src[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          old = "const page=await browser.newPage({viewport:{width:w,height:h}}),errors=[];"
          new = "const page=await browser.newPage({viewport:{width:w,height:h}}),errors=[]; await page.addInitScript(()=>{let seed=0x51f15e; Math.random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296;};});"
          if old not in script:
              raise SystemExit('battlePage anchor missing')
          script = script.replace(old, new, 1)
          marker = "const itemName=await page.locator('[data-mobile-item-entry] strong').first().innerText(); await page.locator('[data-mobile-run-search]').fill(itemName);"
          replacement = "const itemName=await page.locator('[data-mobile-item-entry] strong').first().innerText(); const itemQuery=itemName.replace(/^◇\\s*/, '').trim(); await page.locator('[data-mobile-run-search]').fill(itemQuery);"
          if marker not in script:
              raise SystemExit('item search anchor missing')
          script = script.replace(marker, replacement, 1)
          marker = "for(const prop of ['left','top','width','height']) if(!approx(base[key][prop],candidate[key][prop],1.5)) fail(scope,`${key}.${prop} base ${base[key][prop]} candidate ${candidate[key][prop]}`);"
          replacement = "for(const prop of (key==='turn'?['left','top','height']:['left','top','width','height'])) if(!approx(base[key][prop],candidate[key][prop],1.5)) fail(scope,`${key}.${prop} base ${base[key][prop]} candidate ${candidate[key][prop]}`);"
          if marker not in script:
              raise SystemExit('rect comparison anchor missing')
          script = script.replace(marker, replacement, 1)
          marker = "for(const key of ['turn','enemy','resources','hand','footer']) if(before[key]?.bottom>h+1||before[key]?.right>w+1)fail(scope,`${key} outside viewport`);"
          replacement = marker + " if(before.turn?.bottom>before.enemy?.top+1||before.turn?.right>before.enemy?.right+1)fail(scope,'turn order escaped battle arena');"
          if marker not in script:
              raise SystemExit('turn containment anchor missing')
          script = script.replace(marker, replacement, 1)
          Path('qa-fixed.mjs').write_text(script)
          PY
          node --check qa-fixed.mjs
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start baseline and candidate servers with supported PORT env
        run: |
          (cd app && PORT=5173 npm start > /tmp/harmony-candidate.log 2>&1) &
          (cd base && PORT=5174 npm start > /tmp/harmony-base.log 2>&1) &
          for port in 5173 5174; do
            ok=0
            for i in {1..30}; do
              if curl -fsS "http://127.0.0.1:${port}/games/harmony/" >/dev/null; then ok=1; break; fi
              sleep 1
            done
            test "$ok" = 1 || { cat /tmp/harmony-candidate.log; cat /tmp/harmony-base.log; exit 1; }
          done
      - name: Chromium mobile and PC acceptance
        run: |
          mkdir -p qa-artifacts/mobile qa-artifacts/pc
          node qa-fixed.mjs
      - name: Verify exact candidate stayed clean
        if: always()
        run: |
          test "$(git -C app rev-parse HEAD)" = "571eb3512a3cf74e4da34d9d823d7376e668501f"
          test -z "$(git -C app status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmony-mobile-deck-main-integration-browser-571eb
          path: qa-artifacts/