name: Harmony Short Deck Limit Label Validation
on:
  push:
    branches:
      - validation/short-deck-limit-label
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diff whitespace check
        run: git diff --check 77540f4d013e86cb4bd0f4b7612485d3b04d5dfc dba612a98c16606c33381f95c7f3d829dcb5ba89 -- games/harmony scripts
      - name: Harmony syntax checks
        run: npm run check:harmony
      - name: Harmony regression tests
        run: npm run test:harmony
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm start >/tmp/harmony-short-label.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5173/games/harmony/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/harmony-short-label.log
          exit 1
      - name: Verify deck-limit label fit
        run: node scripts/harmony-short-deck-label-temp.mjs
