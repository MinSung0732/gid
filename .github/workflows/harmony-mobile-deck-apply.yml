name: Harmony Mobile Deck Detail Apply
on:
  push:
    branches:
      - qa/harmony-mobile-deck-apply
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/harmony-mobile-deck-detail
          fetch-depth: 0
      - name: Assert frozen base
        run: |
          test "$(git rev-parse HEAD)" = "6a995181016d0d79746e8b8338075380d761b564"
          test -z "$(git status --porcelain)"
      - name: Write isolated mobile detail files
        env:
          RUN_SUMMARY_B64: 
          MOBILE_RUN_CSS_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path('games/harmony/run-summary-ui.js').write_bytes(gzip.decompress(base64.b64decode(os.environ['RUN_SUMMARY_B64'])))
          Path('games/harmony/mobile-run-detail.css').write_bytes(gzip.decompress(base64.b64decode(os.environ['MOBILE_RUN_CSS_B64'])))
          PY
          node --check games/harmony/run-summary-ui.js
          git diff --check -- games/harmony
      - name: Commit and push feature
        run: |
          git config user.name "MinSung_Jo"
          git config user.email "152842047+MinSung0732@users.noreply.github.com"
          git add games/harmony/run-summary-ui.js games/harmony/mobile-run-detail.css
          git commit -m "feat(harmony): add mobile deck and journey detail view"
          git push origin HEAD:feat/harmony-mobile-deck-detail
