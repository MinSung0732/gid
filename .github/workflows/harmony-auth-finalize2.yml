name: Harmony Auth Finalize 2

on:
  push:
    branches:
      - feature/harmony-supabase-auth

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply remaining validated changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "games/harmony/pc-frame-ui.js",
              'import { syncImpurityUi } from "./impurity-ui.js?v=20260915-5";\nimport { syncEconomyUi } from "./economy-ui.js?v=20260915-2";',
              'import { syncImpurityUi } from "./impurity-ui.js?v=20260915-6";\nimport { syncEconomyUi } from "./economy-ui.js?v=20260915-3";',
          )

          replace_once(
              "games/harmony/persistence.js",
              '      source: candidates[0].key,\n    };',
              '      source: candidates[0].key,\n      savedAt: candidates[0].data.savedAt,\n    };',
          )
          replace_once(
              "games/harmony/persistence.js",
              '        migrated: true,\n      };',
              '        migrated: true,\n        savedAt: 0,\n      };',
          )
          replace_once(
              "games/harmony/persistence.js",
              '    source: null,\n  };',
              '    source: null,\n    savedAt: 0,\n  };',
          )

          replace_once(
              "games/harmony/main.js",
              'import { loadGame, saveGame } from "./persistence.js";',
              'import { loadGame, saveGame } from "./persistence.js?v=20260915-1";',
          )
          replace_once(
              "games/harmony/main.js",
              'const $ = (id) => document.getElementById(id),\n  LOCAL_CARD_TEST = hasLocalFeatureAccess(),\n  loadedSave = loadGame(localStorage);',
              'const $ = (id) => document.getElementById(id),\n  LOCAL_CARD_TEST = hasLocalFeatureAccess(),\n  persistenceStorage = window.HarmonyRuntime?.storage || localStorage,\n  loadedSave = loadGame(persistenceStorage);',
          )
          replace_once(
              "games/harmony/main.js",
              '  saveRevision = loadedSave.revision;\nfunction save() {',
              '  saveRevision = loadedSave.revision;\nif (run && !run.runId && !run.finished) run.runId = crypto.randomUUID();\nfunction save() {',
          )
          replace_once(
              "games/harmony/main.js",
              '    saveRevision = saveGame(localStorage, { meta, run }, saveRevision);',
              '    saveRevision = saveGame(persistenceStorage, { meta, run }, saveRevision);\n    window.HarmonyRuntime?.cloudSync?.schedule({ meta, run }, saveRevision);\n    if (run?.finished && run.runId)\n      void window.HarmonyRuntime?.runHistory?.record(run, shareRecord());',
          )
          replace_once(
              "games/harmony/main.js",
              '      run = E.newRun(crypto.getRandomValues(new Uint32Array(1))[0], startingDeckSelection, meta);\n      run.testMode = startingDeckTestMode;',
              '      run = E.newRun(crypto.getRandomValues(new Uint32Array(1))[0], startingDeckSelection, meta);\n      run.runId = crypto.randomUUID();\n      run.testMode = startingDeckTestMode;',
          )
          PY
          git add games/harmony/main.js games/harmony/pc-frame-ui.js games/harmony/persistence.js
          git rm .github/workflows/harmony-auth-finalize2.yml
          test "$(git write-tree)" = "d230dc4ec4e74732d33e7f145eab55d51b08427b"

      - name: git diff --check
        run: git diff --cached --check

      - name: check:harmony
        run: npm run check:harmony

      - name: test:harmony
        run: npm run test:harmony

      - name: auth sync test explicit
        run: node scripts/test-harmony-auth-sync.mjs

      - name: Commit and push feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: finalize Harmony Supabase auth integration"
          test "$(git rev-parse HEAD^{tree})" = "d230dc4ec4e74732d33e7f145eab55d51b08427b"
          git push origin HEAD:feature/harmony-supabase-auth
