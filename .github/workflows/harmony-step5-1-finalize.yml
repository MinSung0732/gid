      - name: Verify cache queries
        shell: bash
        run: |
          grep -q 'pc-frame-ui.css?v=20260915-4' games/harmony/index.html
          grep -q 'combat-layout-phase2-finish.css?v=20260915-12' games/harmony/index.html

      - name: Remove temporary finalize workflow
        run: rm .github/workflows/harmony-step5-1-finalize.yml

      - name: Verify patch whitespace
        run: git diff --check

      - name: Commit Step 5.1
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/harmony/pc-frame-ui.css games/harmony/combat-layout-phase2-finish.css games/harmony/index.html .github/workflows/harmony-step5-1-finalize.yml
          git commit -m 'style: polish Harmony step 5.1 typography'

      - name: Syntax check final HEAD
        run: npm run check:harmony

      - name: Harmony test suite final HEAD
        run: npm run test:harmony

      - name: Verify final HEAD diff whitespace
        run: git diff HEAD^ HEAD --check

      - name: Push final Step 5.1 HEAD
        run: git push origin HEAD:main
