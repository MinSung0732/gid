name: Harmony Augment Pack Dev QA

on:
  push:
    branches:
      - feat/harmony-augment-pack-36-20260918

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Harmony static checks
        run: npm run check:harmony
      - name: Harmony existing regression suite
        run: npm run test:harmony
