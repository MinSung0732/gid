name: Harmony Special Room Background Validation

on:
  push:
    branches:
      - validation/harmony-special-room-bg-final
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diff whitespace check
        run: git diff --check 31bce2c48faf89fac6bb54df5365c902411121ea 6abe2c1795f64a972ae8a9b7a0df517a7e79b900 -- games/harmony
      - name: Harmony syntax checks
        run: npm run check:harmony
      - name: Harmony regression tests
        run: npm run test:harmony
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm start > /tmp/harmony-special-room.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/games/harmony/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/harmony-special-room.log
          exit 1
      - name: Chromium PC and mobile smoke
        run: |
          cat > harmony-special-room-smoke.mjs <<'EOF'
          import { chromium } from "playwright";

          const BASE = "http://127.0.0.1:5173/games/harmony/";
          const PC = [{width:1440,height:900},{width:1366,height:768}];
          const MOBILE = [{width:390,height:844},{width:430,height:932}];
          const results = {pc:[],mobile:[],assets:[]};
          const assert = (v,m) => { if (!v) throw new Error(m); };

          async function setup(context) {
            const page = await context.newPage();
            const errors = [], failed = [];
            page.on("pageerror", e => errors.push(String(e)));
            page.on("requestfailed", r => failed.push({url:r.url(),error:r.failure()?.errorText}));
            page.on("dialog", d => d.accept().catch(() => {}));
            await page.goto(BASE,{waitUntil:"domcontentloaded",timeout:30000});
            await page.locator("#app").waitFor({state:"visible"});
            return {page,errors,failed};
          }

          async function startNormal(page) {
            await page.locator('[data-action="new"]').click();
            await page.locator("#starting-deck-builder").waitFor({state:"visible"});
            await page.locator('[data-builder-action="preset"]').click();
            const start = page.locator("#builder-start");
            await start.waitFor({state:"visible"});
            assert(!(await start.isDisabled()),"builder start disabled");
            await start.click();
            await page.locator(".play-layout").waitFor({state:"visible"});
            await page.locator(".room").waitFor({state:"visible"});
          }

          async function mappingQa(page) {
            return await page.evaluate(async () => {
              const mod = await import("./room-background-ui.js?v=20260918-4");
              const stage = document.querySelector(".room");
              const rect = () => {
                const r = stage.getBoundingClientRect();
                return {x:r.x,y:r.y,width:r.width,height:r.height};
              };
              const baseRect = rect();
              const cases = [
                {name:"battle",run:{loop:0,node:0,phase:"room",route:["combat"]},file:"act1-battle-pc.avif",source:"stage"},
                {name:"boss",run:{loop:0,node:11,phase:"room",route:Array(12).fill("combat")},file:"boss-pc.avif",source:"special"},
                {name:"event",run:{loop:0,node:0,phase:"room",route:["mystery"]},file:"event-pc.avif",source:"special"},
                {name:"treasure",run:{loop:0,node:0,phase:"room",route:["treasure"]},file:"treasure-pc.avif",source:"special"},
                {name:"rest",run:{loop:0,node:0,phase:"room",route:["rest"]},file:"rest-pc.avif",source:"special"},
                {name:"shop",run:{loop:0,node:0,phase:"room",route:["shop"]},file:"act1-battle-pc.avif",source:"stage"},
                {name:"gather",run:{loop:0,node:0,phase:"room",route:["gather"]},file:"act1-battle-pc.avif",source:"stage"}
              ];
              const mapped = [];
              for (const c of cases) {
                mod.syncRoomBackground(c.run);
                await new Promise(resolve => requestAnimationFrame(resolve));
                const style = getComputedStyle(stage);
                mapped.push({
                  name:c.name,file:c.file,source:c.source,
                  dataset:{art:stage.dataset.harmonyRoomArt,act:stage.dataset.harmonyRoomAct,source:stage.dataset.harmonyRoomSource},
                  variable:stage.style.getPropertyValue("--harmony-room-bg"),
                  background:style.backgroundImage,
                  rect:rect()
                });
              }
              return {baseRect,mapped};
            });
          }

          async function assetQa(page) {
            return await page.evaluate(async () => {
              const paths = [
                "./assets/art/backgrounds/rooms/boss-pc.avif",
                "./assets/art/backgrounds/rooms/event-pc.avif",
                "./assets/art/backgrounds/rooms/treasure-pc.avif",
                "./assets/art/backgrounds/rooms/rest-pc.avif"
              ];
              const load = src => new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve({src,ok:true,width:img.naturalWidth,height:img.naturalHeight});
                img.onerror = () => resolve({src,ok:false,width:0,height:0});
                img.src = src;
              });
              return Promise.all(paths.map(load));
            });
          }

          async function enterBattle(page) {
            await page.evaluate(async () => {
              const mod = await import("./room-background-ui.js?v=20260918-4");
              mod.syncRoomBackground(window.HarmonyCurrentRenderRun);
            });
            await page.locator('.room [data-action="enter"]').click();
            await page.locator(".battle").waitFor({state:"visible"});
            await page.waitForTimeout(1200);
            await page.evaluate(() => {
              const r = window.HarmonyCurrentRenderRun;
              if (r) { r.maxHp = Math.max(Number(r.maxHp)||0,999); r.hp = 999; }
            });
          }

          async function battleSnapshot(page) {
            return await page.evaluate(() => {
              const rect = s => {
                const e = document.querySelector(s);
                if (!e) return null;
                const r = e.getBoundingClientRect();
                return {x:r.x,y:r.y,width:r.width,height:r.height};
              };
              const battle = document.querySelector(".battle");
              return {
                battle:rect(".battle"),turn:rect(".turn-order"),enemies:rect(".enemies-field"),hand:rect(".hand"),
                bodyOverflow:document.documentElement.scrollWidth-window.innerWidth,
                background:battle?getComputedStyle(battle).backgroundImage:"",
                enemyCount:document.querySelectorAll(".enemies-field .enemy").length,
                handCount:document.querySelectorAll(".hand > .card").length,
                eyebrow:document.querySelector(".battle .eyebrow")?.textContent||""
              };
            });
          }

          async function turnProgression(page) {
            const before = await page.locator(".battle .eyebrow").textContent();
            const round = Number(before?.match(/ROUND\s+(\d+)/)?.[1]||0);
            const btn = page.locator('.battle [data-action="end"]');
            await btn.waitFor({state:"visible"});
            assert(!(await btn.isDisabled()),"end turn disabled");
            await btn.click();
            await page.waitForFunction(() => document.querySelector(".battle")?.classList.contains("enemy-phase"),null,{timeout:10000});
            await page.waitForFunction(round => {
              const battle = document.querySelector(".battle");
              const text = document.querySelector(".battle .eyebrow")?.textContent||"";
              const next = Number(text.match(/ROUND\s+(\d+)/)?.[1]||0);
              return battle?.classList.contains("player-phase") && next > round;
            },round,{timeout:45000});
            await page.waitForTimeout(1100);
            const after = await page.locator(".battle .eyebrow").textContent();
            assert(/PLAYER PHASE/.test(after||""),"did not return to player phase");
            return {before,after};
          }

          function sameRect(a,b) {
            return ["x","y","width","height"].every(k => Math.abs(a[k]-b[k]) <= 0.2);
          }

          const browser = await chromium.launch({headless:true});
          try {
            for (const viewport of PC) {
              const context = await browser.newContext({viewport});
              const {page,errors,failed} = await setup(context);
              await startNormal(page);
              assert((await page.evaluate(() => window.HarmonyCurrentRenderRun?.loop))===0,"normal start not Act1");
              const mappings = await mappingQa(page);
              for (const c of mappings.mapped) {
                assert(c.dataset.source===c.source,c.name+" source mismatch");
                assert(c.variable.includes(c.file),c.name+" CSS variable mismatch");
                assert(c.background.includes(c.file),c.name+" computed background mismatch");
                assert(c.background.includes("linear-gradient"),c.name+" overlay missing");
                assert(sameRect(mappings.baseRect,c.rect),c.name+" changed room geometry");
              }
              if (viewport.width===1440) {
                const assets = await assetQa(page);
                for (const a of assets) {
                  assert(a.ok,"asset decode failed: "+a.src);
                  assert(a.width>0&&a.height>0,"invalid asset dimensions: "+a.src);
                }
                results.assets = assets;
              }
              await enterBattle(page);
              const battle = await battleSnapshot(page);
              assert(battle.battle&&battle.turn&&battle.enemies&&battle.hand,"battle composition missing");
              assert(battle.bodyOverflow<=2,"PC horizontal overflow");
              assert(battle.background.includes("act1-battle-pc.avif"),"normal battle lost stage background");
              assert(battle.enemyCount>=1&&battle.handCount>=1,"enemy or hand missing");
              const turn = await turnProgression(page);
              const meaningful = failed.filter(x => !(x.error==="net::ERR_ABORTED" && /\/sounds\//.test(x.url)));
              assert(!meaningful.some(x => /assets\/art\/backgrounds/.test(x.url)),"background request failure");
              assert(errors.length===0,"PC page errors: "+errors.join(" | "));
              results.pc.push({viewport,mappings,battle,turn});
              await context.close();
            }

            for (const viewport of MOBILE) {
              const context = await browser.newContext({viewport});
              const {page,errors,failed} = await setup(context);
              await startNormal(page);
              await enterBattle(page);
              const snap = await page.evaluate(() => {
                const rect = s => {
                  const e=document.querySelector(s);
                  if(!e)return null;
                  const r=e.getBoundingClientRect();
                  return {x:r.x,y:r.y,width:r.width,height:r.height};
                };
                return {
                  mobileActive:document.body.classList.contains("mobile-battle-active"),
                  bodyOverflow:document.documentElement.scrollWidth-window.innerWidth,
                  battle:rect(".battle"),turn:rect(".turn-order"),enemies:rect(".enemies-field"),hand:rect(".hand"),
                  playerPanel:rect(".play-layout > .player-stats"),acquiredPanel:rect(".play-layout > .acquired-panel")
                };
              });
              assert(snap.mobileActive,"mobile mode not active");
              assert(snap.bodyOverflow<=2,"mobile horizontal overflow");
              assert(snap.battle&&snap.turn&&snap.enemies&&snap.hand,"mobile composition missing");
              assert(!snap.playerPanel&&!snap.acquiredPanel,"desktop panels leaked into mobile");
              const meaningful = failed.filter(x => !(x.error==="net::ERR_ABORTED" && /\/sounds\//.test(x.url)));
              assert(!meaningful.some(x => /assets\/art\/backgrounds/.test(x.url)),"mobile background request failure");
              assert(errors.length===0,"mobile page errors: "+errors.join(" | "));
              results.mobile.push({viewport,snap});
              await context.close();
            }
            console.log("HARMONY_SPECIAL_ROOM_SMOKE="+JSON.stringify(results));
          } finally {
            await browser.close();
          }
          EOF
          node harmony-special-room-smoke.mjs
