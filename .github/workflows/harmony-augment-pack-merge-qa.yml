name: Harmony Augment Pack Merge QA

on:
  push:
    branches:
      - qa/harmony-augment-pack-merge-20260919

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Verify diff whitespace
        run: |
          git diff --check
          git diff --check 5f1874e4eedcad36290fd6205a3ebbde8b1b0714...HEAD
      - name: Harmony static checks
        run: npm run check:harmony
      - name: Harmony full regression suite
        run: npm run test:harmony
      - name: Augment pack registry and UI test
        run: node scripts/test-harmony-augment-pack-20260918.mjs
      - name: Augment pack runtime trigger matrix
        run: node scripts/test-harmony-augment-runtime-20260918.mjs
      - name: Augment pack acquisition and persistence
        run: node scripts/test-harmony-augment-acquisition-save-20260918.mjs
      - name: Start Harmony server
        run: |
          node scripts/serve.cjs > /tmp/harmony-server.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:5173/games/harmony/qa-augment-pack-smoke.html >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/harmony-server.log
          exit 1
      - name: Chromium augment browser smoke
        run: python scripts/qa-harmony-augment-pack-browser.py
