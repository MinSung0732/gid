name: Harmony Enemy Pattern V2 Main Integration
on:
  push:
    branches: [qa/harmony-enemy-pattern-v2-main-integration]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/harmony-enemy-pattern-v2-main
          fetch-depth: 0
      - name: Merge V2 and resolve current-main overlap
        run: |
          set -euo pipefail
          BASE=504fdeee784471de16db7a0f03bebbb5d7c57275
          FEATURE=0fd7155514f58e4ab5b22bcd6d7b437f982995c9
          test "$(git rev-parse HEAD)" = "$BASE"
          git fetch origin feat/harmony-enemy-pattern-v2-intent-20260917
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff "$FEATURE"
          MERGE_RC=$?
          set -e
          echo "merge_rc=$MERGE_RC"
          echo "conflicts_before_resolution:"
          git diff --name-only --diff-filter=U | tee /tmp/conflicts.txt
          if [ -s /tmp/conflicts.txt ]; then
            test "$(cat /tmp/conflicts.txt)" = "games/harmony/engine.js"
          fi
          cat > games/harmony/engine.js <<'EOF'
          import * as Core from "./engine-core.js";
          import { CARDS, ITEMS, TEST_ITEMS } from "./data.js";
          import { STAGED_AUGMENT_CARDS } from "./staged-augments.js";
          import {
            installStagedAugments,
            playWithStagedAugments,
            discardWithStagedAugments,
          } from "./staged-augment-runtime.js";
          import {
            commitEnemyPatternPlan,
            initializeCurrentPatternState,
            refreshEnemyPatternPhaseIntents,
            withPreparedNextTurn,
          } from "./engine-enemy-patterns.js";
          import {
            applyEnemyImpurityPolicy,
            impurityCount,
          } from "./engine-impurity-policy.js";

          // Install staged augment content without rewriting the shared data source.
          installStagedAugments(CARDS, ITEMS, TEST_ITEMS);
          for (const id of Object.keys(STAGED_AUGMENT_CARDS)) CARDS[id].id = id;

          export * from "./engine-core.js";
          export * from "./enemy-intent.js";

          export function play(s, index, meta) {
            const result = playWithStagedAugments(Core, CARDS, ITEMS, s, index, meta);
            if (result && s?.phase === "battle") refreshEnemyPatternPhaseIntents(s);
            return result;
          }

          export function discardFromHand(s, index, meta) {
            const result = discardWithStagedAugments(Core, CARDS, s, index, meta);
            if (result && s?.phase === "battle") refreshEnemyPatternPhaseIntents(s);
            return result;
          }

          export function enter(s, meta) {
            const pendingImpuritiesBefore = Math.max(0, Number(s?.pendingImpurities) || 0),
              result = Core.enter(s, meta);

            // Core.enter draws the opening hand first, then appends pending impurity
            // cards directly to the hand. Keep the current-main opening draw fix.
            if (pendingImpuritiesBefore > 0 && s?.phase === "battle" && s.battle) {
              const feedback = Math.max(0, Number(s._drawFeedback) || 0),
                handCount = s.battle.hand.length;
              if (handCount > feedback) s._drawFeedback = handCount;
            }

            initializeCurrentPatternState(s);
            return result;
          }

          export function executePlayerTurnEnd(s, meta) {
            const result = withPreparedNextTurn(s, () => Core.executePlayerTurnEnd(s, meta));
            if (result && s?.phase === "battle") refreshEnemyPatternPhaseIntents(s);
            return result;
          }

          export function executeSingleEnemyAction(s, enemyIndex, meta) {
            const b = s?.battle,
              enemy = b?.enemies?.[enemyIndex];
            refreshEnemyPatternPhaseIntents(s);
            const intent = enemy?.intent ? structuredClone(enemy.intent) : {},
              discardImpuritiesBefore = impurityCount(b?.discard),
              outcome = Core.executeSingleEnemyAction(s, enemyIndex, meta);

            if (enemy) commitEnemyPatternPlan(enemy);
            applyEnemyImpurityPolicy(
              s,
              enemy,
              intent,
              discardImpuritiesBefore,
              outcome,
            );
            return outcome;
          }

          export function executeRoundEnd(s, meta) {
            return withPreparedNextTurn(s, () => Core.executeRoundEnd(s, meta));
          }

          export function endTurn(s, meta) {
            return withPreparedNextTurn(s, () => {
              if (!Core.executePlayerTurnEnd(s, meta)) return false;
              refreshEnemyPatternPhaseIntents(s);
              for (let index = 0; index < (s.battle?.enemies?.length || 0); index++) {
                executeSingleEnemyAction(s, index, meta);
                if (s.phase !== "battle") return true;
              }
              Core.executeRoundEnd(s, meta);
              return true;
            });
          }
          EOF
          sed -i 's/^          //' games/harmony/engine.js
          git add games/harmony/engine.js
          test -z "$(git diff --name-only --diff-filter=U)"
          grep -q 'playWithStagedAugments' games/harmony/engine.js
          grep -q 'refreshEnemyPatternPhaseIntents' games/harmony/engine.js
          grep -q 'export \* from "./enemy-intent.js"' games/harmony/engine.js
      - name: Scope and current-main preservation guard
        run: |
          set -euo pipefail
          BASE=504fdeee784471de16db7a0f03bebbb5d7c57275
          for path in \
            games/harmony/engine-core.js \
            games/harmony/staged-augments.js \
            games/harmony/staged-augment-runtime.js \
            scripts/test-harmony-staged-augments.mjs \
            games/harmony/mobile-battle-ui.js \
            games/harmony/mobile-battle-ui.css \
            games/harmony/mobile-battle-landscape.css \
            games/harmony/mobile-run-detail.js \
            games/harmony/mobile-run-detail.css \
            games/harmony/run-summary-ui.js \
            games/harmony/card-presentation.js \
            games/harmony/combat-super-fx.css; do
            test -z "$(git diff "$BASE" -- "$path")"
          done
          git diff --name-only "$BASE" -- | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          games/harmony/enemy-intent.js
          games/harmony/enemy-patterns.js
          games/harmony/engine-enemy-patterns.js
          games/harmony/engine.js
          scripts/test-harmony-enemy-patterns.mjs
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Validate Harmony and V2 contracts
        run: |
          set -euo pipefail
          git diff --check -- games/harmony scripts/test-harmony-enemy-patterns.mjs
          node --check games/harmony/enemy-intent.js
          node --check games/harmony/enemy-patterns.js
          node --check games/harmony/engine-enemy-patterns.js
          node --check games/harmony/engine.js
          npm run check:harmony
          npm run test:harmony
          node scripts/test-harmony-enemy-patterns.mjs
          node scripts/test-harmony-staged-augments.mjs
      - name: Commit merge-ready result
        run: |
          set -euo pipefail
          git status --short
          git commit -m "feat(harmony): integrate enemy pattern v2 intent engine"
          git push origin HEAD:integration/harmony-enemy-pattern-v2-main
