name: Harmony Presentation QA

on:
  pull_request:
    branches: [main]
    paths:
      - "games/harmony/**"
      - "scripts/test-harmony-*.mjs"
      - "package.json"
      - ".github/workflows/harmony-presentation-qa.yml"

jobs:
  harmony:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:harmony
      - run: npm run test:harmony
