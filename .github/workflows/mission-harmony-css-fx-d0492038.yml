      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm run check
          npm test

      - name: Build exact patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary --no-textconv --no-ext-diff HEAD -- \
            games/harmony/main.js games/harmony/styles.css games/harmony/index.html \
            > /tmp/harmony-css-fx.patch
          test -s /tmp/harmony-css-fx.patch
          sha="$(sha256sum /tmp/harmony-css-fx.patch | awk '{print $1}')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha  /tmp/harmony-css-fx.patch" > /tmp/harmony-css-fx.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: harmony-css-fx-d0492038
          path: |
            /tmp/harmony-css-fx.patch
            /tmp/harmony-css-fx.sha256
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
