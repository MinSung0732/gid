name: mission-harmony-css-fx-d0492038

on:
  push:
    branches:
      - feat/harmony-defense-card-ux
    paths:
      - .github/workflows/mission-harmony-css-fx-d0492038.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      patch_sha: ${{ steps.patch.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="3b6ef73c6279127037e565b759a828578942bdd3"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/mission-harmony-css-fx-d0492038.yml"

      - name: Build CSS combat FX pass
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          main_path = Path("games/harmony/main.js")
          style_path = Path("games/harmony/styles.css")
          index_path = Path("games/harmony/index.html")
          main = main_path.read_text(encoding="utf-8")
          styles = style_path.read_text(encoding="utf-8")
          html = index_path.read_text(encoding="utf-8")

          marker = "/* CSS combat FX pass · 20260912 */"
          if marker in styles:
              raise SystemExit("CSS combat FX marker already exists")

          def insert_before(text, needle, addition, label):
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f"{label}: expected one insertion point, found {count}")
              return text.replace(needle, addition + needle, 1)

          def replace_between(text, start, end, replacement, label):
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{label}: start marker not found")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{label}: end marker not found")
              if text.find(start, start_index + len(start)) >= 0:
                  raise SystemExit(f"{label}: duplicate start marker")
              return text[:start_index] + replacement + text[end_index:]

          helpers = r'''let combatFxSequence = 0;
function reducedCombatMotion() {
  return Boolean(
    window.matchMedia?.("(prefers-reduced-motion: reduce)").matches,
  );
}
function showCombatImpactRing(
  targetIndex = null,
  tone = "contact",
  superStrong = false,
) {
  const enemy = enemyElement(targetIndex);
  if (!enemy) return;
  const ring = document.createElement("span");
  ring.className = `combat-impact-ring impact-${tone}${superStrong ? " impact-super" : ""}`;
  ring.setAttribute("aria-hidden", "true");
  enemy.append(ring);
  ring.addEventListener("animationend", () => ring.remove(), { once: true });
  window.setTimeout(() => ring.remove(), 820);
}
function showNonContactImpact(
  targetIndex = null,
  strong = false,
  superStrong = false,
) {
  const enemy = enemyElement(targetIndex),
    battle = document.querySelector(".battle");
  if (!enemy) return;
  const impact = document.createElement("span"),
    particleCount = strong ? 10 : 7,
    phase = combatFxSequence % 4;
  impact.className = `noncontact-impact${strong ? " noncontact-impact-strong" : ""}${superStrong ? " noncontact-impact-super" : ""}`;
  impact.setAttribute("aria-hidden", "true");
  impact.innerHTML = '<span class="noncontact-ring noncontact-ring-a"></span><span class="noncontact-ring noncontact-ring-b"></span>';
  for (let index = 0; index < particleCount; index++) {
    const particle = document.createElement("i");
    particle.style.setProperty(
      "--spark-angle",
      `${Math.round((360 / particleCount) * index + phase * 9)}deg`,
    );
    particle.style.setProperty(
      "--spark-distance",
      `${38 + (index % 4) * 8 + (strong ? 9 : 0)}px`,
    );
    particle.style.setProperty("--spark-delay", `${(index % 3) * 18}ms`);
    impact.append(particle);
  }
  enemy.append(impact);
  impact.addEventListener(
    "animationend",
    (event) => {
      if (event.target === impact) impact.remove();
    },
    { once: true },
  );
  window.setTimeout(() => impact.remove(), 900);
  if (strong && battle && !reducedCombatMotion()) {
    battle.classList.remove("combat-fx-shake");
    void battle.offsetWidth;
    battle.classList.add("combat-fx-shake");
    window.setTimeout(() => battle.classList.remove("combat-fx-shake"), 260);
  }
}
function showAbsorbVortex(host) {
  if (!host) return;
  const bounds = host.getBoundingClientRect(),
    vortex = document.createElement("span"),
    particleCount = 10;
  vortex.className = "absorb-vortex";
  vortex.setAttribute("aria-hidden", "true");
  vortex.style.left = `${bounds.left + bounds.width / 2}px`;
  vortex.style.top = `${bounds.top + bounds.height / 2}px`;
  for (let index = 0; index < particleCount; index++) {
    const particle = document.createElement("i");
    particle.style.setProperty("--absorb-angle", `${index * 36 + 12}deg`);
    particle.style.setProperty(
      "--absorb-distance",
      `${46 + (index % 4) * 11}px`,
    );
    particle.style.setProperty("--absorb-delay", `${(index % 5) * 28}ms`);
    vortex.append(particle);
  }
  effectsLayer().append(vortex);
  window.setTimeout(() => vortex.remove(), 980);
}
function addHealingMotes(effect) {
  if (!effect) return;
  for (let index = 0; index < 7; index++) {
    const mote = document.createElement("i");
    mote.className = "healing-mote";
    mote.style.setProperty("--heal-x", `${-28 + index * 9}px`);
    mote.style.setProperty("--heal-drift", `${index % 2 ? 8 : -7}px`);
    mote.style.setProperty("--heal-delay", `${(index % 4) * 55}ms`);
    effect.append(mote);
  }
}
function showHarmonyResonance(trigger, order = 0) {
  const battle = document.querySelector(".battle");
  if (!battle) return;
  const visual = ["attack", "defense", "absorb", "heal"].includes(
      trigger.visual,
    )
      ? trigger.visual
      : ["attack", "defense", "absorb", "heal"].includes(trigger.category)
        ? trigger.category
        : "default",
    resonance = document.createElement("span");
  resonance.className = `harmony-resonance harmony-resonance-${visual}`;
  resonance.setAttribute("role", "alert");
  resonance.setAttribute(
    "aria-label",
    `${trigger.label || "HARMONY!"} ${visual === "default" ? "" : visual}`.trim(),
  );
  resonance.style.setProperty("--harmony-delay", `${order * 0.18}s`);
  resonance.innerHTML = `<span class="harmony-chain"><i style="--note-delay:0s">TOP</i><i style="--note-delay:.14s">MIDDLE</i><i style="--note-delay:.28s">BASE</i></span><span class="harmony-ring harmony-ring-a"></span><span class="harmony-ring harmony-ring-b"></span><strong>${trigger.label || "HARMONY!"}</strong>`;
  placeBattleOverlay(resonance, battle);
  window.setTimeout(() => resonance.remove(), 1600 + order * 180);
}
function showMonsterDeathBurst(enemy, order = 0) {
  if (!enemy) return;
  const burst = document.createElement("span"),
    particleCount = 12;
  burst.className = "monster-death-burst";
  burst.setAttribute("aria-hidden", "true");
  burst.style.setProperty("--death-order", order);
  for (let index = 0; index < particleCount; index++) {
    const shard = document.createElement("i"),
      angle = (360 / particleCount) * index + 9,
      distance = 42 + (index % 4) * 12;
    shard.style.setProperty("--death-angle", `${angle}deg`);
    shard.style.setProperty("--death-distance", `${distance}px`);
    shard.style.setProperty("--death-rotate", `${index % 2 ? 95 : -95}deg`);
    burst.append(shard);
  }
  enemy.append(burst);
  window.setTimeout(() => burst.remove(), 820);
}
'''
          main = insert_before(
              main,
              "function showHitFeedback(\n",
              helpers,
              "combat FX helpers",
          )

          show_hit = r'''function showHitFeedback(
  amount,
  targetIndex = null,
  attackPattern = null,
  strong = false,
  superStrong = false,
  brokeThroughShield = false,
) {
  const enemy = enemyElement(targetIndex);
  if (!enemy || amount <= 0) return;
  const visualStrong =
      strong || (attackPattern === "nonContact" && amount >= 20),
    visualSuperStrong =
      superStrong || (attackPattern === "nonContact" && amount >= 30);
  if (
    attackPattern === "contact" &&
    brokeThroughShield &&
    superStrong
  )
    SFX.barrierBreakSuperContactHit();
  else if (
    attackPattern === "contact" &&
    brokeThroughShield &&
    strong &&
    !superStrong
  )
    SFX.barrierBreakStrongContactHit();
  else if (
    attackPattern === "contact" &&
    brokeThroughShield &&
    !strong &&
    !superStrong
  )
    SFX.barrierBreakContactHit();
  else if (attackPattern === "contact")
    playContactHitSound(strong, superStrong);
  else if (attackPattern === "nonContact") SFX.nonContactHit();
  for (const animation of enemy.getAnimations()) {
    if (
      animation.animationName === "enemy-hit" ||
      animation.animationName === "enemy-hit-strong"
    )
      animation.cancel();
  }
  enemy.classList.remove("enemy-hit", "enemy-hit-strong");
  enemy.classList.add(visualStrong ? "enemy-hit-strong" : "enemy-hit");
  if (attackPattern === "nonContact")
    showNonContactImpact(targetIndex, visualStrong, visualSuperStrong);
  if (visualStrong)
    showCombatImpactRing(
      targetIndex,
      attackPattern === "nonContact" ? "noncontact" : "contact",
      visualSuperStrong,
    );
  const popup = document.createElement("strong"),
    slot = combatFxSequence++ % 7,
    xOffsets = [-14, 8, -6, 14, 1, -10, 10],
    yOffsets = [-2, 3, -5, 1, -4, 4, -1],
    rotations = [-5, 3, -2, 4, 0, -4, 2];
  popup.className = `damage-pop${visualStrong ? " damage-pop-strong" : ""}`;
  popup.textContent = `-${number(amount)}`;
  popup.setAttribute("aria-label", `${number(amount)} 피해`);
  popup.style.setProperty("--damage-pop-x", `${xOffsets[slot]}px`);
  popup.style.setProperty("--damage-pop-y", `${yOffsets[slot]}px`);
  popup.style.setProperty("--damage-pop-rotate", `${rotations[slot]}deg`);
  enemy.append(popup);
  popup.addEventListener("animationend", () => popup.remove(), { once: true });
}
'''
          main = replace_between(
              main,
              "function showHitFeedback(\n",
              "function showWeakContactImpact",
              show_hit,
              "showHitFeedback",
          )

          show_absorb = r'''function showAbsorbGain(amount) {
  if (amount <= 0) return;
  const absorb = document.querySelector(
    ".combat-stats .combat-term:nth-child(3)",
  );
  if (!absorb) return;
  SFX.absorb();
  absorb.classList.remove("absorb-gain");
  void absorb.offsetWidth;
  absorb.classList.add("absorb-gain");
  showAbsorbVortex(absorb);
  const popup = document.createElement("strong");
  const bounds = absorb.getBoundingClientRect();
  popup.className = "absorb-gain-pop";
  popup.textContent = `+${number(amount)}`;
  popup.setAttribute("aria-label", `흡수 ${number(amount)} 증가`);
  popup.style.left = `${bounds.left + bounds.width / 2}px`;
  popup.style.top = `${bounds.top}px`;
  effectsLayer().append(popup);
  popup.addEventListener("animationend", () => popup.remove(), { once: true });
}
'''
          main = replace_between(
              main,
              "function showAbsorbGain(amount) {",
              "function showAbsorbLoss",
              show_absorb,
              "showAbsorbGain",
          )

          show_harmony = r'''function showHarmonyFeedback(triggers) {
  if (triggers.length) SFX.harmony();
  for (const [index, trigger] of triggers.entries())
    showHarmonyResonance(trigger, index);
}
'''
          main = replace_between(
              main,
              "function showHarmonyFeedback(triggers) {",
              "function showStatusDamage",
              show_harmony,
              "showHarmonyFeedback",
          )

          death = r'''async function showMonsterDeath(defeated = []) {
  const targets = defeated
    .map(({ index }) => document.querySelector(`.enemy[data-target="${index}"]`))
    .filter(Boolean);
  if (!targets.length) {
    const fallback = document.querySelector(".enemy.defeated, .enemy.selected");
    if (fallback) targets.push(fallback);
  }
  if (!targets.length) return;
  SFX.monsterDeath(defeated[0]?.material);
  targets.forEach((enemy, index) => showMonsterDeathBurst(enemy, index));
  for (const enemy of targets) {
    const hp = enemy.querySelector(".enemy-hp span");
    if (hp) hp.style.width = "0";
    enemy.classList.add("monster-dying");
  }
  await new Promise((resolve) => setTimeout(resolve, 760));
}
'''
          main = replace_between(
              main,
              "async function showMonsterDeath(defeated = []) {",
              "async function waitForLethalHitEffects",
              death,
              "showMonsterDeath",
          )

          healing_anchor = "  health.append(effect);\n"
          if main.count(healing_anchor) != 1:
              raise SystemExit(
                  f"showPlayerHealing append: expected one anchor, found {main.count(healing_anchor)}"
              )
          main = main.replace(
              healing_anchor,
              "  health.append(effect);\n  addHealingMotes(effect);\n",
              1,
          )

          styles += r'''

/* CSS combat FX pass · 20260912 */
/* Layered CSS/DOM-only feedback: no external VFX assets. */
.damage-pop {
  margin-left: var(--damage-pop-x, 0px);
  margin-top: var(--damage-pop-y, 0px);
  rotate: var(--damage-pop-rotate, 0deg);
}

.noncontact-impact,
.combat-impact-ring,
.monster-death-burst {
  position: absolute;
  z-index: 13;
  left: 50%;
  top: 44%;
  width: 1px;
  height: 1px;
  pointer-events: none;
}
.noncontact-impact {
  --noncontact-fx: #78c8e8;
  animation: noncontact-impact-life .62s ease-out forwards;
}
.noncontact-impact-strong { --noncontact-fx: #a9e8ff; }
.noncontact-impact-super { --noncontact-fx: #f8e29a; }
.noncontact-ring {
  position: absolute;
  left: 0;
  top: 0;
  width: 72px;
  height: 72px;
  border: 2px solid color-mix(in srgb, var(--noncontact-fx) 82%, white);
  border-radius: 50%;
  box-shadow:
    0 0 10px color-mix(in srgb, var(--noncontact-fx) 75%, transparent),
    inset 0 0 18px color-mix(in srgb, var(--noncontact-fx) 35%, transparent);
  transform: translate(-50%, -50%) scale(.18);
  animation: noncontact-ring-expand .58s cubic-bezier(.12,.72,.18,1) forwards;
}
.noncontact-ring-b {
  width: 104px;
  height: 104px;
  border-width: 1px;
  animation-delay: 55ms;
}
.noncontact-impact-strong .noncontact-ring-a {
  width: 92px;
  height: 92px;
  border-width: 3px;
}
.noncontact-impact i {
  position: absolute;
  left: -2px;
  top: -2px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--noncontact-fx);
  box-shadow: 0 0 9px var(--noncontact-fx);
  transform: rotate(var(--spark-angle)) translateX(8px) scale(.4);
  animation: noncontact-spark .52s ease-out var(--spark-delay) forwards;
}
@keyframes noncontact-impact-life {
  0%, 82% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes noncontact-ring-expand {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.18); }
  24% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.18); }
}
@keyframes noncontact-spark {
  0% { opacity: 0; transform: rotate(var(--spark-angle)) translateX(6px) scale(.25); }
  22% { opacity: 1; }
  100% { opacity: 0; transform: rotate(var(--spark-angle)) translateX(var(--spark-distance)) scale(.9); }
}

.combat-impact-ring {
  --impact-fx: #f0a287;
  width: 84px;
  height: 84px;
  border: 2px solid color-mix(in srgb, var(--impact-fx) 75%, white);
  border-radius: 50%;
  box-shadow: 0 0 22px color-mix(in srgb, var(--impact-fx) 62%, transparent);
  transform: translate(-50%, -50%) scale(.28);
  animation: combat-impact-ring .56s cubic-bezier(.1,.74,.16,1) forwards;
}
.combat-impact-ring.impact-noncontact { --impact-fx: #86d8f4; }
.combat-impact-ring.impact-super {
  width: 118px;
  height: 118px;
  border-width: 3px;
  --impact-fx: #ffe08b;
}
@keyframes combat-impact-ring {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.28); }
  18% { opacity: 1; transform: translate(-50%, -50%) scale(.7); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.45); }
}
.battle.combat-fx-shake {
  animation: combat-fx-shake .24s ease-out;
}
@keyframes combat-fx-shake {
  0%, 100% { transform: translate3d(0,0,0); }
  22% { transform: translate3d(-2px,1px,0); }
  46% { transform: translate3d(2px,-1px,0); }
  68% { transform: translate3d(-1px,1px,0); }
}

/* Defense: keep the existing field flash and add a compact hexagonal seal. */
.battle-shield-overlay.shield-gain::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: clamp(76px, 8vw, 122px);
  aspect-ratio: 1;
  border: 2px solid #a8eaff;
  background: #55cfff12;
  clip-path: polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%);
  box-shadow: 0 0 26px #55cfff99;
  transform: translate(-50%, -50%) scale(.45) rotate(30deg);
  animation: shield-hex-seal .72s ease-out forwards;
}
@keyframes shield-hex-seal {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.45) rotate(22deg); }
  28% { opacity: .92; transform: translate(-50%, -50%) scale(1) rotate(30deg); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.28) rotate(30deg); }
}

/* Absorb: perfume-like motes spiral inward to the absorb resource. */
.absorb-vortex {
  position: fixed;
  z-index: 1450;
  width: 118px;
  height: 118px;
  pointer-events: none;
  transform: translate(-50%, -50%);
}
.absorb-vortex::before {
  content: "";
  position: absolute;
  inset: 26px;
  border: 1px solid #d7b5ffcc;
  border-radius: 50%;
  box-shadow: 0 0 16px #c18cff88, inset 0 0 16px #c18cff44;
  animation: absorb-vortex-core .78s ease-out forwards;
}
.absorb-vortex i {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 5px;
  height: 5px;
  margin: -2px;
  border-radius: 50%;
  background: #d8b9ff;
  box-shadow: 0 0 9px #c18cff;
  transform: rotate(var(--absorb-angle)) translateX(var(--absorb-distance)) scale(.7);
  animation: absorb-particle-in .68s cubic-bezier(.42,0,.24,1) var(--absorb-delay) forwards;
}
.absorb-gain-pop {
  color: #f4e9ff;
  text-shadow: 0 0 5px #fff, 0 0 13px #d9baff, 0 0 24px #b884ff;
}
@keyframes absorb-vortex-core {
  0% { opacity: 0; transform: scale(1.3) rotate(0); }
  30% { opacity: 1; }
  100% { opacity: 0; transform: scale(.45) rotate(90deg); }
}
@keyframes absorb-particle-in {
  0% { opacity: 0; transform: rotate(var(--absorb-angle)) translateX(var(--absorb-distance)) scale(.4); }
  22% { opacity: 1; }
  100% { opacity: 0; transform: rotate(calc(var(--absorb-angle) + 105deg)) translateX(3px) scale(.15); }
}

/* Healing: soft green scent motes rise through the existing healing bloom. */
.healing-effect { overflow: visible; }
.healing-mote {
  position: absolute;
  z-index: 1;
  left: 50%;
  top: 54%;
  width: 5px;
  height: 9px;
  margin-left: var(--heal-x);
  border-radius: 70% 30% 65% 35%;
  background: #9be9b4;
  box-shadow: 0 0 9px #6ed894aa;
  pointer-events: none;
  transform: translateY(10px) rotate(-18deg) scale(.55);
  animation: healing-mote-rise .82s ease-out var(--heal-delay) forwards;
}
@keyframes healing-mote-rise {
  0% { opacity: 0; transform: translateY(12px) translateX(0) rotate(-18deg) scale(.45); }
  22% { opacity: .95; }
  100% { opacity: 0; transform: translateY(-42px) translateX(var(--heal-drift)) rotate(24deg) scale(1); }
}

/* Monster defeat: a brief perfume-glass shatter before the existing fade. */
.monster-death-burst {
  top: 46%;
  animation: monster-death-burst-life .7s ease-out forwards;
}
.monster-death-burst::before {
  content: "";
  position: absolute;
  left: -34px;
  top: -34px;
  width: 68px;
  height: 68px;
  border: 1px solid #f8e29acc;
  border-radius: 50%;
  box-shadow: 0 0 24px #f8e29a77;
  animation: monster-death-ring .58s ease-out forwards;
}
.monster-death-burst i {
  position: absolute;
  left: -2px;
  top: -8px;
  width: 4px;
  height: 16px;
  border-radius: 3px;
  background: linear-gradient(#fff7cf, #d4eadf55);
  box-shadow: 0 0 7px #f8e29a88;
  transform: rotate(var(--death-angle)) translateY(0) scale(.5);
  animation: monster-death-shard .64s cubic-bezier(.12,.7,.18,1) forwards;
}
@keyframes monster-death-burst-life {
  0%, 80% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes monster-death-ring {
  0% { opacity: 0; transform: scale(.3); }
  26% { opacity: 1; }
  100% { opacity: 0; transform: scale(1.65); }
}
@keyframes monster-death-shard {
  0% { opacity: 0; transform: rotate(var(--death-angle)) translateY(0) scale(.4); }
  18% { opacity: 1; }
  100% { opacity: 0; transform: rotate(var(--death-angle)) translateY(calc(var(--death-distance) * -1)) rotate(var(--death-rotate)) scale(.8); }
}

/* Harmony: TOP → MIDDLE → BASE, then category-colored resonance. */
.harmony-resonance {
  --harmony-fx: #f8e29a;
  --harmony-soft: #fff1b2;
  position: fixed;
  z-index: 1650;
  overflow: hidden;
  border-radius: 18px;
  pointer-events: none;
  isolation: isolate;
}
.harmony-resonance-attack { --harmony-fx: #ff9678; --harmony-soft: #ffd2bd; }
.harmony-resonance-defense { --harmony-fx: #83d9ff; --harmony-soft: #d6f5ff; }
.harmony-resonance-absorb { --harmony-fx: #c7a0ff; --harmony-soft: #ead9ff; }
.harmony-resonance-heal { --harmony-fx: #82dda0; --harmony-soft: #d9ffe5; }
.harmony-resonance::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 48%, color-mix(in srgb, var(--harmony-fx) 20%, transparent), transparent 42%);
  animation: harmony-field 1.28s ease-out var(--harmony-delay) both;
}
.harmony-chain {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 45%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(28px, 4vw, 58px);
  transform: translate(-50%, -50%);
}
.harmony-chain::before {
  content: "";
  position: absolute;
  z-index: -1;
  left: 9%;
  right: 9%;
  top: 50%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--harmony-fx), var(--harmony-soft), var(--harmony-fx), transparent);
  box-shadow: 0 0 10px var(--harmony-fx);
  transform: scaleX(0);
  transform-origin: left center;
  animation: harmony-link 1s ease-out calc(var(--harmony-delay) + .08s) both;
}
.harmony-chain i {
  display: grid;
  min-width: 58px;
  height: 28px;
  place-items: center;
  padding: 0 9px;
  border: 1px solid color-mix(in srgb, var(--harmony-fx) 68%, white);
  border-radius: 999px;
  background: #0a241fe8;
  color: var(--harmony-soft);
  box-shadow: 0 0 0 transparent;
  font: 800 9px/1 "Malgun Gothic", sans-serif;
  font-style: normal;
  letter-spacing: .12em;
  opacity: 0;
  transform: translateY(7px) scale(.82);
  animation: harmony-note-light 1s cubic-bezier(.16,.78,.2,1) calc(var(--harmony-delay) + var(--note-delay)) both;
}
.harmony-resonance > strong {
  position: absolute;
  z-index: 4;
  left: 50%;
  top: 56%;
  color: var(--harmony-soft);
  font: 900 clamp(25px, 3.4vw, 48px)/1 Georgia, "Batang", serif;
  letter-spacing: .12em;
  text-shadow: 0 0 7px #fff, 0 0 18px var(--harmony-fx), 0 0 34px var(--harmony-fx);
  opacity: 0;
  transform: translate(-50%, 10px) scale(.72);
  animation: harmony-title 1s cubic-bezier(.14,.76,.18,1) calc(var(--harmony-delay) + .34s) both;
}
.harmony-ring {
  position: absolute;
  z-index: 2;
  left: 50%;
  top: 54%;
  width: clamp(120px, 15vw, 230px);
  aspect-ratio: 1;
  border: 2px solid var(--harmony-fx);
  border-radius: 50%;
  box-shadow: 0 0 24px color-mix(in srgb, var(--harmony-fx) 75%, transparent), inset 0 0 28px color-mix(in srgb, var(--harmony-fx) 26%, transparent);
  opacity: 0;
  transform: translate(-50%, -50%) scale(.2);
  animation: harmony-ring-bloom .82s ease-out calc(var(--harmony-delay) + .36s) both;
}
.harmony-ring-b {
  width: clamp(170px, 21vw, 315px);
  border-width: 1px;
  animation-delay: calc(var(--harmony-delay) + .46s);
}
@keyframes harmony-field {
  0% { opacity: 0; }
  30%, 72% { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes harmony-link {
  0% { opacity: 0; transform: scaleX(0); }
  28% { opacity: 1; }
  72% { opacity: 1; transform: scaleX(1); }
  100% { opacity: 0; transform: scaleX(1); }
}
@keyframes harmony-note-light {
  0% { opacity: 0; transform: translateY(7px) scale(.82); box-shadow: 0 0 0 transparent; }
  24%, 70% { opacity: 1; transform: translateY(0) scale(1); box-shadow: 0 0 16px color-mix(in srgb, var(--harmony-fx) 72%, transparent); }
  100% { opacity: 0; transform: translateY(-5px) scale(.96); }
}
@keyframes harmony-title {
  0% { opacity: 0; transform: translate(-50%, 10px) scale(.72); }
  26%, 68% { opacity: 1; transform: translate(-50%, 0) scale(1.05); }
  100% { opacity: 0; transform: translate(-50%, -10px) scale(1); }
}
@keyframes harmony-ring-bloom {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
  24% { opacity: .88; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.38); }
}

@media (prefers-reduced-motion: reduce) {
  .battle.combat-fx-shake { animation: none !important; }
  .noncontact-impact i,
  .absorb-vortex i,
  .healing-mote,
  .monster-death-burst i { display: none; }
  .noncontact-ring,
  .combat-impact-ring,
  .battle-shield-overlay.shield-gain::after,
  .absorb-vortex::before,
  .monster-death-burst::before {
    animation-duration: .34s;
  }
  .harmony-resonance::before { animation-duration: .8s; }
  .harmony-chain::before { animation-duration: .68s; }
  .harmony-chain i {
    transform: none;
    animation-duration: .72s;
  }
  .harmony-resonance > strong {
    transform: translate(-50%, 0);
    animation-duration: .72s;
  }
  .harmony-ring { animation-duration: .55s; }
}
