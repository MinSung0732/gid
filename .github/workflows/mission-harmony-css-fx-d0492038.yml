name: mission-harmony-css-fx-d0492038

on:
  push:
    branches:
      - feat/harmony-defense-card-ux
    paths:
      - .github/workflows/mission-harmony-css-fx-d0492038.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      patch_sha: ${{ steps.patch.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify mission source
        shell: bash
        run: |
          set -euo pipefail
          base="3b6ef73c6279127037e565b759a828578942bdd3"
          git merge-base --is-ancestor "$base" HEAD
          actual="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' '.github/mission-harmony-css-fx-d0492038.py' '.github/workflows/mission-harmony-css-fx-d0492038.yml' | sort)"
          test "$actual" = "$expected"

      - name: Build CSS combat FX pass
        run: python3 .github/mission-harmony-css-fx-d0492038.py

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          npm run check
          npm test

      - name: Build exact patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .mission-output
          git diff --binary --no-textconv --no-ext-diff HEAD -- games/harmony/main.js games/harmony/styles.css games/harmony/index.html > .mission-output/change.patch
          test -s .mission-output/change.patch
          sha="$(sha256sum .mission-output/change.patch | awk '{print $1}')"
          printf '%s\n' "$sha" > .mission-output/patch.sha256
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: harmony-css-fx-d0492038
          path: .mission-output/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-verify mission source
        shell: bash
        run: |
          set -euo pipefail
          base="3b6ef73c6279127037e565b759a828578942bdd3"
          git merge-base --is-ancestor "$base" HEAD
          actual="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' '.github/mission-harmony-css-fx-d0492038.py' '.github/workflows/mission-harmony-css-fx-d0492038.yml' | sort)"
          test "$actual" = "$expected"

      - uses: actions/download-artifact@v4
        with:
          name: harmony-css-fx-d0492038
          path: .mission-output

      - name: Apply verified patch and publish
        shell: bash
        run: |
          set -euo pipefail
          patch=.mission-output/change.patch
          actual="$(sha256sum "$patch" | awk '{print $1}')"
          expected='${{ needs.verify.outputs.patch_sha }}'
          test "$actual" = "$expected"
          test "$(cat .mission-output/patch.sha256)" = "$expected"
          git apply --check "$patch"
          git apply "$patch"
          git rm .github/mission-harmony-css-fx-d0492038.py .github/workflows/mission-harmony-css-fx-d0492038.yml
          git add games/harmony/main.js games/harmony/styles.css games/harmony/index.html
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add Harmony CSS combat effects"
          git push origin HEAD:feat/harmony-defense-card-ux
