      - name: Re-verify source identity
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="3b6ef73c6279127037e565b759a828578942bdd3"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/mission-harmony-css-fx-d0492038.yml"

      - uses: actions/download-artifact@v4
        with:
          name: harmony-css-fx-d0492038
