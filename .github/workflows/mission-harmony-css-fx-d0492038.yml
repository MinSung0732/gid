          actual="$(sha256sum "$patch" | awk '{print $1}')"
          expected='${{ needs.verify.outputs.patch_sha }}'
          test "$actual" = "$expected"
          git apply --check "$patch"
          git apply "$patch"
          git rm .github/workflows/mission-harmony-css-fx-d0492038.yml
