name: Harmony Mobile Run Detail QA
on:
  push:
    branches: [qa/harmony-mobile-run-detail]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f5f977136f29880a8fb7620b3f29de610010ddd9
          path: app
          fetch-depth: 8
      - name: Scope and static checks
        run: |
          test "$(git -C app rev-parse HEAD)" = "f5f977136f29880a8fb7620b3f29de610010ddd9"
          test -z "$(git -C app status --porcelain)"
          cd app
          git diff --check -- games/harmony
          test -z "$(git diff 6a995181016d0d79746e8b8338075380d761b564..HEAD -- games/harmony/mobile-battle-landscape.css games/harmony/combat-super-fx.css games/harmony/run-summary-ui.js games/harmony/pc-frame-ui.js games/harmony/data.js)"
          node --check games/harmony/mobile-run-detail-ui.js
          npm run check:harmony
          npm run test:harmony
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          cd app
          npm start > /tmp/harmony.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:5173/games/harmony/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/harmony.log; exit 1
      - name: Chromium UX and regression
        run: |
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const failures=[], report={candidate:'f5f977136f29880a8fb7620b3f29de610010ddd9',mobile:[],pc:[],failures};
          const fail=(s,m)=>failures.push(`${s}: ${m}`);
          async function enterBattle(w,h){
            const page=await browser.newPage({viewport:{width:w,height:h}}), errors=[];
            page.on('pageerror',e=>errors.push(e.message)); page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:5173/games/harmony/?local=1',{waitUntil:'domcontentloaded'});
            await page.locator('[data-action="test-new"]').waitFor({state:'visible'}); await page.locator('[data-action="test-new"]').click();
            await page.locator('#starting-deck-builder[open]').waitFor({state:'visible'}); await page.locator('#builder-preset').click();
            await page.locator('#builder-start:not([disabled])').waitFor({state:'visible'}); await page.locator('#builder-start').click();
            await page.locator('#app [data-action="enter"]').waitFor({state:'visible'}); await page.locator('#app [data-action="enter"]').click();
            await page.locator('.battle').waitFor({state:'visible'}); await page.waitForTimeout(4500); return {page,errors};
          }
          async function mobileCase(w,h){
            const scope=`${w}x${h}`, {page,errors}=await enterBattle(w,h);
            const before=await page.evaluate(()=>{const r=e=>{const x=e.getBoundingClientRect();return [x.left,x.top,x.width,x.height]};return {battle:r(document.querySelector('.battle')),turn:r(document.querySelector('.turn-order')),field:r(document.querySelector('.enemies-field')),hand:r(document.querySelector('.hand')),doc:[document.documentElement.scrollWidth,document.documentElement.scrollHeight]}});
            await page.locator('[data-mobile-menu]').click(); await page.locator('[data-mobile-open="deck"]').waitFor({state:'visible'});
            const affordance=await page.locator('[data-mobile-open="deck"]').evaluate(e=>getComputedStyle(e,'::after').content);
            if(!affordance||affordance==='none') fail(scope,'deck CTA affordance missing');
            await page.locator('[data-mobile-open="deck"]').click();
            await page.locator('#mobile-run-detail').waitFor({state:'visible'});
            if(await page.locator('#run-summary').evaluate(e=>e.open)) fail(scope,'desktop run summary opened');
            const state=await page.evaluate(()=>({body:[document.body.scrollWidth,document.body.scrollHeight],doc:[document.documentElement.scrollWidth,document.documentElement.scrollHeight],contentH:document.querySelector('.mobile-run-detail-content').clientHeight,contentScroll:document.querySelector('.mobile-run-detail-content').scrollHeight,rows:document.querySelectorAll('.mobile-deck-row').length,focus:document.activeElement?.getAttribute('data-mobile-run-back')!==null}));
            if(state.body[0]>w+1||state.body[1]>h+1||state.doc[0]>w+1||state.doc[1]>h+1) fail(scope,`body scroll ${JSON.stringify(state)}`);
            if(!state.focus) fail(scope,'initial focus not on back');
            if(state.rows<20) fail(scope,`20+ deck rows unavailable (${state.rows})`);
            if(state.contentScroll<=state.contentH) fail(scope,'deck content not vertically scrollable');
            const firstName=await page.locator('.mobile-deck-row strong').first().innerText();
            await page.locator('[data-mobile-run-search]').fill(firstName); await page.waitForTimeout(100);
            const searched=await page.locator('.mobile-deck-row').count(); if(searched<1||searched>=state.rows) fail(scope,`search ineffective ${searched}`);
            await page.locator('[data-mobile-run-search]').fill('');
            await page.locator('[data-mobile-run-filter]').click();
            if(!(await page.locator('[data-mobile-run-filter-sheet]').isVisible())) fail(scope,'filter sheet did not open');
            await page.locator('[data-mobile-filter="tier"]').selectOption('1'); await page.locator('[data-mobile-filter="note"]').selectOption('top'); await page.locator('[data-mobile-filter-apply]').click();
            const filterText=await page.locator('[data-mobile-run-filter]').innerText(); if(!filterText.includes('2')) fail(scope,`active filter count missing: ${filterText}`);
            await page.locator('[data-mobile-run-filter]').click(); await page.locator('[data-mobile-filter-reset]').click();
            if((await page.locator('[data-mobile-run-filter]').innerText()).trim()!=='필터') fail(scope,'filter reset count remains');
            const card=page.locator('.mobile-deck-row').first(); await card.focus(); await card.click(); await page.locator('.mobile-detail-card').waitFor({state:'visible'});
            await page.keyboard.press('Escape'); if(await page.locator('.mobile-detail-card').isVisible().catch(()=>false)) fail(scope,'ESC did not close card detail');
            if(!(await card.evaluate(e=>document.activeElement===e))) fail(scope,'card detail focus did not return');
            await page.locator('[data-mobile-run-tab="items"]').click();
            const itemRows=await page.locator('.mobile-item-row').count();
            if(itemRows===0){ if(!(await page.locator('.mobile-run-empty').isVisible())) fail(scope,'zero item empty state missing'); }
            else { await page.locator('.mobile-item-row').first().click(); await page.locator('.mobile-detail-card').waitFor({state:'visible'}); await page.locator('[data-mobile-detail-close]').last().click(); }
            await page.locator('[data-mobile-run-tab="deck"]').click();
            await page.keyboard.press('Escape'); await page.locator('#mobile-info-drawer').waitFor({state:'visible'});
            if(!(await page.locator('[data-mobile-open="deck"]').evaluate(e=>document.activeElement===e))) fail(scope,'ESC/back focus did not return to drawer CTA');
            await page.locator('[data-mobile-open="deck"]').click(); await page.locator('[data-mobile-run-back]').click(); await page.locator('#mobile-info-drawer').waitFor({state:'visible'});
            const after=await page.evaluate(()=>{const r=e=>{const x=e.getBoundingClientRect();return [x.left,x.top,x.width,x.height]};return {battle:r(document.querySelector('.battle')),turn:r(document.querySelector('.turn-order')),field:r(document.querySelector('.enemies-field')),hand:r(document.querySelector('.hand'))}});
            for(const k of ['battle','turn','field','hand']) if(before[k].some((v,i)=>Math.abs(v-after[k][i])>.75)) fail(scope,`${k} rect changed ${before[k]} => ${after[k]}`);
            if(errors.length) fail(scope,`browser errors ${errors.join(' | ')}`);
            report.mobile.push({scope,before,after,state,searched,itemRows}); await page.screenshot({path:`${scope}.png`}); await page.close();
          }
          for(const [w,h] of [[390,844],[430,932],[844,390],[932,430]]) await mobileCase(w,h);
          for(const [w,h] of [[1440,900],[1366,768]]){
            const scope=`${w}x${h}`, {page,errors}=await enterBattle(w,h);
            const m=await page.evaluate(()=>({mobile:document.body.classList.contains('mobile-battle-active'),runDetail:!!document.getElementById('mobile-run-detail'),runSummary:document.getElementById('run-summary')?.open,doc:[document.documentElement.scrollWidth,document.documentElement.scrollHeight],battle:getComputedStyle(document.querySelector('.battle')).gridTemplateColumns}));
            if(m.mobile||m.runDetail) fail(scope,'PC affected by mobile detail'); if(errors.length) fail(scope,errors.join(' | ')); report.pc.push({scope,m}); await page.close();
          }
          report.pass=!failures.length; fs.writeFileSync('qa-report.json',JSON.stringify(report,null,2)); console.log('QA_SUMMARY',JSON.stringify({pass:report.pass,failures},null,2)); await browser.close(); if(failures.length) process.exitCode=1;
          EOF
          node qa.mjs
      - name: Clean tree
        if: always()
        run: |
          test "$(git -C app rev-parse HEAD)" = "f5f977136f29880a8fb7620b3f29de610010ddd9"
          test -z "$(git -C app status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmony-mobile-run-detail-qa
          path: |
            qa-report.json
            390x844.png
            430x932.png
            844x390.png
            932x430.png
