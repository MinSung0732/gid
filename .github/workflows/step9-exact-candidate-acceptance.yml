name: step9-exact-candidate-acceptance

on:
  push:
    branches:
      - qa/harmony-step9-exact-075676

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 075676110cea78d0e08e71600a8d587f51ade302
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact production candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "075676110cea78d0e08e71600a8d587f51ade302"
          git fetch origin main qa/harmony-step9-exact-075676
          test "$(git merge-base origin/main HEAD)" = "fc1162c2a73df1f342ceef9690a553b67d9d33d8"
          test "$(git rev-parse origin/main)" = "fc1162c2a73df1f342ceef9690a553b67d9d33d8"
          git diff --check -- games/harmony
          git diff --check origin/main...HEAD -- games/harmony
          test "$(git diff --name-only origin/main...HEAD | tr '\n' ' ')" = "games/harmony/index.html games/harmony/mobile-battle-ui.css games/harmony/mobile-battle-ui.js package.json scripts/test-harmony-step9-mobile-ui.mjs "
          grep -F 'event.target.closest(".enemy .status-chip")' games/harmony/mobile-battle-ui.js
          grep -F 'drawer?.querySelector(".run-summary-button[data-run-open]")' games/harmony/mobile-battle-ui.js
          grep -A8 -F 'flex-basis: 138px;' games/harmony/mobile-battle-ui.css | grep -F 'height: 176px;'
      - name: Static and regression suites
        run: |
          npm run check:harmony
          npm run test:harmony
          node scripts/test-harmony-step9-mobile-ui.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Materialize QA only for this run
        shell: bash
        run: |
          set -euo pipefail
          git show origin/qa/harmony-step9-exact-075676:scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs > scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs')
          text = path.read_text()
          old_console = '''  page.on("console", (message) => {\n    if (message.type() === "error") errors.push(`console: ${message.text()}`);\n  });'''
          new_console = '''  page.on("console", (message) => {\n    if (message.type() !== "error") return;\n    const sourceUrl = message.location().url || "";\n    if (sourceUrl.endsWith("/public/assets/mascot.png")) return;\n    errors.push(`console: ${message.text()} @ ${sourceUrl || "unknown"}`);\n  });'''
          if old_console not in text:
              raise SystemExit('console handler not found')
          text = text.replace(old_console, new_console, 1)
          old_status = '''  const status = page.locator(".enemy .status-chip").first();\n  if (await status.count()) {\n    await status.click();\n    const statusExpanded = await status.getAttribute("aria-expanded");\n    assert.ok(statusExpanded === "true" || await status.locator(".status-detail").count(), `${mode}: status detail works by tap/focus`);\n    if (statusExpanded === "true") await status.click();\n  }'''
          new_status = '''  const statuses = page.locator(".enemy .status-chip");\n  if (await statuses.count()) {\n    const status = statuses.first();\n    await status.click();\n    assert.equal(await status.getAttribute("aria-expanded"), "true", `${mode}: status detail opens by tap`);\n    await status.click();\n    assert.equal(await status.getAttribute("aria-expanded"), "false", `${mode}: status detail closes by tap`);\n    const keyboardFocusable = await status.evaluate((node) => { node.focus(); return node === document.activeElement; });\n    assert.equal(keyboardFocusable, true, `${mode}: status is keyboard focusable`);\n    await status.press("Enter");\n    await page.waitForTimeout(20);\n    assert.equal(await status.getAttribute("aria-expanded"), "true", `${mode}: status detail opens by keyboard`);\n    await status.press("Enter");\n    await page.waitForTimeout(20);\n    assert.equal(await status.getAttribute("aria-expanded"), "false", `${mode}: status detail closes by keyboard`);\n    if (await statuses.count() === 1) {\n      await status.evaluate((node) => {\n        const clone = node.cloneNode(true);\n        clone.classList.remove("tip-open");\n        clone.setAttribute("aria-expanded", "false");\n        node.parentElement.append(clone);\n      });\n    }\n    const second = page.locator(".enemy .status-chip").nth(1);\n    if (await second.count()) {\n      await status.click();\n      await second.click();\n      assert.equal(await status.getAttribute("aria-expanded"), "false", `${mode}: opening another status closes previous`);\n      assert.equal(await second.getAttribute("aria-expanded"), "true", `${mode}: second status opens`);\n      await second.click();\n    }\n  }'''
          if old_status not in text:
              raise SystemExit('status block not found')
          text = text.replace(old_status, new_status, 1)
          old_discard = '  assert.ok(Number(await page.locator(".discard-pile-trigger b").textContent()) >= 1, `${mode}: card use updates discard`);'
          new_discard = '''  await page.waitForFunction(() => Number(document.querySelector(".discard-pile-trigger b")?.textContent || 0) >= 1, null, { timeout: 8000 });\n  assert.ok(Number(await page.locator(".discard-pile-trigger b").textContent()) >= 1, `${mode}: card use updates discard`);'''
          if old_discard not in text:
              raise SystemExit('discard assertion not found')
          text = text.replace(old_discard, new_discard, 1)
          old_geom = '    assert.ok(cardBox.y >= handBox.y - 1 && cardBox.bottom <= handBox.bottom + 1, `${mode.name}: card ${index + 1} vertically clipped`);'
          new_geom = '''    if (!(cardBox.y >= handBox.y - 1 && cardBox.bottom <= handBox.bottom + 1)) {\n      const handMetrics = await page.locator(".battle > .hand").evaluate((node) => ({ clientHeight: node.clientHeight, scrollHeight: node.scrollHeight, overflowY: getComputedStyle(node).overflowY, paddingTop: getComputedStyle(node).paddingTop, paddingBottom: getComputedStyle(node).paddingBottom }));\n      console.log("STEP9_LANDSCAPE_GEOMETRY", JSON.stringify({ mode: mode.name, fixture, handBox, handMetrics, cardIndex: index + 1, cardBox }));\n    }\n    assert.ok(cardBox.y >= handBox.y - 1 && cardBox.bottom <= handBox.bottom + 1, `${mode.name}: card ${index + 1} vertically clipped`);'''
          if old_geom not in text:
              raise SystemExit('geometry assertion not found')
          path.write_text(text.replace(old_geom, new_geom, 1))
          PY
      - name: Chromium full acceptance
        run: node scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs
      - name: Cleanup and final exact checks
        if: always()
        shell: bash
        run: |
          rm -f scripts/mission-step9-mobile-qa-v2-2c6e9f4a.mjs
          git diff --check -- games/harmony
          npm run check:harmony
          npm run test:harmony
          node scripts/test-harmony-step9-mobile-ui.mjs
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "075676110cea78d0e08e71600a8d587f51ade302"
          echo "VERIFIED_SHA=$(git rev-parse HEAD)"
          echo "WORKTREE_CLEAN=yes"
