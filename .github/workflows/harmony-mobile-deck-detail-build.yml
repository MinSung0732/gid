name: Harmony Mobile Deck Detail Build
on:
  push:
    branches: [fix/harmony-mobile-deck-detail]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/harmony-mobile-deck-detail
          fetch-depth: 0
      - name: Apply scoped integration patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          f='games/harmony/run-summary-filter.js'
          for old,new in [
            ('const CATEGORY_LABELS = Object.freeze({','export const CATEGORY_LABELS = Object.freeze({'),
            ('const NOTE_LABELS = Object.freeze({','export const NOTE_LABELS = Object.freeze({'),
            ('const TYPE_LABELS = Object.freeze({','export const TYPE_LABELS = Object.freeze({'),
            ('function categoryOf(card) {','export function categoryOf(card) {'),
            ('function noteOf(card) {','export function noteOf(card) {'),
            ('function typesOf(card) {','export function typesOf(card) {'),
            ('function semanticWords(card, category, types) {','export function semanticWords(card, category, types) {'),
          ]: patch(f,old,new)

          f='games/harmony/mobile-battle-ui.js'
          patch(f,'import { analyzeBuild } from "./pc-frame-ui.js?v=20260915-9";','import { analyzeBuild } from "./pc-frame-ui.js?v=20260915-9";\nimport { createMobileRunDetail } from "./mobile-run-detail.js?v=20260917-1";')
          anchor='''function isMobileBattle(run = currentRun) {\n  return Boolean(mobileBattleMedia.matches && run?.phase === "battle" && run?.battle);\n}\n'''
          patch(f,anchor,anchor+'''\nconst mobileRunDetail = createMobileRunDetail({\n  getRun: () => currentRun,\n  getDrawer: () => app?.querySelector("#mobile-info-drawer"),\n});\n''')
          patch(f,'function cleanupMobileBattle() {\n  closeDrawer({ restoreFocus: false });','function cleanupMobileBattle() {\n  mobileRunDetail.cleanup();\n  closeDrawer({ restoreFocus: false });')
          patch(f,'  syncMobileHarmony(run);\n  syncMobileDrawer(run);\n}','  syncMobileHarmony(run);\n  syncMobileDrawer(run);\n  mobileRunDetail.sync(run);\n}')
          old='''  if (action === "deck") {\n    const deckButton = drawer?.querySelector("[data-run-open]");\n    closeDrawer({ restoreFocus: false });\n    deckButton?.click();\n  } else if (action === "log") {'''
          new='''  if (action === "deck") {\n    const trigger = drawer?.querySelector('[data-mobile-open="deck"]');\n    if (mobileRunDetail.open(trigger)) return;\n  } else if (action === "log") {'''
          patch(f,old,new)

          f='games/harmony/index.html'
          patch(f,'    <link rel="stylesheet" href="./mobile-battle-ui.css?v=20260917-1" />','    <link rel="stylesheet" href="./mobile-battle-ui.css?v=20260917-1" />\n    <link rel="stylesheet" href="./mobile-run-detail.css?v=20260917-1" />')
          patch(f,'<script type="module" src="./mobile-battle-ui.js?v=20260917-1"></script>','<script type="module" src="./mobile-battle-ui.js?v=20260917-2"></script>')

          f='games/harmony/bootstrap.js'
          patch(f,'await import("./run-summary-filter.js?v=20260913-1");','await import("./run-summary-filter.js?v=20260917-2");')
          PY
          git diff --check -- games/harmony
          node --check games/harmony/mobile-run-detail.js
          git status --short
      - name: Commit scoped integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/harmony/mobile-run-detail.js games/harmony/mobile-run-detail.css games/harmony/mobile-battle-ui.js games/harmony/run-summary-filter.js games/harmony/bootstrap.js games/harmony/index.html
          git commit -m "feat(harmony): integrate mobile deck journey detail" || exit 0
          git push origin HEAD:fix/harmony-mobile-deck-detail
