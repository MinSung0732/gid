name: Harmony Lobby Record Post-Merge Smoke

on:
  pull_request:
    branches:
      - main

jobs:
  postmerge-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run post-merge Lobby record smoke
        run: |
          PORT=5173 npm start > /tmp/harmony-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/games/harmony/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/smoke-harmony-lobby-record-postmerge.mjs
