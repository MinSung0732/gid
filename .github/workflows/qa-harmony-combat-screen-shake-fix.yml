name: qa-harmony-combat-screen-shake-fix

on:
  push:
    branches:
      - fix/harmony-combat-screen-shake-visual

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checkout exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/qa-harmony-combat-screen-shake-fix.mjs /tmp/qa-harmony-combat-screen-shake-fix.mjs
          cp scripts/run-qa-harmony-combat-screen-shake-fix.mjs /tmp/run-qa-harmony-combat-screen-shake-fix.mjs
          git fetch origin main fix/harmony-combat-screen-shake-final
          test "$(git rev-parse origin/main)" = "1ddf1d4e82f3b790210352e641c48af6167d9774"
          git checkout --detach 1ddf1d4e82f3b790210352e641c48af6167d9774
          test "$(git rev-parse HEAD)" = "1ddf1d4e82f3b790210352e641c48af6167d9774"
          changed="$(git diff --name-only faf1c9eb5625cad2f2e05feb0ffb16e2d1a3ad10...HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = "games/harmony/combat-super-fx.css"
          git diff --check -- games/harmony
          cp /tmp/qa-harmony-combat-screen-shake-fix.mjs scripts/qa-harmony-combat-screen-shake-fix.mjs
          cp /tmp/run-qa-harmony-combat-screen-shake-fix.mjs scripts/run-qa-harmony-combat-screen-shake-fix.mjs
      - name: Install Chromium probe runtime
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run exact-SHA mobile smoke
        run: node scripts/run-qa-harmony-combat-screen-shake-fix.mjs
      - name: Remove temporary QA files
        shell: bash
        run: |
          rm -f scripts/qa-harmony-combat-screen-shake-fix.mjs scripts/run-qa-harmony-combat-screen-shake-fix.mjs
          git status --short
          test -z "$(git status --short)"
      - name: Harmony checks
        run: |
          git diff --check -- games/harmony
          npm run check:harmony
          npm run test:harmony
          test "$(git rev-parse HEAD)" = "1ddf1d4e82f3b790210352e641c48af6167d9774"
          test -z "$(git status --short)"
