name: Harmony PC Notice Reflow V2 Final2
on:
  push:
    branches: [qa/harmony-pc-notice-reflow-v2-final2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 348d509eae1dce61fb4547e1a4276fc4570d003b
          fetch-depth: 0
      - name: Exact candidate and static regression
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "348d509eae1dce61fb4547e1a4276fc4570d003b"
          test "$(git diff --name-only 41a27ff39810ba259e5c930a3f15300b0117a1d7..HEAD)" = "games/harmony/pc-route-ui.css"
          git diff --check -- games/harmony
          npm run check:harmony
          npm run test:harmony
      - name: Chromium acceptance
        run: |
          set -euo pipefail
          rm -rf /tmp/harmony-base /tmp/pw qa-artifacts
          git worktree add /tmp/harmony-base 41a27ff39810ba259e5c930a3f15300b0117a1d7
          npm start >/tmp/harmony-candidate.log 2>&1 &
          python3 -m http.server 5174 --directory /tmp/harmony-base >/tmp/harmony-base.log 2>&1 &
          for port in 5173 5174; do for i in {1..30}; do curl -fsS "http://127.0.0.1:${port}/games/harmony/" >/dev/null && break; sleep 1; done; done
          mkdir -p /tmp/pw qa-artifacts/pc qa-artifacts/mobile
          cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          const C='http://127.0.0.1:5173/games/harmony/?local=1',B='http://127.0.0.1:5174/games/harmony/?local=1';
          const out=path.join(process.env.GITHUB_WORKSPACE,'qa-artifacts'),failures=[],report={candidate:'348d509eae1dce61fb4547e1a4276fc4570d003b',pc:[],mobile:[],failures};
          const close=(a,b,t=.75)=>Math.abs(a-b)<=t;
          const rect=async(p,s)=>p.locator(s).evaluate(el=>{const r=el.getBoundingClientRect();return{top:r.top,left:r.left,right:r.right,bottom:r.bottom,width:r.width,height:r.height}});
          const same=(a,b)=>Object.keys(a).every(k=>close(a[k],b[k]));
          const changed=(a,b)=>Object.fromEntries(Object.keys(a).map(k=>[k,same(a[k],b[k])?null:{before:a[k],after:b[k]}]).filter(([,v])=>v));
          const deltaShape=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v?Object.fromEntries(Object.keys(v.before).map(p=>[p,Number((v.after[p]-v.before[p]).toFixed(2))])):null]));
          const fail=(scope,msg)=>failures.push(`${scope}: ${msg}`);
          const pcGeom=async p=>({hud:await rect(p,'.hud.run-hud-enhanced'),app:await rect(p,'#app'),battle:await rect(p,'.battle'),arena:await rect(p,'.battle-arena'),enemies:await rect(p,'.enemies-field'),hand:await rect(p,'.hand'),footer:await rect(p,'.turn-bar'),endTurn:await rect(p,'.turn-bar [data-action="end"]')});
          const mobileGeom=async p=>({app:await rect(p,'#app'),battle:await rect(p,'.battle'),arena:await rect(p,'.battle-arena'),enemies:await rect(p,'.enemies-field'),hand:await rect(p,'.hand'),footer:await rect(p,'.turn-bar'),endTurn:await rect(p,'.turn-bar [data-action="end"]')});
          async function enterBattle(browser,url,width,height){const page=await browser.newPage({viewport:{width,height}}),errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await page.goto(url,{waitUntil:'domcontentloaded'});await page.locator('[data-action="test-new"]').waitFor({state:'visible'});await page.locator('[data-action="test-new"]').click();await page.locator('#starting-deck-builder[open]').waitFor({state:'visible'});await page.locator('#builder-preset').click();await page.locator('#builder-start:not([disabled])').click();await page.locator('#app [data-action="enter"]').waitFor({state:'visible'});await page.locator('#app [data-action="enter"]').click();await page.locator('.battle').waitFor({state:'visible'});await page.locator('.hand > .card[data-action="play"]').first().waitFor({state:'visible'});await page.waitForTimeout(800);return{page,errors}}
          async function trigger(page,text){await page.locator('#notice').evaluate(el=>el.textContent='');await page.locator('.hand > .card[data-action="play"]').first().evaluate((el,text)=>{el.setAttribute('aria-disabled','true');let r=el.querySelector('.card-unavailable-reason');if(!r){r=document.createElement('span');r.className='card-unavailable-reason';r.setAttribute('role','tooltip');el.append(r)}r.textContent=text;el.click()},text);await page.waitForFunction(t=>document.querySelector('#notice')?.textContent?.trim()===t,text,{timeout:5000})}
          async function pcCase(page,scope,label,text){await page.locator('#notice').evaluate(el=>el.textContent='');await page.waitForTimeout(30);const before=await pcGeom(page);await trigger(page,text);const during=await pcGeom(page),d1=changed(before,during);await page.locator('#notice').evaluate(el=>el.textContent='');await page.waitForTimeout(30);const after=await pcGeom(page),d2=changed(before,after);const style=await page.locator('#notice').evaluate(el=>{const s=getComputedStyle(el);return{position:s.position,pointerEvents:s.pointerEvents}});if(Object.keys(d1).length)fail(`${scope}/${label}`,`during ${JSON.stringify(d1)}`);if(Object.keys(d2).length)fail(`${scope}/${label}`,`after ${JSON.stringify(d2)}`);if(style.position!=='absolute'||style.pointerEvents!=='none')fail(`${scope}/${label}`,`style ${JSON.stringify(style)}`);return{label,duringDiff:d1,afterDiff:d2,style}}
          const browser=await chromium.launch({headless:true}),cases=[['ap-shortage','AP가 부족합니다.'],['invalid-card','현재 사용할 수 없는 카드입니다.'],['target-required','대상을 선택하세요.'],['other-combat','전투 조건을 만족하지 못했습니다.']];
          for(const [w,h] of [[1440,900],[1366,768]]){const scope=`${w}x${h}`,x=await enterBattle(browser,C,w,h),results=[];for(const [label,text] of cases)results.push(await pcCase(x.page,scope,label,text));const shake=await x.page.evaluate(()=>{const battle=document.querySelector('.battle'),field=document.querySelector('.enemies-field');battle.classList.add('strong-contact-shake');void battle.offsetWidth;const r={battle:getComputedStyle(battle).animationName,field:getComputedStyle(field).animationName};battle.classList.remove('strong-contact-shake');return r});if(!shake.field?.includes('strong-contact-screen-shake'))fail(scope,`field shake ${JSON.stringify(shake)}`);if(shake.battle&&shake.battle!=='none')fail(scope,`battle shake ${JSON.stringify(shake)}`);await x.page.emulateMedia({reducedMotion:'reduce'});const reduced=await pcCase(x.page,`${scope}/reduced`,'ap-shortage','AP가 부족합니다.');if(x.errors.length)fail(scope,x.errors.join(' | '));await x.page.screenshot({path:path.join(out,'pc',`${scope}.png`),fullPage:true});report.pc.push({scope,results,shake,reduced});await x.page.close()}
          for(const [w,h] of [[390,844],[430,932],[844,390],[932,430]]){const scope=`mobile-${w}x${h}`,base=await enterBattle(browser,B,w,h),cand=await enterBattle(browser,C,w,h);const styleOf=p=>p.locator('#notice').evaluate(el=>{const s=getComputedStyle(el);return{position:s.position,top:s.top,left:s.left,width:s.width,maxWidth:s.maxWidth,margin:s.margin,padding:s.padding,pointerEvents:s.pointerEvents}});const baseStyle=await styleOf(base.page),candStyle=await styleOf(cand.page);if(JSON.stringify(baseStyle)!==JSON.stringify(candStyle))fail(scope,`style ${JSON.stringify({baseStyle,candStyle})}`);const b0=await mobileGeom(base.page);await trigger(base.page,'AP가 부족합니다.');const bd=changed(b0,await mobileGeom(base.page));const c0=await mobileGeom(cand.page);await trigger(cand.page,'AP가 부족합니다.');const cd=changed(c0,await mobileGeom(cand.page));if(JSON.stringify(deltaShape(bd))!==JSON.stringify(deltaShape(cd)))fail(scope,`delta ${JSON.stringify({base:deltaShape(bd),candidate:deltaShape(cd)})}`);if(base.errors.length)fail(`${scope}/base`,base.errors.join(' | '));if(cand.errors.length)fail(`${scope}/candidate`,cand.errors.join(' | '));await cand.page.screenshot({path:path.join(out,'mobile',`${w}x${h}.png`),fullPage:true});report.mobile.push({scope,baseStyle,candStyle,baseDelta:deltaShape(bd),candidateDelta:deltaShape(cd)});await base.page.close();await cand.page.close()}
          report.pass=failures.length===0;fs.writeFileSync(path.join(out,'report.json'),JSON.stringify(report,null,2));console.log('QA_SUMMARY',JSON.stringify({pass:report.pass,pc:report.pc.map(x=>x.scope),mobile:report.mobile.map(x=>x.scope),failures},null,2));await browser.close();if(failures.length)process.exitCode=1;
          EOF
          node qa.mjs
      - name: Candidate tree clean
        run: test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmony-pc-notice-reflow-v2-final2
          path: qa-artifacts/
          if-no-files-found: warn
