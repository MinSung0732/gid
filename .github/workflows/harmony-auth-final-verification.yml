name: Harmony Auth Final Verification

on:
  push:
    branches:
      - feature/harmony-supabase-auth

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary verifier and confirm final tree
        run: |
          git rm .github/workflows/harmony-auth-final-verification.yml
          test "$(git write-tree)" = "d230dc4ec4e74732d33e7f145eab55d51b08427b"

      - name: git diff --check
        run: git diff --cached --check

      - name: check:harmony
        run: npm run check:harmony

      - name: test:harmony
        run: npm run test:harmony

      - name: auth sync test explicit
        run: node scripts/test-harmony-auth-sync.mjs

      - name: Commit verified feature HEAD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: verify final Harmony auth feature head"
          test "$(git rev-parse HEAD^{tree})" = "d230dc4ec4e74732d33e7f145eab55d51b08427b"
          git push origin HEAD:feature/harmony-supabase-auth
