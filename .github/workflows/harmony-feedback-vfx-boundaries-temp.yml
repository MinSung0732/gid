name: Harmony Feedback VFX Boundary Validation
on:
  push:
    branches:
      - validation/harmony-feedback-vfx-boundaries
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Diff whitespace check
        run: git diff --check dba612a98c16606c33381f95c7f3d829dcb5ba89 4a2a7790688b2b9785e640e571fe96dd5235aead -- games/harmony scripts
      - name: Harmony syntax checks
        run: npm run check:harmony
      - name: Harmony regression tests
        run: npm run test:harmony
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm start > /tmp/harmony-feedback-vfx.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/games/harmony/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/harmony-feedback-vfx.log
          exit 1
      - name: Chromium feedback boundary smoke
        run: node scripts/harmony-feedback-boundary-browser-temp.mjs
