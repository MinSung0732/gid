name: mission-publish-harmony-step4-bfa57998

on:
  push:
    branches:
      - refactor/harmony-main-phase2-attack-vfx

permissions:
  contents: write

jobs:
  publish-exact-result:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify task-owned source state
        shell: bash
        run: |
          set -euo pipefail
          base=6c5e57325304e7d5eb790cf823c3c3611f4dda60
          test "$(git merge-base HEAD "$base")" = "$base"
          changed="$(git diff --name-only "$base" HEAD)"
          test "$changed" = ".github/workflows/mission-publish-harmony-step4-bfa57998.yml"
      - name: Reproduce verified sandbox result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          main_path = Path('games/harmony/main.js')
          s = main_path.read_text()

          def function_block(text, name):
              starts = [text.find(f'function {name}('), text.find(f'async function {name}(')]
              starts = [x for x in starts if x >= 0]
              if not starts:
                  raise ValueError(f'function {name} not found')
              start = min(starts)
              brace = text.find('{', start)
              depth = 0
              i = brace
              in_str = None
              escape = in_line = in_block = in_template = False
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if in_line:
                      if c == '\n': in_line = False
                  elif in_block:
                      if c == '*' and n == '/':
                          in_block = False; i += 1
                  elif in_str:
                      if escape: escape = False
                      elif c == '\\': escape = True
                      elif c == in_str: in_str = None
                  elif in_template:
                      if escape: escape = False
                      elif c == '\\': escape = True
                      elif c == '`': in_template = False
                  else:
                      if c == '/' and n == '/': in_line = True; i += 1
                      elif c == '/' and n == '*': in_block = True; i += 1
                      elif c in ('"', "'"): in_str = c
                      elif c == '`': in_template = True
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              if end < len(text) and text[end] == '\n': end += 1
                              return start, end, text[start:end]
                  i += 1
              raise ValueError(f'unclosed {name}')

          names = [
              'showCombatImpactRing', 'contactHitPause', 'showContactImpactHold',
              'showContactImpactCrack', 'showContactTierImpact', 'showShieldBreakImpact',
              'showNonContactImpact', 'showAttackImpactVisual', 'normalizedAttackFx',
              'defaultAttackVfxKey', 'playAttackHitSound', 'enemyHitClassFor',
              'showHitFeedback', 'showWeakContactImpact', 'showStrongContactImpact',
          ]
          blocks = {name: function_block(s, name)[2] for name in names}
          body_parts = []
          for name in names:
              b = blocks[name]
              b = b.replace('combatFxSequence++ % 7', 'nextCombatFxSequence() % 7')
              b = b.replace('combatFxSequence %', 'getCombatFxSequence() %')
              body_parts.append(b.rstrip())

          module = '''import * as E from "./engine.js?v=20260913-22";\nimport { SFX } from "./sound.js?v=20260911-9";\nimport { placeBattleOverlay } from "./battle-overlay.js";\n\nconst SPECIAL_CARD_ATTACK_VFX = Object.freeze({\n  // Future card-only visuals live here. Add `fx: { vfx: "your-key" }` to the\n  // card definition, then register the same key with a handler below.\n  // "example-card-vfx": ({ targetIndex, descriptor }) => { ... },\n});\nconst SPECIAL_CARD_ATTACK_SFX = Object.freeze({\n  // Future card-only sounds use `fx: { sfx: "your-key" }` on the card and a\n  // matching function here. Missing handlers intentionally fall back to defaults.\n});\n\nexport function createAttackFeedbackVfx({\n  combatEffectsEnabled,\n  effectsLayer,\n  enemyElement,\n  formatNumber,\n  getCombatFxSequence,\n  nextCombatFxSequence,\n  playContactHitSound,\n  reducedCombatMotion,\n}) {\n  const number = formatNumber;\n\n'''
          module += '\n\n'.join('  ' + part.replace('\n', '\n  ') for part in body_parts)
          module += '''\n\n  return {\n    contactHitPause,\n    showHitFeedback,\n    showStrongContactImpact,\n    showWeakContactImpact,\n  };\n}\n'''
          Path('games/harmony/attack-feedback-vfx.js').write_text(module)

          ranges = [(*function_block(s, name)[:2], name) for name in names]
          for start, end, name in sorted(ranges, reverse=True):
              s = s[:start] + s[end:]
          for const_name in ['SPECIAL_CARD_ATTACK_VFX', 'SPECIAL_CARD_ATTACK_SFX']:
              pattern = re.compile(rf'const {const_name} = Object\.freeze\(\{{[\s\S]*?\n\}}\);\n')
              s, count = pattern.subn('', s, count=1)
              if count != 1:
                  raise ValueError(f'failed removing {const_name}: {count}')
          needle = 'import { createCombatFeedbackVfx } from "./combat-feedback-vfx.js";\n'
          s = s.replace(needle, needle + 'import { createAttackFeedbackVfx } from "./attack-feedback-vfx.js";\n', 1)
          start, end, _ = function_block(s, 'reducedCombatMotion')
          wiring = '''const {\n  contactHitPause,\n  showHitFeedback,\n  showStrongContactImpact,\n  showWeakContactImpact,\n} = createAttackFeedbackVfx({\n  combatEffectsEnabled,\n  effectsLayer,\n  enemyElement,\n  formatNumber: number,\n  getCombatFxSequence: () => combatFxSequence,\n  nextCombatFxSequence: () => combatFxSequence++,\n  playContactHitSound,\n  reducedCombatMotion,\n});\n'''
          s = s[:end] + wiring + s[end:]
          main_path.write_text(s)

          test = '''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\n\nconst main = await readFile(new URL("../games/harmony/main.js", import.meta.url), "utf8");\nconst attack = await readFile(new URL("../games/harmony/attack-feedback-vfx.js", import.meta.url), "utf8");\n\nassert.match(\n  main,\n  /from "\\.\\/attack-feedback-vfx\\.js"/,\n  "main should consume the shared attack feedback VFX module",\n);\nassert.match(\n  main,\n  /createAttackFeedbackVfx\\(\\{[\\s\\S]*?combatEffectsEnabled[\\s\\S]*?effectsLayer[\\s\\S]*?enemyElement[\\s\\S]*?formatNumber:\\s*number[\\s\\S]*?getCombatFxSequence[\\s\\S]*?nextCombatFxSequence[\\s\\S]*?playContactHitSound[\\s\\S]*?reducedCombatMotion[\\s\\S]*?\\}\\)/s,\n  "main should inject the existing combat DOM, sequence, sound and motion dependencies",\n);\n\nfor (const name of [\n  "showCombatImpactRing",\n  "contactHitPause",\n  "showContactImpactHold",\n  "showContactImpactCrack",\n  "showContactTierImpact",\n  "showShieldBreakImpact",\n  "showNonContactImpact",\n  "showAttackImpactVisual",\n  "normalizedAttackFx",\n  "defaultAttackVfxKey",\n  "playAttackHitSound",\n  "enemyHitClassFor",\n  "showHitFeedback",\n  "showWeakContactImpact",\n  "showStrongContactImpact",\n]) {\n  assert.doesNotMatch(\n    main,\n    new RegExp(`function ${name}\\\\(`),\n    `${name} implementation should live outside main.js`,\n  );\n  assert.match(\n    attack,\n    new RegExp(`function ${name}\\\\(`),\n    `${name} should remain implemented by attack-feedback-vfx.js`,\n  );\n}\n\nassert.match(attack, /from "\\.\\/engine\\.js\\?v=20260913-22"/);\nassert.match(attack, /from "\\.\\/sound\\.js\\?v=20260911-9"/);\nassert.match(attack, /from "\\.\\/battle-overlay\\.js"/);\n\nfor (const marker of [\n  "contact-impact-hold",\n  "contact-impact-crack",\n  "shield-break-impact",\n  "noncontact-impact",\n  "damage-pop",\n  "weak-contact-impact",\n  "strong-contact-impact",\n]) {\n  assert.match(attack, new RegExp(marker), `attack feedback module should preserve ${marker}`);\n}\n\nassert.match(\n  attack,\n  /descriptor\\.pattern === "contact" && descriptor\\.shieldBreak[\\s\\S]*?barrierBreakSuperContactHit[\\s\\S]*?barrierBreakStrongContactHit[\\s\\S]*?barrierBreakContactHit/s,\n  "contact shield-break sound selection should remain unchanged",\n);\nassert.match(\n  attack,\n  /nextCombatFxSequence\\(\\) % 7/,\n  "damage popup variation should keep advancing the shared combat FX sequence",\n);\nassert.match(\n  main,\n  /angle = Math\\.round\\(index \\* \\(360 \\/ moteCount\\) \\+ \\(combatFxSequence % 5\\) \\* 7\\)/,\n  "non-contact cast visuals should keep sharing the same combat FX sequence",\n);\nassert.match(\n  attack,\n  /return \\{[\\s\\S]*?contactHitPause[\\s\\S]*?showHitFeedback[\\s\\S]*?showStrongContactImpact[\\s\\S]*?showWeakContactImpact[\\s\\S]*?\\};/s,\n  "factory should expose only the attack feedback functions still consumed by main",\n);\n\nconsole.log("PASS Harmony attack feedback VFX is modular without changing hit impact, sound, or shared sequence contracts.");\n'''
          Path('scripts/test-harmony-attack-feedback-vfx.mjs').write_text(test)

          p = Path('package.json')
          data = json.loads(p.read_text())
          data['scripts']['check:harmony'] = data['scripts']['check:harmony'].replace(
              'node --check games/harmony/combat-feedback-vfx.js',
              'node --check games/harmony/combat-feedback-vfx.js && node --check games/harmony/attack-feedback-vfx.js',
          ).replace(
              'node --check scripts/test-harmony-combat-feedback-vfx.mjs',
              'node --check scripts/test-harmony-combat-feedback-vfx.mjs && node --check scripts/test-harmony-attack-feedback-vfx.mjs',
          )
          data['scripts']['test:harmony'] = data['scripts']['test:harmony'].replace(
              'node scripts/test-harmony-combat-feedback-vfx.mjs',
              'node scripts/test-harmony-combat-feedback-vfx.mjs && node scripts/test-harmony-attack-feedback-vfx.mjs',
          )
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          rm .github/workflows/mission-publish-harmony-step4-bfa57998.yml
          git add -A
          test "$(git write-tree)" = "1cd0cd75ce812cce5cd3147062a4bfae29125d2c"
      - name: Verify exact result
        run: |
          npm run check:harmony
          npm run test:harmony
          npm test
      - name: Commit and publish exact tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "1cd0cd75ce812cce5cd3147062a4bfae29125d2c"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(harmony): extract attack feedback VFX from main"
          git push origin HEAD:refactor/harmony-main-phase2-attack-vfx
