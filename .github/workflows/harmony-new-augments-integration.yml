name: Harmony New Augments Integration
on:
  push:
    branches: [qa/harmony-new-augments-integrate]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/harmony-new-augments-main
          fetch-depth: 0
      - name: Integrate staged modules and refine runtime hooks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "571eb3512a3cf74e4da34d9d823d7376e668501f"
          git fetch origin feat/harmony-new-augments-staging
          git checkout origin/feat/harmony-new-augments-staging -- \
            games/harmony/staged-augments.js \
            games/harmony/staged-augment-runtime.js \
            games/harmony/engine.js \
            scripts/test-harmony-staged-augments.mjs

          python - <<'PY'
          from pathlib import Path
          import re

          core_path = Path('games/harmony/engine-core.js')
          core = core_path.read_text()
          old_sig = 'export function play(s, index, meta) {'
          assert core.count(old_sig) == 1, 'engine-core play signature changed'
          core = core.replace(old_sig, 'export function play(s, index, meta, hooks = null) {', 1)

          old_effect = '''  const hpBeforeCard = s.hp,
            shieldBeforeCard = b.shield,
            absorbBeforeCard = b.absorb,
            targets = effect(s, card);
          '''
          new_effect = '''  const hpBeforeCard = s.hp,
            shieldBeforeCard = b.shield,
            absorbBeforeCard = b.absorb,
            effectHookContext = {
              state: s,
              battle: b,
              card,
              definition,
              paidCost,
              interferenceTriggered,
              meta,
            };
          let effectHookState = null,
            targets = [];
          try {
            effectHookState = hooks?.beforeEffect?.(effectHookContext) ?? null;
            targets = effect(s, card);
            hooks?.afterEffect?.({ ...effectHookContext, targets, hookState: effectHookState });
          } finally {
            hooks?.cleanupEffect?.({ ...effectHookContext, targets, hookState: effectHookState });
          }
          '''
          assert old_effect in core, 'engine-core effect block changed'
          core = core.replace(old_effect, new_effect, 1)

          marker = 'export function play(s, index, meta, hooks = null) {'
          helpers = '''export function dealEnemyDamage(s, enemy, amount, options = {}) {
            return damage(s, amount, { ...options, targetEnemy: enemy });
          }
          export function drawCards(s, amount, turnStart = false) {
            return draw(s, amount, turnStart);
          }
          '''
          assert core.count(marker) == 1
          core = core.replace(marker, helpers + marker, 1)
          core_path.write_text(core)

          runtime_path = Path('games/harmony/staged-augment-runtime.js')
          runtime = runtime_path.read_text()

          pattern = re.compile(r'function withTemporaryCardValues\(cards, card, overrides, callback\) \{.*?\n\}\n\nfunction uniqueHitTargetIndexes\(state, pattern\) \{.*?\n\}', re.S)
          replacement = '''function installTemporaryCardValues(cards, card, overrides) {
            const definition = cards[card.id];
            if (!definition || !Object.keys(overrides).length) return () => {};
            const saved = [];
            const level = Math.max(0, Math.min(definition.maxUpgrade || 0, card.level || 0));
            for (const [key, value] of Object.entries(overrides)) {
              saved.push({ key, value: definition[key], had: Object.prototype.hasOwnProperty.call(definition, key) });
              definition[key] = value;
              if (Array.isArray(definition.upgrades?.[key])) {
                saved[saved.length - 1].upgrade = definition.upgrades[key][level];
                definition.upgrades[key][level] = value;
              }
            }
            return () => {
              for (const entry of saved) {
                if (entry.had) definition[entry.key] = entry.value;
                else delete definition[entry.key];
                if (Object.prototype.hasOwnProperty.call(entry, "upgrade"))
                  definition.upgrades[entry.key][level] = entry.upgrade;
              }
            };
          }

          function uniqueHitTargetIndexes(state, pattern, start = 0) {
            const hits = (state?._enemyHitFeedback || []).slice(start);
            return [...new Set(hits
              .filter((hit) => hit.attackPattern === pattern && !hit.statusId && (hit.damage > 0 || hit.blocked > 0))
              .map((hit) => hit.targetIndex)
              .filter(Number.isInteger))];
          }'''
          runtime, count = pattern.subn(replacement, runtime, count=1)
          assert count == 1, 'temporary value/hit helper block changed'

          runtime = runtime.replace(
            'const targets = uniqueHitTargetIndexes(state, "nonContact")',
            'const targets = uniqueHitTargetIndexes(state, "nonContact", snapshot.hitFeedbackBefore)',
            1,
          )
          runtime = runtime.replace(
            'const hits = (state._enemyHitFeedback || []).filter((hit) => !hit.statusId && (hit.damage > 0 || hit.blocked > 0));',
            'const hits = (state._enemyHitFeedback || []).slice(snapshot.hitFeedbackBefore).filter((hit) => !hit.statusId && (hit.damage > 0 || hit.blocked > 0));',
            1,
          )
          runtime = runtime.replace('  let consumedResonance = 0;\n  let chainSplash = null;\n  let criticalDischarge = false;\n', '  let consumedResonance = 0;\n  let chainSplash = null;\n', 1)

          old_critical = '''  if (consumedResonance >= 6 && Core.power(state, "resonanceConsumeRefundDraw") > 0 && !battle._stagedCriticalDischarge) {
            criticalDischarge = true;
            overrides.draw = (definition.draw || 0) + 1;
          }
          '''
          new_critical = '''  if (consumedResonance >= 6 && Core.power(state, "resonanceConsumeRefundDraw") > 0 && !battle._stagedCriticalDischarge) {
            Core.gainCurrentAp(state, 1);
            Core.drawCards(state, 1);
            battle._stagedCriticalDischarge = true;
          }
          '''
          assert old_critical in runtime, 'critical discharge block changed'
          runtime = runtime.replace(old_critical, new_critical, 1)
          old_return = '  return { overrides, consumedResonance, chainSplash, criticalDischarge };'
          assert old_return in runtime
          runtime = runtime.replace(old_return, '  const restore = installTemporaryCardValues(cards, card, overrides);\n  return { overrides, consumedResonance, chainSplash, restore };', 1)

          splash_pattern = re.compile(r'function applyChainSplashPre\(Core, state, snapshot, prepared\) \{.*?\n\}\n\nfunction finishChainSplash\(state, prepared\) \{.*?\n\}', re.S)
          splash_replacement = '''function applyChainSplashAfter(Core, state, prepared) {
            const splash = prepared?.chainSplash;
            if (!splash || !state?.battle) return;
            const battle = state.battle;
            if (splash.amount > 0) {
              for (const enemy of battle.enemies) {
                if (!enemy || enemy === splash.mainTarget || enemy.hp <= 0) continue;
                Core.dealEnemyDamage(state, enemy, splash.amount, {
                  direct: false,
                  bypassShield: true,
                  statusId: "resonanceChainSplash",
                  attackPattern: "nonContact",
                });
              }
            }
            if (splash.resonanceAdd > 0) {
              for (const enemy of battle.enemies) {
                if (enemy !== splash.mainTarget && enemy.hp > 0)
                  applyEnemyStatus(enemy, "resonance", splash.resonanceAdd);
              }
            }
          }'''
          runtime, count = splash_pattern.subn(splash_replacement, runtime, count=1)
          assert count == 1, 'chain splash block changed'

          play_pattern = re.compile(r'export function playWithStagedAugments\(Core, cards, items, state, index, meta\) \{.*?\n\}\n\nexport function discardWithStagedAugments', re.S)
          play_replacement = '''export function playWithStagedAugments(Core, cards, items, state, index, meta) {
            if (state?.phase !== "battle" || !state.battle) return Core.play(state, index, meta);
            ensureTurnState(state.battle);
            const battle = state.battle,
              card = battle.hand[index];
            if (!card || !cards[card.id]) return Core.play(state, index, meta);
            const definition = Core.cardDefinition(card),
              pattern = definition.attackPattern || (definition.attack || definition.burst || definition.weight ? "contact" : null),
              attackCard = Boolean(definition.attack || definition.burst || definition.weight),
              selected = Core.selectedEnemy(battle),
              paidCost = Core.cost(state, card),
              snapshot = {
                cardsPlayedBefore: battle.cardsPlayedThisTurn || 0,
                nonContactCardsBefore: battle.nonContactCardsPlayedThisTurn || 0,
                paidContactBefore: battle._stagedPaidContactCardsPlayed || 0,
                harmoniesBefore: battle.harmoniesThisTurn || 0,
                shieldBefore: battle.shield || 0,
                handBefore: battle.hand.length,
                playerRegenerationBefore: S.stacks(state, "regeneration"),
                selectedEnemy: selected,
                selectedBleedBefore: selected ? S.stacks(selected, "bleed") : 0,
                selectedAilmentTypesBefore: selected ? ailmentTypeCount(selected) : 0,
                enemyResonance: battle.enemies.map((enemy) => S.stacks(enemy, "resonance")),
                enemiesBefore: battle.enemies.map((enemy) => ({ hp: enemy.hp, resonance: S.stacks(enemy, "resonance") })),
                hitFeedbackBefore: (state._enemyHitFeedback || []).length,
                controlFeedbackBefore: state._controlFeedback,
                pattern,
                attackCard,
                paidCost,
              };
            let prepared = null;
            const result = Core.play(state, index, meta, {
              beforeEffect() {
                prepared = prepareCard(Core, cards, state, card, definition, snapshot);
                return prepared;
              },
              afterEffect() {
                applyChainSplashAfter(Core, state, prepared);
              },
              cleanupEffect() {
                prepared?.restore?.();
              },
            });
            if (!result) return result;
            const controlChanged = state._controlFeedback !== snapshot.controlFeedbackBefore,
              controlStatus = controlChanged ? state._controlFeedback?.statusId : null,
              secondaryFailed = ["confusion", "interference"].includes(controlStatus),
              definitionAfter = cards[card.id];

            if (!secondaryFailed) {
              let refund = 0;
              switch (definitionAfter.stagedRefund) {
                case "paidContactBefore": refund = snapshot.paidContactBefore > 0 ? 1 : 0; break;
                case "ailmentTypes2": refund = snapshot.selectedAilmentTypesBefore >= 2 ? 1 : 0; break;
                case "shield12Before": refund = snapshot.shieldBefore >= 12 ? 1 : 0; break;
                case "regenerationBefore": refund = snapshot.playerRegenerationBefore >= 1 ? 1 : 0; break;
                case "harmonyCompletedByCard": refund = (battle.harmoniesThisTurn || 0) > snapshot.harmoniesBefore ? 1 : 0; break;
                case "hand6Before": refund = snapshot.handBefore >= 6 ? 1 : 0; break;
                case "targetBleed4Before": refund = snapshot.selectedBleedBefore >= 4 ? 1 : 0; break;
                case "ailmentTypes3": refund = snapshot.selectedAilmentTypesBefore >= 3 ? 2 : 0; break;
                case "fifthCardOnce":
                  if (snapshot.cardsPlayedBefore >= 4 && !battle._stagedFifthCardRefunded) {
                    refund = 2;
                    battle._stagedFifthCardRefunded = true;
                  }
                  break;
                default: break;
              }
              if (refund > 0) Core.gainCurrentAp(state, refund);
            }

            if ((battle.pendingDiscard || 0) > (snapshot.pendingDiscardBefore || 0) && definitionAfter.stagedDiscardRefundBaseCost)
              battle._stagedDiscardRefundQueue += (battle.pendingDiscard || 0) - (snapshot.pendingDiscardBefore || 0);

            if (attackCard && pattern === "contact" && paidCost > 0)
              battle._stagedPaidContactCardsPlayed += 1;

            applyResonanceBuffer(Core, state, snapshot);
            applyPostNonContactResonance(Core, state, snapshot);
            applyCaptureFlask(Core, state, snapshot.enemiesBefore);
            return result;
          }

          export function discardWithStagedAugments'''
          # Include pending discard snapshot in the object before substituting.
          play_replacement = play_replacement.replace(
            'paidCost,\n              };',
            'paidCost,\n                pendingDiscardBefore: battle.pendingDiscard || 0,\n              };',
          )
          runtime, count = play_pattern.subn(play_replacement, runtime, count=1)
          assert count == 1, 'playWithStagedAugments block changed'
          runtime_path.write_text(runtime)
          PY

          cat > scripts/test-harmony-staged-augments.mjs <<'EOF'
          import assert from "node:assert/strict";
          import * as S from "../games/harmony/statuses.js";

          const data = await import("../games/harmony/data.js");
          const staged = await import("../games/harmony/staged-augments.js");
          const originalCardIds = new Set(Object.keys(data.CARDS));
          const originalItemIds = new Set(Object.keys(data.ITEMS));
          const stagedCardIds = Object.keys(staged.STAGED_AUGMENT_CARDS);
          const stagedItemIds = Object.keys(staged.STAGED_AUGMENT_ITEMS);

          assert.equal(stagedCardIds.length, 16);
          assert.equal(stagedItemIds.length, 6);
          assert.deepEqual(stagedCardIds.filter((id) => originalCardIds.has(id)), [], "staged card IDs must not collide with main");
          assert.deepEqual(stagedItemIds.filter((id) => originalItemIds.has(id)), [], "staged item IDs must not collide with main");

          const E = await import("../games/harmony/engine.js");
          const { CARDS, ITEMS } = data;
          const maxCopiesByTier = { 1: 4, 2: 3, 3: 2, 4: 1 };

          for (const id of stagedCardIds) {
            const card = CARDS[id];
            assert.ok(card, `missing staged card: ${id}`);
            assert.equal(card.id, id);
            assert.ok(card.tier >= 1 && card.tier <= 4, `invalid tier: ${id}`);
            assert.equal(card.maxCopies, maxCopiesByTier[card.tier], `new-card copy cap mismatch: ${id}`);
            assert.equal(E.cardMaxCopies(id), maxCopiesByTier[card.tier], `engine copy cap mismatch: ${id}`);
          }
          for (const id of stagedItemIds) {
            const item = ITEMS[id];
            assert.ok(item, `missing staged item: ${id}`);
            assert.equal(item.id, id);
            assert.ok(["trait", "relic"].includes(item.kind));
          }

          function makeRun(handIds, { enemyCount = 1, seed = 113 } = {}) {
            const meta = E.freshMeta();
            const deck = Array.from({ length: 10 }, (_, index) => handIds[index % handIds.length]);
            const state = E.newRun(seed, deck, meta);
            state.route = Array(12).fill("combat");
            state.route[11] = "boss";
            E.enter(state, meta);
            assert.equal(state.phase, "battle");
            const template = structuredClone(state.battle.enemies[0]);
            state.battle.enemies = Array.from({ length: enemyCount }, (_, index) => ({
              ...structuredClone(template),
              name: `QA Enemy ${index + 1}`,
              hp: 200,
              maxHp: 200,
              shield: 0,
              statuses: S.createStatuses(),
              intent: { type: "attack", amount: 1 },
            }));
            E.attachEnemyAliases(state.battle);
            state.battle.selectedTarget = 0;
            state.battle.ap = 8;
            state.battle.hand = handIds.map((id) => ({ id, level: 0 }));
            state.battle.draw = Array.from({ length: 10 }, () => ({ id: "guard_resonance_cover", level: 0 }));
            state.battle.discard = [];
            state.battle.exhaust = [];
            state.battle.pendingDiscard = 0;
            state.battle.cardsPlayedThisTurn = 0;
            state.battle.nonContactCardsPlayedThisTurn = 0;
            state.battle.contactCardsPlayedThisTurn = 0;
            state.battle.harmoniesThisTurn = 0;
            state.battle.notes = [];
            state._enemyHitFeedback = [];
            delete state._controlFeedback;
            return { state, meta };
          }
          const enemy = (state, index = 0) => state.battle.enemies[index];
          const add = (entity, id, amount) => S.applyStatus(entity, id, amount);

          // Paid contact tracking uses actual AP payment, not merely card type.
          {
            const { state, meta } = makeRun(["contact_scentline_rewind", "contact_scentline_rewind"]);
            assert.equal(E.play(state, 0, meta), true);
            assert.equal(state.battle.ap, 7);
            assert.equal(E.play(state, 0, meta), true);
            assert.equal(state.battle.ap, 7, "second paid contact refunds 1 AP from pre-play state");
          }
          {
            const { state, meta } = makeRun(["contact_scentline_rewind", "contact_scentline_rewind"]);
            state.battle.hand[0].costReduction = 99;
            assert.equal(E.play(state, 0, meta), true);
            assert.equal(E.play(state, 0, meta), true);
            assert.equal(state.battle.ap, 7, "a zero-paid contact must not arm the later refund");
          }

          // Pre-card snapshots: ailments, shield, regeneration, hand size, bleed and Harmony completion.
          {
            const { state, meta } = makeRun(["noncontact_compound_vapor_recovery"]);
            add(enemy(state), "burning", 1); add(enemy(state), "poison", 1);
            E.play(state, 0, meta); assert.equal(state.battle.ap, 8);
          }
          {
            const { state, meta } = makeRun(["guard_wax_recoil_coating"]);
            state.battle.shield = 12; E.play(state, 0, meta); assert.equal(state.battle.ap, 8);
          }
          {
            const { state, meta } = makeRun(["heal_regenerative_inhalation"]);
            state.hp = 60; add(state, "regeneration", 1); E.play(state, 0, meta); assert.equal(state.battle.ap, 8);
          }
          {
            const ids = ["noncontact_supersaturated_tray_spray", ...Array(5).fill("guard_resonance_cover")];
            const { state, meta } = makeRun(ids); E.play(state, 0, meta); assert.equal(state.battle.ap, 8);
          }
          {
            const { state, meta } = makeRun(["contact_bloodflow_rhythm_pierce"]);
            add(enemy(state), "bleed", 4); E.play(state, 0, meta); assert.equal(state.battle.ap, 7);
          }
          {
            const { state, meta } = makeRun(["noncontact_compound_toxic_reignition"]);
            add(enemy(state), "burning", 1); add(enemy(state), "poison", 1); add(enemy(state), "corrosion", 1);
            E.play(state, 0, meta); assert.equal(state.battle.ap, 8);
          }
          {
            const { state, meta } = makeRun(["guard_triad_note_stopper"]);
            state.battle.notes = [{ id: "qa-top", level: 0, note: "top" }, { id: "qa-mid", level: 0, note: "middle" }];
            E.play(state, 0, meta); assert.equal(state.battle.ap, 8); assert.equal(state.battle.harmoniesThisTurn, 1);
          }

          // Discard refund uses the discarded card definition's base AP, ignoring temporary reductions.
          {
            const { state, meta } = makeRun(["guard_discard_solvent_recovery", "contact_bloodflow_rhythm_pierce"]);
            state.battle.hand[1].costReduction = 99;
            E.play(state, 0, meta);
            assert.equal(state.battle.pendingDiscard, 1);
            E.discardFromHand(state, 0, meta);
            assert.equal(state.battle.ap, 8);
          }

          // Partial resonance consumption.
          {
            const { state, meta } = makeRun(["heal_resonance_suture"]);
            state.hp = 50; add(enemy(state), "resonance", 3);
            E.play(state, 0, meta);
            assert.equal(S.stacks(enemy(state), "resonance"), 1);
            assert.equal(state.hp, 58);
          }
          {
            const { state, meta } = makeRun(["absorb_resonance_condensation"]);
            state.battle.absorb = 0; add(enemy(state), "resonance", 6);
            E.play(state, 0, meta);
            assert.equal(S.stacks(enemy(state), "resonance"), 2);
            assert.equal(state.battle.absorb, 14);
          }

          // Chain Collapse: consume -> actual-consumed traits -> main hit -> piercing splash -> resonance +2.
          {
            const { state, meta } = makeRun(["noncontact_resonance_chain_collapse"], { enemyCount: 3 });
            state.inventory.push("trait_inverse_phase_amplifier", "trait_critical_discharge_meter");
            add(enemy(state, 0), "resonance", 12);
            enemy(state, 1).shield = 99; enemy(state, 2).shield = 99;
            E.play(state, 0, meta);
            assert.equal(S.stacks(enemy(state, 0), "resonance"), 0);
            assert.equal(enemy(state, 0).hp, 135, "20 + min(12,10)*4 + min(12,5)*1 = 65 main damage");
            assert.equal(enemy(state, 1).hp, 180); assert.equal(enemy(state, 2).hp, 180);
            assert.equal(enemy(state, 1).shield, 99); assert.equal(enemy(state, 2).shield, 99);
            assert.equal(S.stacks(enemy(state, 1), "resonance"), 2); assert.equal(S.stacks(enemy(state, 2), "resonance"), 2);
            assert.equal(state.battle.ap, 7, "critical discharge refunds 1 AP once after actual 12-stack consumption");
            assert.equal(state.battle._stagedCriticalDischarge, true);
            const hits = state._enemyHitFeedback.filter((hit) => hit.targetIndex != null);
            const mainIndex = hits.findIndex((hit) => hit.targetIndex === 0 && !hit.statusId);
            const splashIndexes = [1, 2].map((targetIndex) => hits.findIndex((hit) => hit.targetIndex === targetIndex && hit.statusId === "resonanceChainSplash"));
            assert.ok(mainIndex >= 0 && splashIndexes.every((index) => index > mainIndex), "main hit must precede all chain splash hits");
          }
          {
            const { state, meta } = makeRun(["noncontact_resonance_chain_collapse"], { enemyCount: 2 });
            state.battle.hand[0].level = 1; add(enemy(state), "resonance", 12);
            E.play(state, 0, meta);
            assert.equal(enemy(state).hp, 124, "upgrade: 26 + min(12,10)*5 = 76 main damage");
          }

          // First non-contact, per-turn buffer, kill transfer and permanent core threshold.
          {
            const { state, meta } = makeRun(["noncontact_compound_vapor_recovery", "noncontact_compound_vapor_recovery"]);
            state.inventory.push("trait_resonance_ignition_coil", "trait_resonance_ignition_coil");
            E.play(state, 0, meta); assert.equal(S.stacks(enemy(state), "resonance"), 2);
            E.play(state, 0, meta); assert.equal(S.stacks(enemy(state), "resonance"), 2, "first non-contact trait is turn-once");
          }
          {
            const { state, meta } = makeRun(["contact_resonance_piercing_needle", "contact_resonance_piercing_needle"]);
            state.inventory.push("trait_resonance_buffer_field", "trait_resonance_buffer_field"); add(enemy(state), "resonance", 1);
            E.play(state, 0, meta); assert.equal(state.battle.shield, 6);
            E.play(state, 0, meta); assert.equal(state.battle.shield, 6, "resonance buffer is turn-once");
          }
          {
            const { state, meta } = makeRun(["contact_resonance_piercing_needle"], { enemyCount: 2 });
            state.inventory.push("relic_resonance_capture_flask"); enemy(state, 0).hp = 1; add(enemy(state, 0), "resonance", 4);
            E.play(state, 0, meta); assert.equal(enemy(state, 0).hp, 0); assert.equal(S.stacks(enemy(state, 1), "resonance"), 4);
          }
          for (const [before, after] of [[4, 5], [5, 7]]) {
            const { state, meta } = makeRun(["noncontact_compound_vapor_recovery"]);
            state.inventory.push("relic_permanent_resonance_core"); add(enemy(state), "resonance", before);
            E.play(state, 0, meta); assert.equal(S.stacks(enemy(state), "resonance"), after);
          }

          // Passive suppression must disable staged traits/relics through the existing power() contract.
          {
            const { state, meta } = makeRun(["noncontact_compound_vapor_recovery"]);
            state.inventory.push("trait_resonance_ignition_coil", "relic_permanent_resonance_core");
            add(state, "silence", { stacks: 1, turns: 1 });
            E.play(state, 0, meta);
            assert.equal(S.stacks(enemy(state), "resonance"), 0);
          }

          // Item reward registry reachability: all six staged items must be selectable by live reward profiles.
          {
            const seen = new Set();
            for (let seed = 1; seed <= 25000 && seen.size < stagedItemIds.length; seed++) {
              const meta = E.freshMeta(), state = E.newRun(seed, ["guard_resonance_cover"], meta);
              for (const room of ["golden", "elite", "boss"]) {
                const id = E.rollLoot(state, room, meta);
                if (stagedItemIds.includes(id)) seen.add(id);
              }
            }
            assert.deepEqual(stagedItemIds.filter((id) => !seen.has(id)), [], "all staged items must be reachable from live reward profiles");
          }

          // Existing T2 fallback remains untouched; only staged T2 cards opt into 3 copies.
          assert.equal(E.cardMaxCopies({ tier: 2 }), 2);
          assert.equal(CARDS.guard_discard_solvent_recovery.maxCopies, 3);

          console.log("PASS Harmony staged augments: registry, copy caps, pre-state refunds, resonance runtime, reward reachability and passive restrictions.");
          EOF

          git diff --check -- games/harmony scripts/test-harmony-staged-augments.mjs
          node --check games/harmony/staged-augments.js
          node --check games/harmony/staged-augment-runtime.js
          node --check games/harmony/engine.js
          node --check games/harmony/engine-core.js
          node --check scripts/test-harmony-staged-augments.mjs
          npm run check:harmony
          npm run test:harmony
          node scripts/test-harmony-staged-augments.mjs
      - name: Guard UI and save/runtime scope
        run: |
          set -euo pipefail
