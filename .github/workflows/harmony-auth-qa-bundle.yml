name: Harmony Auth QA Bundle

on:
  push:
    branches:
      - feature/harmony-supabase-auth

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: harmony-auth-source
          path: .
          include-hidden-files: true
          retention-days: 1
