name: Harmony Portrait Visual QA
on:
  push:
    branches:
      - qa/harmony-portrait-visual-6e3aea
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 6e3aea335a210f58ab4558e9da835ad3b22cef5f
          path: app
      - name: Assert exact candidate
        run: |
          test "$(git -C app rev-parse HEAD)" = "6e3aea335a210f58ab4558e9da835ad3b22cef5f"
          test -z "$(git -C app status --porcelain)"
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact candidate server
        run: |
          cd app
          npm start > /tmp/harmony-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/games/harmony/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Chromium battle DOM introspection
        run: |
          mkdir -p qa-artifacts
          cat > inspect.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errors = [];
          page.on('console', m => { if (m.type() === 'error') errors.push(`console:${m.text()}`); });
          page.on('pageerror', e => errors.push(`pageerror:${e.message}`));
          await page.goto('http://127.0.0.1:5173/games/harmony/?local=1', { waitUntil: 'domcontentloaded', timeout: 15000 });
          await page.locator('[data-action="test-new"]').waitFor({ state: 'visible', timeout: 15000 });
          await page.locator('[data-action="test-new"]').click();
          await page.locator('#starting-deck-builder[open]').waitFor({ state: 'visible' });
          await page.locator('#builder-preset').click();
          await page.locator('#builder-start:not([disabled])').waitFor({ state: 'visible' });
          await page.locator('#builder-start').click();
          await page.locator('#app [data-action="enter"]').waitFor({ state: 'visible' });
          await page.locator('#app [data-action="enter"]').click();
          await page.locator('.battle').waitFor({ state: 'visible', timeout: 15000 });
          await page.waitForTimeout(300);
          await page.screenshot({ path: 'qa-artifacts/battle-390x844.png', fullPage: false });
          const rect = el => el ? Object.fromEntries(['x','y','top','right','bottom','left','width','height'].map(k=>[k,el.getBoundingClientRect()[k]])) : null;
          const info = await page.evaluate(() => {
            const r = el => el ? Object.fromEntries(['x','y','top','right','bottom','left','width','height'].map(k=>[k,el.getBoundingClientRect()[k]])) : null;
            const q = s => document.querySelector(s);
            const qa = s => [...document.querySelectorAll(s)];
            return {
              bodyClass: document.body.className,
              htmlClass: document.documentElement.className,
              bodyText: document.body.innerText.slice(0,14000),
              battleHtml: q('.battle')?.outerHTML?.slice(0,70000) ?? '',
              counts: { enemies: qa('.enemy').length, hand: qa('.hand > .card').length, turnChips: qa('.turn-chip').length },
              classes: { enemiesField:q('.enemies-field')?.className, turnOrder:q('.turn-order')?.className, hand:q('.hand')?.className },
              rects: {
                battle:r(q('.battle')), battleTop:r(q('.battle-top')), arena:r(q('.battle-arena')), turnOrder:r(q('.turn-order')),
                turnLabel:r(q('.turn-order > strong')), turnChips:qa('.turn-chip').map(r), field:r(q('.enemies-field')),
                enemies:qa('.enemy').map(r), hand:r(q('.hand')), cards:qa('.hand > .card').map(r), turnBar:r(q('.turn-bar')),
                end:r(q('.turn-bar [data-action="end"]')), combatStats:r(q('.combat-stats')), harmony:r(q('.mobile-harmony-core'))
              },
              styles: {
                battle:getComputedStyle(q('.battle')).gridTemplateRows,
                arena:getComputedStyle(q('.battle-arena')).gridTemplateRows,
                fieldHeight:getComputedStyle(q('.enemies-field')).height,
                handHeight:getComputedStyle(q('.hand')).height,
                bodyOverflow:getComputedStyle(document.body).overflow,
                htmlOverflow:getComputedStyle(document.documentElement).overflow
              },
              dims:{innerWidth,innerHeight,docW:document.documentElement.scrollWidth,docH:document.documentElement.scrollHeight,bodyW:document.body.scrollWidth,bodyH:document.body.scrollHeight},
              errors:[]
            };
          });
          info.errors = errors;
          fs.writeFileSync('qa-artifacts/battle.json', JSON.stringify(info,null,2));
          console.log('QA_BATTLE_START');
          console.log(JSON.stringify(info,null,2));
          console.log('QA_BATTLE_END');
          await browser.close();
          EOF
          node inspect.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-battle-dom
          path: qa-artifacts/
