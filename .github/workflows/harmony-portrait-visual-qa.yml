name: Harmony Portrait Visual QA
on:
  push:
    branches:
      - qa/harmony-portrait-visual-6e3aea
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 6e3aea335a210f58ab4558e9da835ad3b22cef5f
          path: app
      - name: Assert exact candidate
        run: |
          test "$(git -C app rev-parse HEAD)" = "6e3aea335a210f58ab4558e9da835ad3b22cef5f"
          test -z "$(git -C app status --porcelain)"
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start exact candidate server
        run: |
          cd app
          npm start > /tmp/harmony-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/games/harmony/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Chromium local-test introspection
        run: |
          mkdir -p qa-artifacts
          cat > inspect.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errors = [];
          page.on('console', m => { if (m.type() === 'error') errors.push(`console:${m.text()}`); });
          page.on('pageerror', e => errors.push(`pageerror:${e.message}`));
          await page.goto('http://127.0.0.1:5173/games/harmony/?local=1', { waitUntil: 'networkidle' });
          await page.locator('[data-action="test-new"]').click();
          await page.waitForTimeout(700);
          await page.screenshot({ path: 'qa-artifacts/test-entry-390x844.png', fullPage: true });
          const info = await page.evaluate(() => ({
            bodyText: document.body.innerText,
            buttons: [...document.querySelectorAll('button')].map((b, i) => ({i, text:b.innerText, action:b.dataset.action || '', cls:b.className, hidden:b.hidden, disabled:b.disabled})),
            localStorage: Object.fromEntries(Object.entries(localStorage)),
            appHtml: document.querySelector('#app')?.innerHTML?.slice(0, 50000) ?? '',
            bodyClass: document.body.className,
            htmlClass: document.documentElement.className,
            battle: !!document.querySelector('.battle'),
            dims: {innerWidth, innerHeight, scrollWidth:document.documentElement.scrollWidth, scrollHeight:document.documentElement.scrollHeight}
          }));
          info.errors = errors;
          fs.writeFileSync('qa-artifacts/test-entry.json', JSON.stringify(info, null, 2));
          console.log('QA_STATE_START');
          console.log(JSON.stringify(info, null, 2));
          console.log('QA_STATE_END');
          await browser.close();
          EOF
          node inspect.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmony-test-entry-introspection
          path: qa-artifacts/
