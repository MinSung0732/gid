name: Harmony discard header temporary QA

on:
  push:
    branches:
      - qa/harmony-card-discard-header-main-20260918

jobs:
  discard-header:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Verify diff whitespace
        run: |
          git diff --check
          git diff --check 6df54291ab88cc1a2e8ba6361f1aeb3b411abbcf...HEAD
      - name: Check Harmony syntax
        run: npm run check:harmony
      - name: Run Harmony regression suite
        run: npm run test:harmony
      - name: Start Harmony server
        run: |
          node scripts/serve.cjs > /tmp/harmony-server.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:5173/games/harmony/qa-discard-card-header.html >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/harmony-server.log
          exit 1
      - name: Chromium discard header QA
        run: python scripts/qa-harmony-discard-header.py
