name: mission-hand-flicker-40fb1f8c

on:
  push:
    branches:
      - fix/harmony-hand-flicker-40fb1f8c

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harmony syntax checks
        run: npm run check:harmony
      - name: Harmony tests
        run: npm run test:harmony
      - name: Install Chromium harness
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Chromium hand probe v3
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/mission-hand-flicker-v3.mjs')
          source = path.read_text()
          old = '    storage.clear();\n    const revision = persistence.saveGame(storage, nextPayload, 0);'
          new = '    storage.clear();\n    for (const key of Object.values(persistence.SAVE_KEYS)) window.localStorage.removeItem(key);\n    const revision = persistence.saveGame(storage, nextPayload, 0);'
          if old not in source:
              raise SystemExit('legacy-save isolation patch target not found')
          path.write_text(source.replace(old, new))
          PY
          node scripts/mission-hand-flicker-v3.mjs
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hand-flicker-probe-v3-40fb1f8c
          path: /tmp/hand-flicker-v3
          if-no-files-found: ignore
          retention-days: 2
