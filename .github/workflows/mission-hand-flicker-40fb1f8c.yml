name: mission-hand-flicker-40fb1f8c

on:
  push:
    branches:
      - fix/harmony-hand-flicker-40fb1f8c

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harmony diff whitespace check
        run: |
          git diff --check -- games/harmony
          git diff --check origin/main...HEAD -- games/harmony
      - name: Harmony syntax checks
        run: npm run check:harmony
      - name: Harmony tests
        run: npm run test:harmony
      - name: Install Chromium harness
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Chromium hand probe v3
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/mission-hand-flicker-v3.mjs')
          source = path.read_text()
          source = source.replace(
              '    const storage = window.HarmonyRuntime?.storage;\n    if (!storage) throw new Error("HarmonyRuntime.storage missing");\n    storage.clear();',
              '    const scoped = await import("/games/harmony/scoped-storage.js");\n    const storage = scoped.createScopedStorage(window.localStorage, scoped.GUEST_SCOPE);\n    storage.clear();'
          )
          source = source.replace(
              '      scope: window.HarmonyRuntime.scope,',
              '      scope: storage.scope,'
          )
          source = source.replace(
              '    storage.clear();\n    const revision = persistence.saveGame(storage, nextPayload, 0);',
              '    storage.clear();\n    for (const key of Object.values(persistence.SAVE_KEYS)) window.localStorage.removeItem(key);\n    const revision = persistence.saveGame(storage, nextPayload, 0);'
          )
          source = source.replace(
              '      const installed = await installPayload(page, payload);',
              '      await page.goto("http://127.0.0.1:5173/", { waitUntil: "domcontentloaded" });\n      const installed = await installPayload(page, payload);'
          )
          source = source.replace(
              '      await page.reload({ waitUntil: "domcontentloaded" });',
              '      await page.goto("http://127.0.0.1:5173/games/harmony/?local=1", { waitUntil: "domcontentloaded" });'
          )
          source = source.replace(
              '    handWidth: hand ? Math.round(hand.getBoundingClientRect().width * 10) / 10 : null,\\n    ...extra,',
              '    handWidth: hand ? Math.round(hand.getBoundingClientRect().width * 10) / 10 : null,\\n    handClass: hand?.className || null,\\n    handOverflowX: hand ? getComputedStyle(hand).overflowX : null,\\n    handJustify: hand ? getComputedStyle(hand).justifyContent : null,\\n    handScrollLeft: hand ? Math.round(hand.scrollLeft * 10) / 10 : null,\\n    handClientWidth: hand?.clientWidth ?? null,\\n    handScrollWidth: hand?.scrollWidth ?? null,\\n    ...extra,'
          )
          source = source.replace(
              '  { name: "A-overflow-hand9", kind: "A", first: chosen.contact.id, size: 9 },',
              '  { name: "A-overflow-hand9", kind: "A", first: chosen.contact.id, size: 9 },\n  { name: "B-overflow-hand9", kind: "B", first: chosen.draw.id, size: 9, extraHandLimit: true, capture: true },'
          )
          source = source.replace(
              '  run.battle.cardsPlayedThisTurn = 0;\n  for (const enemy of run.battle.enemies) {',
              '  run.battle.cardsPlayedThisTurn = 0;\n  if (scenario.extraHandLimit) run.inventory = [...new Set([...(run.inventory || []), "relic_ergonomic_perfume_bandolier"])];\n  for (const enemy of run.battle.enemies) {'
          )
          source = source.replace(
              '      if (scenario.capture) stopCast = await startScreencast(page, caseName);',
              '      if (scenario.capture || scenario.kind === "A" || scenario.kind === "B") stopCast = await startScreencast(page, caseName);'
          )
          source = source.replace(
              '    void session.send("Page.screencastFrameAck", { sessionId });',
              '    void session.send("Page.screencastFrameAck", { sessionId }).catch(() => {});'
          )
          source = source.replace(
              '          const cards = [...document.querySelectorAll(".hand > .card")];\n          frames.push({',
              '          const cards = [...document.querySelectorAll(".hand > .card")];\n          const hand = document.querySelector(".hand"), handStyle = hand ? getComputedStyle(hand) : null;\n          frames.push({'
          )
          source = source.replace(
              '            oldNodeCount: cards.filter((card) => card.dataset.probeNode).length,\n            positions:',
              '            oldNodeCount: cards.filter((card) => card.dataset.probeNode).length,\n            handClass: hand?.className || null, handOverflowX: handStyle?.overflowX || null, handJustify: handStyle?.justifyContent || null, handScrollLeft: hand ? Math.round(hand.scrollLeft * 10) / 10 : null,\n            positions:'
          )
          source = source.replace(
              '        afterRenderOldNodes: byLabel["after-render"]?.oldNodeCount ?? null,',
              '        afterRenderOldNodes: byLabel["after-render"]?.oldNodeCount ?? null,\n        afterRenderHandClass: byLabel["after-render"]?.handClass ?? null,\n        afterRenderOverflowX: byLabel["after-render"]?.handOverflowX ?? null,\n        afterRenderJustify: byLabel["after-render"]?.handJustify ?? null,\n        afterRenderScrollLeft: byLabel["after-render"]?.handScrollLeft ?? null,'
          )
          source = source.replace(
              '        microtaskPending: byLabel.microtask?.pendingCount ?? null,',
              '        microtaskPending: byLabel.microtask?.pendingCount ?? null,\n        microtaskHandClass: byLabel.microtask?.handClass ?? null,\n        microtaskOverflowX: byLabel.microtask?.handOverflowX ?? null,\n        microtaskScrollLeft: byLabel.microtask?.handScrollLeft ?? null,'
          )
          source = source.replace(
              '        raf1Drawing: byLabel["raf-1"]?.drawingCount ?? null,',
              '        raf1Drawing: byLabel["raf-1"]?.drawingCount ?? null,\n        raf1HandClass: byLabel["raf-1"]?.handClass ?? null,\n        raf1OverflowX: byLabel["raf-1"]?.handOverflowX ?? null,\n        raf1Justify: byLabel["raf-1"]?.handJustify ?? null,\n        raf1ScrollLeft: byLabel["raf-1"]?.handScrollLeft ?? null,'
          )
          required = [
              'const scoped = await import("/games/harmony/scoped-storage.js")',
              'await page.goto("http://127.0.0.1:5173/", { waitUntil: "domcontentloaded" })',
              'B-overflow-hand9',
              'handOverflowX',
              'microtaskHandClass',
              'relic_ergonomic_perfume_bandolier',
              'screencastFrameAck", { sessionId }).catch',
          ]
          for needle in required:
              if needle not in source:
                  raise SystemExit(f'extended hand probe patch missing: {needle}')
          path.write_text(source)
          PY
          node scripts/mission-hand-flicker-v3.mjs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const { results } = JSON.parse(fs.readFileSync("/tmp/hand-flicker-v3/results.json", "utf8"));
          for (const result of results.filter(({ scenario }) => scenario.kind === "A" || scenario.kind === "B")) {
            const micro = result.probes.find(({ label }) => label === "microtask");
            const raf1 = result.probes.find(({ label }) => label === "raf-1");
            if (!micro || !raf1) throw new Error(`${result.caseName}: missing microtask/rAF1 probe`);
            if (micro.handClass !== raf1.handClass)
              throw new Error(`${result.caseName}: hand class not final before paint: ${micro.handClass} -> ${raf1.handClass}`);
            if (micro.handOverflowX !== raf1.handOverflowX)
              throw new Error(`${result.caseName}: overflow not final before paint: ${micro.handOverflowX} -> ${raf1.handOverflowX}`);
            if (Math.abs((micro.handScrollLeft || 0) - (raf1.handScrollLeft || 0)) > 0.5)
              throw new Error(`${result.caseName}: scroll not final before paint: ${micro.handScrollLeft} -> ${raf1.handScrollLeft}`);
            if (result.scenario.kind === "A" && micro.visibleCount !== result.summary.afterRenderDom)
              throw new Error(`${result.caseName}: no-draw visible count changed in microtask`);
            if (result.scenario.kind === "B" && micro.visibleCount !== result.summary.afterRenderDom - result.summary.drawFeedback)
              throw new Error(`${result.caseName}: draw card visible before draw animation`);
          }
          console.log(`PASS prepaint hand layout assertions: ${results.filter(({ scenario }) => scenario.kind === "A" || scenario.kind === "B").length} cases`);
          NODE
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hand-flicker-probe-v3-40fb1f8c
          path: /tmp/hand-flicker-v3
          if-no-files-found: ignore
          retention-days: 2
