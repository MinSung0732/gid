name: mission-harmony-marquee-verify-90a5c403

on:
  push:
    branches:
      - fix/harmony-card-effect-symbol-layout

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact pushed revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run repository checks
        run: |
          npm run check
          npm test
