<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#235347"><title>결이든 오브제 2048</title><link rel="icon" href="../../public/assets/gyeolideun-logo-icon.png"><link rel="stylesheet" href="./styles.css"><style>[hidden]{display:none!important}.board-wrap,.board,.tile{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}.cell{overflow:visible}.tile{z-index:2;overflow:visible;border-radius:inherit;box-shadow:0 3px 9px #23534716;will-change:transform}.tile.sliding{z-index:4;box-shadow:0 7px 17px #23534724}.tile.merged{z-index:5;animation:mergeBubble .34s cubic-bezier(.18,.8,.3,1.25)}.tile.merged:after{content:"";position:absolute;inset:-10%;pointer-events:none;border:2px solid #8eb69b99;border-radius:50%;background:radial-gradient(circle at 15% 35%,#f8e29abb 0 3%,transparent 4%),radial-gradient(circle at 83% 28%,#8eb69baa 0 4%,transparent 5%),radial-gradient(circle at 80% 78%,#f8e29a99 0 3%,transparent 4%),radial-gradient(circle at 24% 82%,#8eb69a99 0 4%,transparent 5%);animation:scentBubble .55s ease-out forwards}@keyframes mergeBubble{0%{transform:scale(.82)}55%{transform:scale(1.13)}78%{transform:scale(.96)}100%{transform:scale(1)}}@keyframes scentBubble{0%{opacity:.9;transform:scale(.32)}65%{opacity:.65}100%{opacity:0;transform:scale(1.28)}}</style></head><body>
