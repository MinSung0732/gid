<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Harmony battleEndHeal QA</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    body { margin: 0; min-height: 100vh; background: #111; color: #fff; }
    #app { min-height: 100vh; padding: 24px; }
    .run-hud-health-slot { width: 180px; height: 48px; border: 1px solid #777; }
    .battle { position: relative; width: 800px; height: 500px; border: 1px solid #555; }
    .enemy { width: 160px; height: 120px; border: 1px solid #a66; margin: 80px auto; position: relative; }
    .reward-screen { font-size: 32px; padding: 40px; }
  </style>
</head>
<body>
<div id="app">
  <div class="run-hud-health-slot"><span class="health-value">10 / 20</span></div>
  <section class="battle">
    <div class="enemies-field">
      <article class="enemy selected" data-target="0">
        <div class="enemy-hp"><span style="width:5%"></span></div>
      </article>
    </div>
  </section>
</div>
<div id="effects"></div>
<script type="module">
import { createCombatTurnOrchestrator } from "./combat-turn-orchestrator.js";
import { createCombatFeedbackVfx } from "./combat-feedback-vfx.js";
import { getPlayerHealthAnchor } from "./player-vfx-anchor.js";
import { SFX } from "./sound.js?v=20260911-9";

const logs = [];
const events = [];
const addedHealingNodes = new Set();
const removedHealingNodes = new Set();
let healSfxCount = 0;
const push = (type, detail = {}) => {
  const entry = { type, ...detail, at: performance.now() };
  logs.push(entry);
  console.log("[battleEndHeal-QA]", JSON.stringify(entry));
};
SFX.heal = () => {
  healSfxCount += 1;
  push("heal-sfx", { count: healSfxCount });
};

const observer = new MutationObserver((records) => {
  for (const record of records) {
    for (const node of record.addedNodes) {
      if (!(node instanceof Element)) continue;
      if (node.matches?.(".healing-effect")) addedHealingNodes.add(node);
      node.querySelectorAll?.(".healing-effect").forEach((item) => addedHealingNodes.add(item));
    }
    for (const node of record.removedNodes) {
      if (!(node instanceof Element)) continue;
      if (node.matches?.(".healing-effect")) removedHealingNodes.add(node);
      node.querySelectorAll?.(".healing-effect").forEach((item) => removedHealingNodes.add(item));
    }
  }
});
observer.observe(document.body, { childList: true, subtree: true });

const realVfx = createCombatFeedbackVfx({
  combatEffectsEnabled: () => true,
  enemyElement: (index) => document.querySelector(`.enemy[data-target="${index}"]`),
  effectsLayer: () => document.getElementById("effects"),
  formatNumber: (value) => String(value),
  reducedCombatMotion: () => false,
});
const realShowPlayerHealing = realVfx.showPlayerHealing;
realVfx.showPlayerHealing = (amount, options) => {
  const battle = document.querySelector(".battle");
  const anchor = getPlayerHealthAnchor();
  push("before-heal", {
    amount,
    battleExists: Boolean(battle),
    anchorExists: Boolean(anchor),
    anchorConnected: Boolean(anchor?.isConnected),
    anchorClassName: anchor?.className || null,
    options: options || null,
  });
  const returned = realShowPlayerHealing(amount, options);
  const node = anchor?.querySelector(".healing-effect") || null;
  const numberNode = node?.querySelector("strong") || null;
  push("after-append", {
    exists: Boolean(node),
    nodeConnected: Boolean(node?.isConnected),
    anchorConnected: Boolean(anchor?.isConnected),
    returnedThenable: Boolean(returned && typeof returned.then === "function"),
    text: numberNode?.textContent || null,
  });
  window.setTimeout(() => {
    const rect = numberNode?.getBoundingClientRect();
    push("visible-sample", {
      nodeConnected: Boolean(node?.isConnected),
      anchorConnected: Boolean(anchor?.isConnected),
      text: numberNode?.textContent || null,
      opacity: numberNode ? Number(getComputedStyle(numberNode).opacity) : 0,
      animationName: numberNode ? getComputedStyle(numberNode).animationName : null,
      width: rect?.width || 0,
      height: rect?.height || 0,
    });
  }, 260);
  queueMicrotask(() => {
    push("microtask", {
      existsOnAnchor: Boolean(anchor?.querySelector(".healing-effect")),
      nodeConnected: Boolean(node?.isConnected),
      anchorConnected: Boolean(anchor?.isConnected),
    });
  });
  requestAnimationFrame(() => {
    push("raf", {
      existsOnAnchor: Boolean(anchor?.querySelector(".healing-effect")),
      nodeConnected: Boolean(node?.isConnected),
      anchorConnected: Boolean(anchor?.isConnected),
      rewardVisible: Boolean(document.querySelector(".reward-screen")),
    });
  });
  return returned;
};

const run = {
  phase: "battle",
  hp: 10,
  maxHp: 20,
  battle: {
    enemyPhase: false,
    actingEnemy: null,
    shield: 0,
    enemies: [{ id: "qa_enemy", hp: 1, maxHp: 20, material: "glass" }],
  },
};
let locked = false;
const engine = {
  executePlayerTurnEnd() { events.push("player-turn-end"); return true; },
  executeSingleEnemyAction() {
    events.push("enemy-action");
    return { type: "guard", shieldGained: 0, playerDebuffs: [], hits: [], damage: 0, blocked: 0 };
  },
  executeRoundEnd(current) {
    events.push("round-end");
    current.battle.enemies[0].hp = 0;
    current.phase = "reward";
    current._healingFeedback = 2;
    current._damageFeedback = [{ target: "enemy", targetIndex: 0, amount: 1, statusId: "burning" }];
    current._enemyHitFeedback = [];
    current._statusProcFeedback = [];
  },
};
const feedback = {
  ...realVfx,
  showAbsorbLoss: () => {},
  showAbsorbGain: () => {},
  showShieldGain: () => {},
  getEnemyElement: (index) => document.querySelector(`.enemy[data-target="${index}"]`),
  getPlayerImpactPoint: () => ({ x: 100, y: 100 }),
  updatePlayerHealthFeedback: () => {},
  showPlayerContactImpact: () => {},
  showShieldBlock: () => {},
  showPlayerImpactShieldBlock: () => {},
  animateEnemyContactAttack: async () => {},
  showEnemyActionPopup: () => {},
  showEnemyShieldBlock: () => {},
  showHitFeedback: () => {},
  showImpurityOverflowQueue: async () => {},
  showPlayerDeath: async () => {},
  showEnemyHitQueue: async () => { events.push("enemy-hit-queue"); },
  showStatusProcQueue: async () => { events.push("status-proc-queue"); },
  showStatusDamageQueue: async () => { events.push("status-damage-queue"); },
  showMonsterDeath: async () => {
    const enemy = document.querySelector('.enemy[data-target="0"]');
    if (enemy) {
      enemy.classList.add("monster-dying");
      events.push("monster-death");
    }
    await new Promise((resolve) => setTimeout(resolve, 120));
  },
  stageDrawFeedback: () => {},
  showShuffleFeedback: async () => {},
  showDrawFeedback: async () => {},
  playPlayerStatusHit: () => {},
  showEnrageDamage: () => {},
};
const battleMarkup = () => `
  <div class="run-hud-health-slot"><span class="health-value">${run.hp} / ${run.maxHp}</span></div>
  <section class="battle">
    <div class="enemies-field">
      <article class="enemy selected" data-target="0">
        <div class="enemy-hp"><span style="width:${run.battle.enemies[0].hp > 0 ? "5%" : "0"}"></span></div>
      </article>
    </div>
  </section>`;
const render = () => {
  const before = getPlayerHealthAnchor();
  const healing = before?.querySelector(".healing-effect") || null;
  push("render-before", {
    phase: run.phase,
    healingExists: Boolean(healing),
    healingConnected: Boolean(healing?.isConnected),
    anchorConnected: Boolean(before?.isConnected),
  });
  document.getElementById("app").innerHTML =
    run.phase === "reward"
      ? '<section class="reward-screen">REWARD</section>'
      : battleMarkup();
  push("render-after", {
    phase: run.phase,
    oldHealingConnected: Boolean(healing?.isConnected),
    oldAnchorConnected: Boolean(before?.isConnected),
    battleExists: Boolean(document.querySelector(".battle")),
    newAnchorConnected: Boolean(getPlayerHealthAnchor()?.isConnected),
  });
};
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, Math.min(ms, 30)));
const orchestrator = createCombatTurnOrchestrator({
  engine,
  enemyDefinitionFor: () => ({ material: "glass" }),
  getRun: () => run,
  getMeta: () => ({}),
  getCardAnimating: () => locked,
  setCardAnimating: (value) => { locked = value; events.push(`locked:${value}`); },
  save: () => events.push("save"),
  render,
  sleep,
  feedback,
});

await orchestrator.handleEndTurn();
await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
observer.disconnect();
window.__qaResult = {
  phase: run.phase,
  events,
  logs,
  healSfxCount,
  addedHealingUnique: addedHealingNodes.size,
  removedHealingUnique: removedHealingNodes.size,
  rewardVisible: Boolean(document.querySelector(".reward-screen")),
  finalHealingCount: document.querySelectorAll(".healing-effect").length,
};
console.log("[battleEndHeal-QA-result]", JSON.stringify(window.__qaResult));
</script>
</body>
</html>
