  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173e36" />
    <title>Project Harmony · 결이든 조향 로그라이크</title>

    <link rel="stylesheet" href="./combat-super-fx.css?v=20260913-1" />
    <link rel="stylesheet" href="./combat-super-fx-epic.css?v=20260914-6" />
    <link rel="stylesheet" href="./combat-super-stage-hotfix.css?v=20260913-2" />
    <link rel="stylesheet" href="./economy-ui.css?v=20260913-1" />
    <link rel="stylesheet" href="./marquee.css?v=20260913-2" />
    <link rel="stylesheet" href="./settings-ui.css?v=20260915-2" />
    <link rel="stylesheet" href="./player-support-ui.css?v=20260914-5" />
    <link rel="stylesheet" href="./symbol-centering-fix.css?v=20260914-1" />
    <link rel="stylesheet" href="./draw-animation-fix.css?v=20260914-3" />
    <link rel="stylesheet" href="./impurity-ui.css?v=20260915-3" />
    <link rel="stylesheet" href="./combat-resource-layout-fix.css?v=20260915-1" />
    <link rel="stylesheet" href="./pc-frame-ui.css?v=20260915-1" />
    <link rel="stylesheet" href="./special-room-pc.css?v=20260915-2" />
    <link rel="stylesheet" href="./combat-layout-phase2.css?v=20260915-1" />
    <link rel="stylesheet" href="./combat-layout-phase2-finish.css?v=20260915-10" />
    <link rel="stylesheet" href="./harmony-core-ui.css?v=20260915-4" />
    <link rel="stylesheet" href="./card-hand-ui.css?v=20260915-1" />
    <link
      rel="icon"
      href="../../public/assets/gyeolideun-logo-transparent.png"
    />
  </head>
  <body>
    <header>
      <a href="../">결이든 <small>GYEOLIDEUN</small></a
      ><span>PROJECT HARMONY <b>LOCAL PROTOTYPE</b></span>
      <div class="header-actions">
        <button id="mobile-preview" hidden>모바일 화면으로 보기</button
        ><button id="tools-toggle">도감 및 가이드</button
        ><button id="settings-toggle" type="button" aria-haspopup="dialog">설정</button>
      </div>
    </header>
    <main>
      <div id="notice" role="status"></div>
      <div id="app"></div>
    </main>
    <dialog id="battle-log">
      <div class="dialog-head">
        <div>
          <small>BATTLE HISTORY</small>
          <h2>전투 기록</h2>
        </div>
        <button id="battle-log-close">닫기</button>
      </div>
      <div id="battle-log-list"></div>
    </dialog>
    <dialog id="run-summary">
      <div class="dialog-head">
        <div>
          <small>CURRENT JOURNEY</small>
          <h2>내 덱 · 여정 아이템</h2>
        </div>
        <button id="run-summary-close">닫기</button>
      </div>
      <div class="run-summary-body">
        <section>
          <h3 id="run-deck-title">내 덱</h3>
          <div id="run-deck-list" class="summary-card-grid"></div>
        </section>
        <section>
          <h3 id="run-item-title">이번 여정 아이템</h3>
          <div id="run-item-list" class="summary-item-grid"></div>
        </section>
      </div>
    </dialog>
    <dialog id="settings" class="settings-dialog" aria-labelledby="settings-title">
      <div class="dialog-head settings-head">
        <div>
          <small>GAME SETTINGS</small>
          <h2 id="settings-title">설정</h2>
        </div>
        <button id="settings-close" type="button">닫기</button>
      </div>
      <div class="settings-tabs" role="tablist" aria-label="설정 분류">
        <button id="settings-tab-gameplay" type="button" role="tab" data-settings-tab="gameplay" aria-controls="settings-panel-gameplay" aria-selected="true">게임플레이</button>
        <button id="settings-tab-sound" type="button" role="tab" data-settings-tab="sound" aria-controls="settings-panel-sound" aria-selected="false" tabindex="-1">사운드</button>
        <button id="settings-tab-other" type="button" role="tab" data-settings-tab="other" aria-controls="settings-panel-other" aria-selected="false" tabindex="-1">기타</button>
      </div>
      <div class="settings-body">
        <section id="settings-panel-gameplay" class="settings-panel" role="tabpanel" aria-labelledby="settings-tab-gameplay" data-settings-panel="gameplay">
          <p class="settings-section-label">전투 화면</p>
          <label class="settings-option" for="combat-fx-enabled">
            <span><strong>공격 이펙트 켜기</strong><small>접촉·비접촉 공격의 타격, 암전 및 충전 효과를 표시합니다.</small></span>
            <input id="combat-fx-enabled" type="checkbox" checked />
          </label>
        </section>
        <section id="settings-panel-sound" class="settings-panel" role="tabpanel" aria-labelledby="settings-tab-sound" data-settings-panel="sound" hidden>
          <p class="settings-section-label">오디오</p>
          <label class="settings-volume" for="settings-sfx-volume">
            <span><strong>효과음 볼륨</strong><small>카드, 공격 및 전투 알림 소리의 크기를 조절합니다.</small></span>
            <span class="settings-volume-control">
              <input id="settings-sfx-volume" type="range" min="0" max="100" step="5" value="80" aria-label="효과음 볼륨" aria-valuetext="80퍼센트" />
              <output for="settings-sfx-volume">80</output>
            </span>
          </label>
          <label class="settings-option" for="sfx-enabled">
            <span><strong>효과음 켜기</strong><small>게임의 모든 효과음을 재생합니다.</small></span>
            <input id="sfx-enabled" type="checkbox" checked />
          </label>
          <label class="settings-option" for="bgm-enabled">
            <span><strong>배경음 켜기</strong><small>배경음 음원은 추후 추가될 예정입니다.</small></span>
            <input id="bgm-enabled" type="checkbox" checked />
          </label>
        </section>
        <section id="settings-panel-other" class="settings-panel" role="tabpanel" aria-labelledby="settings-tab-other" data-settings-panel="other" hidden>
          <p class="settings-section-label">게임 정보</p>
          <div class="settings-info-row"><span><strong>게임 버전</strong><small>Project Harmony 현재 빌드</small></span><b id="settings-game-version">v0.2.0</b></div>
          <a class="settings-product-link" href="https://smartstore.naver.com/k_id/products/13729418021" target="_blank" rel="noopener noreferrer">
            <span><strong>결이든 제품 사이트</strong><small>네이버 스마트스토어에서 결이든 제품을 확인하세요.</small></span>
            <b>사이트 열기 ↗</b>
          </a>
        </section>
      </div>
    </dialog>
    <dialog id="tools">
      <div class="dialog-head">
        <h2>도감 및 가이드</h2>
        <button id="tools-close">닫기</button>
      </div>
      <section class="laboratory-codex" aria-label="도감 및 가이드">
        <div id="codex-progress"></div>
        <div id="codex-major" class="codex-tabs codex-tabs-major"></div>
        <div id="codex-middle" class="codex-tabs"></div>
        <div id="codex-minor" class="codex-tabs codex-tabs-minor"></div>
        <div id="codex-view"></div>
      </section>
    </dialog>
    <script type="module" src="./main.js?v=20260914-141"></script>
    <script type="module" src="./pc-frame-ui.js?v=20260915-6"></script>
    <script type="module" src="./enemy-hp-visual-guard.js?v=20260914-1"></script>
    <script type="module" src="./combat-floating-text-portal.js?v=20260914-1"></script>
    <script type="module" src="./combat-super-fx-epic.js?v=20260914-6"></script>
    <script type="module" src="./settings-ui.js?v=20260915-3"></script>
    <script type="module" src="./combat-super-stage-hotfix.js?v=20260913-2"></script>
    <script type="module" src="./card-picker-ui.js?v=20260913-2"></script>
    <script type="module" src="./card-picker-polish.js?v=20260913-1"></script>
    <script type="module" src="./run-summary-filter.js?v=20260913-1"></script>
  </body>
</html>
