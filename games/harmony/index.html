<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173e36" />
    <title>Project Harmony · 결이든 조향 로그라이크</title>
    <link rel="stylesheet" href="./styles.css?v=20260910-2" />
    <link
      rel="icon"
      href="../../public/assets/gyeolideun-logo-transparent.png"
    />
  </head>
  <body>
    <header>
      <a href="../">결이든 <small>GYEOLIDEUN</small></a
      ><span>PROJECT HARMONY <b>LOCAL PROTOTYPE</b></span>
      <div class="header-actions">
        <label class="sfx-volume">
          <span aria-hidden="true">◖</span>
          <span class="sr-only">효과음 볼륨</span>
          <input
            type="range"
            min="0"
            max="100"
            step="5"
            value="80"
            aria-label="효과음 볼륨"
            aria-valuetext="80퍼센트"
          />
          <output>80</output>
        </label>
        <button id="sfx-toggle" type="button">소리 켜짐</button>
        <button id="mobile-preview" hidden>모바일 화면으로 보기</button
        ><button id="tools-toggle">전투도감</button>
      </div>
    </header>
    <main>
      <div id="notice" role="status"></div>
      <div id="app"></div>
    </main>
    <dialog id="battle-log">
      <div class="dialog-head">
        <div>
          <small>BATTLE HISTORY</small>
          <h2>전투 기록</h2>
        </div>
        <button id="battle-log-close">닫기</button>
      </div>
      <div id="battle-log-list"></div>
    </dialog>
    <dialog id="run-summary">
      <div class="dialog-head">
        <div>
          <small>CURRENT JOURNEY</small>
          <h2>내 덱 · 여정 아이템</h2>
        </div>
        <button id="run-summary-close">닫기</button>
      </div>
      <div class="run-summary-body">
        <section>
          <h3 id="run-deck-title">내 덱</h3>
          <div id="run-deck-list" class="summary-card-grid"></div>
        </section>
        <section>
          <h3 id="run-item-title">이번 여정 아이템</h3>
          <div id="run-item-list" class="summary-item-grid"></div>
        </section>
      </div>
    </dialog>
    <dialog id="glossary">
      <div class="dialog-head">
        <div>
          <small>GAME GLOSSARY</small>
          <h2>용어 설명</h2>
        </div>
        <button id="glossary-close">닫기</button>
      </div>
      <div id="glossary-list"></div>
    </dialog>
    <dialog id="tools">
      <div class="dialog-head">
        <h2>전투도감</h2>
        <button id="tools-close">닫기</button>
      </div>
      <section class="laboratory-codex" aria-label="전투도감">
        <div id="codex-progress"></div>
        <div id="codex-major" class="codex-tabs codex-tabs-major"></div>
        <div id="codex-middle" class="codex-tabs"></div>
        <div id="codex-minor" class="codex-tabs codex-tabs-minor"></div>
        <div id="codex-view"></div>
      </section>
    </dialog>
    <script type="module" src="./main.js?v=20260910-4"></script>
  </body>
</html>
