<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#235347"><meta name="description" content="향기 그림의 짝을 찾으며 기억을 깨우는 결이든 카드 게임"><title>향기의 기억 · 결이든</title><link rel="icon" type="image/png" href="../../public/assets/gyeolideun-logo-icon.png"><link rel="stylesheet" href="./styles.css"></head><body>
<header><a class="brand" href="../">결이든<small>GYEOLIDEUN</small></a><a class="back" href="../">게임 목록</a></header>
<main><section class="game-shell"><div class="game-heading"><div><p>SCENT MEMORY</p><h1>향기의 기억</h1></div><button id="sound" type="button" aria-pressed="false">소리 꺼짐</button></div>
<div class="stats"><div><span>레벨</span><strong id="level">1 / 5</strong></div><div><span>남은 시간</span><strong id="time">25</strong></div><div><span>찾은 향기</span><strong id="matches">0 / 3</strong></div></div><div class="challenge-stats" id="challenge-stats"><span id="lives-stat" hidden>목숨 <strong id="lives">♥ ♥ ♥</strong></span><span>누적 점수 <strong id="challenge-score">0</strong></span></div><div class="timer-track"><i id="timer-bar"></i></div>
<div id="board" class="board" aria-label="같은 향기 그림 찾기 카드판"></div>
<section id="cover" class="cover"><p id="cover-kicker">LEVEL 1</p><h2 id="cover-title">향기 조각을 기억해보세요</h2><p id="cover-copy">처음 2초 동안 카드가 공개돼요.<br>같은 그림 두 장을 찾아주세요.</p><button id="start" type="button">레벨 1 시작하기</button></section>
<section id="level-result" class="cover" hidden><p id="result-kicker">LEVEL CLEAR</p><h2 id="result-title">모든 향기를 찾았어요!</h2><p id="result-copy"></p><div id="record-box" class="record-box" hidden><span>최고 점수 <strong id="best-score">0</strong></span><span>최고 레벨 <strong id="best-level">5</strong></span></div><button id="next" type="button">다음 레벨</button><div id="record-share-actions" class="record-share-actions" hidden><button id="kakao-record-share" type="button">카카오톡 공유하기</button><button id="link-record-share" type="button">기록 링크로 공유하기</button><button id="record-share" class="record-share" type="button">최고 기록 이미지로 공유하기</button></div><p id="share-status" class="share-status" role="status"></p><a href="../">게임 목록으로</a></section></section>
<p class="tip">같은 향기 그림 두 장을 연속으로 선택하세요. 챌린지에서는 오답마다 목숨이 줄어요.</p></main><footer>향기는 사라져도 좋은 기억은 오래 머물러요.</footer><script type="module" src="./main.js"></script><script type="module" src="../../public/mobile-preview.js"></script></body></html>
